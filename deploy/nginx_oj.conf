# ==============================================================================
# HOJ 教学平台 - Nginx 统一网关反向代理配置
# 适用于：华为 RH2288 V3 生产环境
# 放置路径：/etc/nginx/conf.d/hoj_platform.conf 或 /etc/nginx/sites-available/default
# ==============================================================================

upstream course_api {
    server 127.0.0.1:8100 max_fails=3 fail_timeout=10s;
    keepalive 32;
}

upstream course_web {
    server 127.0.0.1:3100 max_fails=3 fail_timeout=10s;
    keepalive 32;
}

upstream hustoj_raw {
    server 127.0.0.1:8080 max_fails=3 fail_timeout=10s;
    keepalive 16;
}

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    # 允许上传大附件、测试数据与大题单
    client_max_body_size 128m;
    client_body_buffer_size 16m;

    # 启用 Gzip 压缩，减少校园网带宽消耗
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml application/json application/javascript application/xml+rss application/atom+xml image/svg+xml;

    # --------------------------------------------------------------------------
    # 1. 教学服务 API 路由
    # --------------------------------------------------------------------------
    location /api/ {
        proxy_pass http://course_api;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # 若接入校园统一身份认证 (CAS / SAML / Keycloak)，可在此注入学号头
        # proxy_set_header X-Remote-User $remote_user;

        # 支持实时状态流与判题推送 (SSE / EventSource)
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    # --------------------------------------------------------------------------
    # 2. 原生 HUSTOJ 界面代理 (如用于后台题目导入、管理员原版界面)
    # --------------------------------------------------------------------------
    location /oj/ {
        proxy_pass http://hustoj_raw/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # --------------------------------------------------------------------------
    # 3. Next.js 前端静态资源缓存优化
    # --------------------------------------------------------------------------
    location /_next/static/ {
        proxy_pass http://course_web;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        expires 365d;
        access_log off;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # --------------------------------------------------------------------------
    # 4. 前端应用主路由 (Next.js SSR / Pages)
    # --------------------------------------------------------------------------
    location / {
        proxy_pass http://course_web;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_read_timeout 60s;
    }
}
