- slug: lanqiao-b01-p06-huffuman
  seq: 6
  title: 基础练习 Huffuman树
  knowledge:
  - 蓝桥杯-基础练习
  difficulty: medium
  statement: 'Huffman树在编码中有着广泛的应用。在这里，我们只关心Huffman树的构造过程。

    　　给出一列数{pi}={p0, p1, …, pn-1}，用这列数构造Huffman树的过程如下：

    　　1. 找到{pi}中最小的两个数，设为pa和pb，将pa和pb从{pi}中删除掉，然后将它们的和加入到{pi}中。这个过程的费用记为pa + pb。

    　　2. 重复步骤1，直到{pi}中只剩下一个数。

    　　在上面的操作过程中，把所有的费用相加，就得到了构造Huffman树的总费用。

    　　本题任务：对于给定的一个数列，现在请你求出用该数列构造Huffman树的总费用。


    　　例如，对于数列{pi}={5, 3, 8, 2, 9}，Huffman树的构造过程如下：

    　　1. 找到{5, 3, 8, 2, 9}中最小的两个数，分别是2和3，从{pi}中删除它们并将和5加入，得到{5, 8, 9, 5}，费用为5。

    　　2. 找到{5, 8, 9, 5}中最小的两个数，分别是5和5，从{pi}中删除它们并将和10加入，得到{8, 9, 10}，费用为10。

    　　3. 找到{8, 9, 10}中最小的两个数，分别是8和9，从{pi}中删除它们并将和17加入，得到{10, 17}，费用为17。

    　　4. 找到{10, 17}中最小的两个数，分别是10和17，从{pi}中删除它们并将和27加入，得到{27}，费用为27。

    　　5. 现在，数列中只剩下一个数27，构造过程结束，总费用为5+10+17+27=59。


    ### 输入格式

    输入的第一行包含一个正整数n（n<=100）。

    接下来是n个正整数，表示p0, p1, …, pn-1，每个数不超过1000。


    ### 输出格式

    输出用这些数构造Huffman树的总费用。'
  samples:
  - input: '5

      5 3 8 2 9

      '
    output: '59

      '
  tests:
  - input: '2

      42 468

      '
    output: '510

      '
  - input: '5

      335 501 170 725 479

      '
    output: '4925

      '
  - input: '10

      359 963 465 706 146 282 828 962 492 996

      '
    output: '19773

      '
  - input: '15

      943 828 437 392 605 903 154 293 383 422 717 719 896 448 727

      '
    output: '33948

      '
  - input: '20

      772 539 870 913 668 300 36 895 704 812 323 334 674 665 142 712 254 869 548 645

      '
    output: '48699

      '
- slug: lanqiao-b01-p07
  seq: 7
  title: 基础练习 高精度加法
  knowledge:
  - 蓝桥杯-基础练习
  difficulty: medium
  statement: '输入两个整数a和b，输出这两个整数的和。a和b都不超过100位。


    由于a和b都比较大，所以不能直接使用语言中的标准数据类型来存储。对于这种问题，一般使用数组来处理。

    　　定义一个数组A，A[0]用于存储a的个位，A[1]用于存储a的十位，依此类推。同样可以用一个数组B来存储b。

    　　计算c = a + b的时候，首先将A[0]与B[0]相加，如果有进位产生，则把进位（即和的十位数）存入r，把和的个位数存入C[0]，即C[0]等于(A[0]+B[0])%10。然后计算A[1]与B[1]相加，这时还应将低位进上来的值r也加起来，即C[1]应该是A[1]、B[1]和r三个数的和．如果又有进位产生，则仍可将新的进位存入到r中，和的个位存到C[1]中。依此类推，即可求出C的所有位。

    　　最后将C输出即可。


    ### 输入格式

    输入包括两行，第一行为一个非负整数a，第二行为一个非负整数b。两个整数都不超过100位，两数的最高位都不是0。


    ### 输出格式

    输出一行，表示a + b的值。'
  samples:
  - input: '20100122201001221234567890

      2010012220100122

      '
    output: '20100122203011233454668012

      '
  tests:
