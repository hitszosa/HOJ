- slug: lanqiao-b01-p16
  seq: 16
  title: 基础练习 完美的代价
  knowledge:
  - 蓝桥杯-基础练习
  difficulty: medium
  statement: '回文串，是一种特殊的字符串，它从左往右读和从右往左读是一样的。小龙龙认为回文串才是完美的。现在给你一个串，它不一定是回文的，请你计算最少的交换次数使得该串变成一个完美的回文串。

    　　交换的定义是：交换两个相邻的字符

    　　例如mamad

    　　第一次交换 ad : mamda

    　　第二次交换 md : madma

    　　第三次交换 ma : madam (回文！完美！)


    ### 输入格式

    第一行是一个整数N，表示接下来的字符串的长度(N <= 8000)

    第二行是一个字符串，长度为N.只包含小写字母


    ### 输出格式

    如果可能，输出最少的交换次数。

    否则输出Impossible'
  samples:
  - input: '5

      mamad

      '
    output: '3

      '
  tests:
  - input: '24

      iloveyouxxxxxxxxuoyevoli

      '
    output: '0

      '
  - input: '7999

      

      '
    output: '3050889

      '
  - input: '9

      ffdejjell

      '
    output: '14

      '
  - input: '42

      hqghumeaylnlfdxfircvscxggbwkfnqduxwfnfozvs

      '
    output: 'Impossible

      '
  - input: '58

      fkgikmvqufokkuuiwqbfugwwwukigsvobbsygkokyuwgbmuqgkoqfjuiwj

      '
    output: '214

      '
- slug: lanqiao-b01-p17
  seq: 17
  title: 基础练习 数的读法
  knowledge:
  - 蓝桥杯-基础练习
  difficulty: medium
  statement: 'Tom教授正在给研究生讲授一门关于基因的课程，有一件事情让他颇为头疼：一条染色体上有成千上万个碱基对，它们从0开始编号，到几百万，几千万，甚至上亿。

    　　比如说，在对学生讲解第1234567009号位置上的碱基时，光看着数字是很难准确的念出来的。

    　　所以，他迫切地需要一个系统，然后当他输入12 3456 7009时，会给出相应的念法：

    　　十二亿三千四百五十六万七千零九

    　　用汉语拼音表示为

    　　shi er yi san qian si bai wu shi liu wan qi qian ling jiu

    　　这样他只需要照着念就可以了。

    　　你的任务是帮他设计这样一个系统：给定一个阿拉伯数字串，你帮他按照中文读写的规范转为汉语拼音字串，相邻的两个音节用一个空格符格开。

    　　注意必须严格按照规范，比如说“10010”读作“yi wan ling yi shi”而不是“yi wan ling shi”，“100000”读作“shi
    wan”而不是“yi shi wan”，“2000”读作“er qian”而不是“liang qian”。


    ### 输入格式

    有一个数字串，数值大小不超过2,000,000,000。


    ### 输出格式

    是一个由小写英文字母，逗号和空格组成的字符串，表示该数的英文读法。'
  samples:
  - input: '1234567009

      '
    output: 'shi er yi san qian si bai wu shi liu wan qi qian ling jiu

      '
  tests:
  - input: '340

      '
    output: 'san bai si shi

      '
  - input: '2200

      '
    output: 'er qian er bai

      '
  - input: '5000

      '
    output: 'wu qian

      '
  - input: '10000

      '
    output: 'yi wan

      '
  - input: '10003

      '
    output: 'yi wan ling san

      '
- slug: lanqiao-b01-p18-sine
  seq: 18
  title: 基础练习 Sine之舞
  knowledge:
  - 蓝桥杯-基础练习
  difficulty: medium
  statement: '最近FJ为他的奶牛们开设了数学分析课，FJ知道若要学好这门课，必须有一个好的三角函数基本功。所以他准备和奶牛们做一个“Sine之舞”的游戏，寓教于乐，提高奶牛们的计算能力。

    　　不妨设

    　　An=sin(1–sin(2+sin(3–sin(4+…sin(n))…)

    　　Sn=(…(A1+n)A2+n-1)A3+…+2)An+1

    　　FJ想让奶牛们计算Sn的值，请你帮助FJ打印出Sn的完整表达式，以方便奶牛们做题。


    ### 输入格式

    仅有一个数：N<201。


    ### 输出格式

    请输出相应的表达式Sn，以一个换行符结束。输出中不得含有多余的空格或换行、回车符。'
  samples:
  - input: '3

      '
    output: '((sin(1)+3)sin(1–sin(2))+2)sin(1–sin(2+sin(3)))+1

      '
  tests:
  - input: '1

      '
    output: 'sin(1)+1

      '
