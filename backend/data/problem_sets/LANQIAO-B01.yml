- slug: lanqiao-b01-p11
  seq: 11
  title: 基础练习 时间转换
  knowledge:
  - 蓝桥杯-基础练习
  difficulty: medium
  statement: '给定一个以秒为单位的时间t，要求用“<H>:<M>:<S>”的格式来表示这个时间。<H>表示时间，<M>表示分钟，而<S>表示秒，它们都是整数且没有前导的“0”。例如，若t=0，则应输出是“0:0:0”；若t=3661，则输出“1:1:1”。


    ### 输入格式

    输入只有一行，是一个整数t（0<=t<=86399）。


    ### 输出格式

    输出只有一行，是以“<H>:<M>:<S>”的格式所表示的时间，不包括引号。'
  samples:
  - input: '0

      '
    output: '0:0:0

      '
  tests:
  - input: '0

      '
    output: '0:0:0

      '
  - input: '3661

      '
    output: '1:1:1

      '
  - input: '5436

      '
    output: '1:30:36

      '
  - input: '86399

      '
    output: '23:59:59

      '
  - input: '12345

      '
    output: '3:25:45

      '
- slug: lanqiao-b01-p12
  seq: 12
  title: 基础练习 字符串对比
  knowledge:
  - 蓝桥杯-基础练习
  difficulty: medium
  statement: '给定两个仅由大写字母或小写字母组成的字符串(长度介于1到10之间)，它们之间的关系是以下4中情况之一：

    　　1：两个字符串长度不等。比如 Beijing 和 Hebei

    　　2：两个字符串不仅长度相等，而且相应位置上的字符完全一致(区分大小写)，比如 Beijing 和 Beijing

    　　3：两个字符串长度相等，相应位置上的字符仅在不区分大小写的前提下才能达到完全一致（也就是说，它并不满足情况2）。比如 beijing 和 BEIjing

    　　4：两个字符串长度相等，但是即使是不区分大小写也不能使这两个字符串一致。比如 Beijing 和 Nanjing

    　　编程判断输入的两个字符串之间的关系属于这四类中的哪一类，给出所属的类的编号。


    ### 输入格式

    包括两行，每行都是一个字符串。


    ### 输出格式

    仅有一个数字，表明这两个字符串的关系编号

    输出样例:

    3'
  samples:
  - input: 'BEIjing

      '
    output: '3

      '
  tests:
  - input: 'QQ

      MSN

      '
    output: '1

      '
  - input: 'mSn

      mSn

      '
    output: '2

      '
  - input: 'MSn

      MsN

      '
    output: '3

      '
  - input: 'MSN

      MQN

      '
    output: '4

      '
