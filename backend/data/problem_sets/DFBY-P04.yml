problems:
- slug: dfby-p04-p01
  seq: 1
  title: 隐藏的最大整数
  knowledge:
  - 字符串
  difficulty: easy
  statement: "今天是个好日子，整数小伙伴们又一起出来聚会了。大家商议决定：今天玩捉迷藏！ 玩法很简单，就是把藏在一个长长的字符串中（任何两个人都不会并排藏在一起）数字伙伴找出来。而且，因为伙伴们太多，只找到此次藏起来的最大的那个伙伴就可以了。并且，大家一致同意，让“1”做第一个找人的人——当然，事先，他并不知道到底有哪些伙伴藏起来了……\
    \  \n\n游戏开始了。“1”是一个很聪明的人，很快，他就把最大的那个伙伴找出来了……\n \n如果你是“1”，你能写个程序来解决这件事情么？  \n请注意：隐藏在字符串中的整数不会以0开头，也就是不存在这种字符串*a032AB342。\n\
    \n### 输入格式\n只有一个字符串，这里面藏有很多的整数小伙伴。\n\n### 输出格式\n只有一个整数，表示藏在其中的最大的那个整数小伙伴的位置（整数第一个数字在原串中的位置）。"
  samples:
  - input: '*((*-a32AB342+//32143abAA

      '
    output: '17

      '
  tests:
  - input: '*((*-a32AB342+//

      '
    output: '11

      '
- slug: dfby-p04-p02
  seq: 2
  title: 最长姓名的汉语拼音
  knowledge:
  - 字符串
  difficulty: easy
  statement: "A同学的班上有n名同学，作为班长的A同学记录下班级n个同学的姓名的汉语拼音（大家名字的拼音互不相同），他想知道最长的拼音是哪个，请你编程帮他找一下（请注意：如果有多个最长的拼音，请输出字典码最大的）。\n\
    \n### 输入格式\n第1行有一个整数n，代表有n名同学（n<=1000） \n接下来n行，每行有1个同学的拼音（拼音由小写字母组成，不含空格）\n\n\
    ### 输出格式\n请输出最长的拼音，如果有多个，请输出字典码最大的拼音。"
  samples:
  - input: '3

      lihua

      xiaoming

      xiaozhao

      '
    output: 'xiaozhao

      '
  tests:
  - input: '3

      lihua

      xiaoming

      xiaozhao

      '
    output: 'xiaozhao

      '
  - input: '5

      admin

      qwer

      rfvc

      qw

      admix

      '
    output: 'admix

      '
- slug: dfby-p04-p03
  seq: 3
  title: 趣味填空
  knowledge:
  - 字符串
  difficulty: easy
  statement: '小华的寒假作业上，有这样一个趣味填空题： 给出用等号连接的两个整数，如“1234＝127”。当然，现在这个等号是不成立的。题目让你在左边的整数中间某个位置插入一个加号，看有没有可能让等号成立。以上面的式子为例，如果写成123+4=127，这就可以了。
    请你编写一个程序来解决它。


    ### 输入格式

    只有那个不相等的式子。已知，等号两边的整数都不会超过2000000000。


    ### 输出格式

    如果存在这样的方案，请输出那个正确的式子。如果不存在解决方案，请输出“Impossible!”（引号中的部分）。'
  samples:
  - input: '1234=127

      '
    output: '123+4=127

      '
  tests:
  - input: '123=15

      '
    output: '12+3=15

      '
