- slug: dfby-p04-p08
  seq: 8
  title: 计算表达式
  knowledge:
  - 字符串
  difficulty: easy
  statement: '表达式的形式如：3+56-4 其中, 运算数为一位整数,运算符为 +、-、 三种，且运算符没有优先级的区分，一律自左向右计算。 如上例的计算过程为：3+56-4=86-4=48-4=44


    ### 输入格式

    一行，即表达式字符串（长度小于100）


    ### 输出格式

    一个整数，即表达式的计算结果（结果在-20000至20000之间）'
  samples:
  - input: '3+5*6-4

      '
    output: '44

      '
  tests:
  - input: '3+5*6

      '
    output: '48

      '
