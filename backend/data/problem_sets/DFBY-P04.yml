- slug: dfby-p04-p17
  seq: 17
  title: 字典排序
  knowledge:
  - 字符串
  difficulty: easy
  statement: '输入N（N<=10）个不超过4位的整数，并要求按字典顺序（字典顺序的方法：先比较第一个数字，小者在先，若相同再比较第2位数字，以此类推），由小到大排序输出。


    ### 输入格式

    第一行为一个整数N 第2-N+1行为N个不超过4位的整数


    ### 输出格式

    一行，按字典顺序由小到大排序输出这N个整数。'
  samples:
  - input: '5

      13

      130

      39

      27

      4

      '
    output: '13 130 27 39 4

      '
  tests:
  - input: '4

      13

      130

      39

      27

      '
    output: '13 130 27 39

      '
- slug: dfby-p04-p18
  seq: 18
  title: 统计字母出现次数
  knowledge:
  - 字符串
  difficulty: easy
  statement: '输入一串小写字母（以"."为结束标志），统计出每个字母在该字符串中出现的次数(若某字母不出现，则不要输出，题目保证每个字母出现的次数<10)。


    ### 输入格式

    输入只有一行，包括若干个字符。


    ### 输出格式

    输出只有两行，第一行为出现的小写字母，第二行为字母的出现次数。'
  samples:
  - input: 'abdceeef.

      '
    output: 'abcdef

      111131

      '
  tests:
  - input: 'abdceeeff.

      '
    output: 'abcdef

      111132

      '
- slug: dfby-p04-p19
  seq: 19
  title: 贝贝的车牌问题
  knowledge:
  - 字符串
  difficulty: easy
  statement: "广州市车管所为每一辆入户的汽车都发放一块车牌，车牌的号码由六个字符组成，如A99452、B88888等，这个字符串从左边数起的第一个字符为大写英文字母，如A、B、C等，表示这辆车是属于广州市区内的汽车还是郊区的汽车，后面的五位由数字组成。假定以字母A、B、C、D、E、F、G、R、S、T开头的表示是市区车牌，而以其他字母开头的表示郊区车牌。\
    \ \n车管所把这个任务交给贝贝。请你帮贝贝找出所给出的车牌中有多少辆是广州郊区的汽车。\n\n### 输入格式\n第1行是一个正整数N（1<=N<=10^6），表示共有N个车牌。接下来的N行，每行是一个车牌号。题目保证给出的车牌不会重复。\n\
    \n### 输出格式\n只有1行，即广州郊区车牌的数量。"
  samples:
  - input: '3

      G54672

      Q87680

      P77771

      '
    output: '2

      '
  tests:
  - input: '2

      G54672

      Q87680

      '
    output: '1

      '
- slug: dfby-p04-p20
  seq: 20
  title: 大小写转换
  knowledge:
  - 字符串
  difficulty: easy
  statement: '把一个字符串里所有的大写字母换成小写字母，小写字母换成大写字母。其他字符保持不变。


    ### 输入格式

    输入为一行字符串，其中不含空格。长度不超过80个字符。


    ### 输出格式

    输出转换好的字符串。'
  samples:
  - input: 'ABCDefgh123

      '
    output: 'abcdEFGH123

      '
  tests:
  - input: 'ABCDefgh

      '
    output: 'abcdEFGH

      '
- slug: dfby-p04-p21
  seq: 21
  title: 打印字母塔
  knowledge:
  - 字符型
  difficulty: easy
  statement: '输入行数N,打印图形.


    ### 输入格式

    输入只有一行，包括1个整数。(N<=15)


    ### 输出格式

    输出有N行.'
  samples:
  - input: '3

      '
    output: "A\n BAB\nCBABC\n"
  tests:
  - input: '5

      '
    output: "    A\n   BAB\n  CBABC\n DCBABCD\nEDCBABCDE\n"
- slug: dfby-p04-p22
  seq: 22
  title: 找最长单词
  knowledge:
  - 字符串
  difficulty: easy
  statement: '编写程序，根据给出的一个结束于''.''的字符字串，找出其中最长的含有字母''a''的子串。


    ### 输入格式

    一行，为一个字符字串，结束于句点''.''。字串中的子串由一个或几个空格隔开。


    ### 输出格式

    一行。显示找出的最长的含有字母''a''的子串。如果有多个这样的子串，只显示其中的第一个；若没有含字母''a''的子串，则显示''NO''。'
  samples:
  - input: 'Her  name is Lilan   and she  is a  happy  student.

      '
    output: 'Lilan

      '
  tests:
  - input: 'This is my book.

      '
    output: 'NO

      '
  - input: 'My name is kate.

      '
    output: 'name

      '
- slug: dfby-p04-p23
  seq: 23
  title: 重新排列
  knowledge:
  - 字符串
  difficulty: easy
  statement: '现在有一个20位以内的自然数，你可以将组成这个数的各位数字重新排列，得到一个数值为最小的新数，但新数的位数保持不变。请编程打印出重新排列后的新数。（如：231重新排序后位数不变的最小数是123，而23105重新排序后位数不变的最小数是10235。）


    ### 输入格式

    一个整数（位数 <= 20）


    ### 输出格式

    重新排列后最小的新数'
  samples:
  - input: '382

      '
    output: '238

      '
  tests:
  - input: '3214

      '
    output: '1234

      '
  - input: '3016520

      '
    output: '1002356

      '
- slug: dfby-p04-p24-ii
  seq: 24
  title: 表达式的值II
  knowledge:
  - 字符串
  difficulty: easy
  statement: "给出一个表达式，其中运算符仅包含+和-两种运算符，且没有括号。要求求出表达式的最终值。\n\n数据保证要计算的数字的数量不超过100个，每个整数的数值和计算结果的数值都在int的范围内。\n\
    \ \n请注意：数字可能是1位数，也可能是多位数，如：1+1-1=1，12+23-11=24。\n\n### 输入格式\n仅一行，即为表达式。\n\n###\
    \ 输出格式\n计算结果的数值。"
  samples:
  - input: '1+1-1

      '
    output: '1

      '
  tests:
  - input: '1+2+3+4+5-1-2-3-4

      '
    output: '5

      '
  - input: '28+35-56+89-126

      '
    output: '-30

      '
- slug: dfby-p04-p25
  seq: 25
  title: 整数串拆段
  knowledge:
  - 字符串
  difficulty: easy
  statement: "将一个长度小于10位的数字串拆成2段，使其和为最小的素数。 \n例如数字串‘13304’; \n拆的方法有:; \n1 + 3304 =\
    \ 3305; \n13 + 304 = 317; \n133 + 04 = 137; \n1330 + 4 = 1334; \n从上面可看出，和为素数的有：317\
    \ 与137，最小的是137\n\n### 输入格式\n一个长度小于10的数字串\n\n### 输出格式\n最小的和为素数的数，若无素数则输出 -1"
  samples:
  - input: '13304

      '
    output: '137

      '
  tests:
  - input: '121

      '
    output: '13

      '
  - input: '888888

      '
    output: '-1

      '
- slug: dfby-p04-p26-a-b
  seq: 26
  title: 简单a+b
  knowledge:
  - 字符串
  difficulty: easy
  statement: '张晓菲同学做了简单的ab求和的问题。但是，如果要求输入的情况不是a和b，而是整个加法表达式呢？ 请想办法，计算加法表达式的结果。


    ### 输入格式

    输入一个加法表达式，如1+2=，或者23+58=。（注意：做加法的2个整数都在0~999999999的范围内）


    ### 输出格式

    计算出输入表达式的正确结果'
  samples:
  - input: '1+2=

      '
    output: '3

      '
  tests:
  - input: '2+3=

      '
    output: '5

      '
  - input: '123+45=

      '
    output: '168

      '
- slug: dfby-p04-p27
  seq: 27
  title: 时间的差！
  knowledge:
  - 字符串
  difficulty: easy
  statement: "看到两个标准格式的时间，有小时，有分钟，有秒，格式如：h:m:s，即 时:分:秒 \n你想知道，这两个时间之间相差多少吗？\n\n###\
    \ 输入格式\n输入包括两行，两行均为一个“时:分:秒”格式的时间。且本题保证第一个时间一定大于第二个时间！\n\n### 输出格式\n输出就是输入的两个时间之间的秒数差。"
  samples:
  - input: '01:10:10

      00:30:30

      '
    output: '2380

      '
  tests:
  - input: '16:21:21

      11:11:11

      '
    output: '18610

      '
  - input: '00:02:50

      00:01:35

      '
    output: '75

      '
  - input: '16:10:12

      10:50:48

      '
    output: '19164

      '
- slug: dfby-p04-p28
  seq: 28
  title: 字符串中的空格移位
  knowledge:
