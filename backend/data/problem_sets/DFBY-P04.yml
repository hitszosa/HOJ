- slug: dfby-p04-p33-x
  seq: 33
  title: 小X与缩写
  knowledge:
  - 字符串
  difficulty: easy
  statement: "小X注意到，生活中有很多用到首字母缩写的例子。例如UOJ就是通用在线评测(Universal Online Judge)的缩写。 \n\
    \ \n我们定义一个英文词组的首字母缩写为：取出词组中每个单词的第一个字母、全部转化成大写并顺次连接。\n \n于是小X想请你帮忙写一个程序，读入一行英文句子，将用括号括出的词组替换为首字母缩写再输出。\n\
    \n### 输入格式\n输入一行仅包含英文字母、英文逗号’,’、英文句号’.’、左右括号’()’的句子。 \n保证括号配对、括号内仅包含若干用空格隔开的英文单词、没有多余的空格。\n\
    \n### 输出格式\n输出一行，将括号内的词组替换成首字母缩写的结果输出，括号不要输出，括号外的字符原样输出。\n\n### 提示与数据范围\n数据范围\
    \ \n对于50%的数据，整个输入被一对括号括起来。 \n对于100%的数据，输入长度不超过255个字符。"
  samples:
  - input: 'The (longest increasing subsequence) problem can be solved with (dynamic
      programming), and optimized with (binary indexed tree).

      '
    output: 'The LIS problem can be solved with DP, and optimized with BIT.

      '
  tests:
  - input: 'This student (zhang xiao ming), he is a good student (he is good).

      '
    output: 'This student ZXM, he is a good student HIG.

      '
- slug: dfby-p04-p34
  seq: 34
  title: 看完动漫要几天？
  knowledge:
  - 字符串
  difficulty: easy
  statement: "一部完整的动漫共有 m 分钟（ m<=1000 ）。为了保护视力，妈妈决定让小明同学每天从 xx:xx 分看到 xx:xx 分，请问小明同学需要几天才能看完这部完整的动漫。\
    \    \n<img src=\"http://oj.czos.cn/upload/image/20180622/20180622222145_60473.jpg\"\
    \ alt=\"\" />\n\n### 输入格式\n3  行，第一行是一个整数  m  代表动漫的总分钟数；第二行表示每天看动漫的开始时间，第三行表示每天看动漫的结束时间。（确保输入的开始时间\
    \  &nbsp;<&nbsp;  结束时间）\n\n### 输出格式\n一个整数，代表小明看完动漫至少需要花的总天数。"
  samples:
  - input: '288

      17:00

      17:32

      '
    output: '9

      '
  tests:
  - input: '100

      17:45

      18:15

      '
    output: '4

      '
- slug: dfby-p04-p35-2
  seq: 35
  title: 时钟旋转（2）
  knowledge:
  - 字符串
  difficulty: easy
  statement: "时钟从时间： xx:xx（xx时xx分） ，走到时间： xx:xx （xx时xx分）  ，时针共旋转了多少度？（假设第一个时间 <= 第二个时间，\
    \ 2 个时间都是 12 小时制，且两个时间的时间差不超过 12 小时，也就是说时针旋转的度数在360度之内，也就是 1 <= 时间1 <= 时间2 <=\
    \ 12（4.2.4）   \n \n<img src=\"http://43.142.138.134:80/admin/../../upload/43.142.138.134/20220812//1323_1_20220812202315_86018.jpg\"\
    \ alt=\"\" />\n\n### 输入格式\n2行，第一行为起始时间（如：01:00），第二行为结束时间（如：01:05）\n\n### 输出格式\n\
    时针旋转的度数（结果保留1位小数）"
  samples:
  - input: '01:00

      01:05

      '
    output: '2.5

      '
  tests:
  - input: '01:00

      02:30

      '
    output: '45.0

      '
  - input: '02:58

      03:01

      '
    output: '1.5

      '
- slug: dfby-p04-p36
  seq: 36
  title: 扫描识别
  knowledge:
  - 字符串
  difficulty: easy
  statement: "“扫描识别”你知道是怎么回事吧？它的意思就是：先用扫描仪把纸上的文字扫描成一个图片，再用识别软件把那个图片中的文字识别出来，最后生成一个文本文件。这对于需要把大量的纸稿录入成电子文档的人来说，当然是非常方便的。\
    \ \n以现有的技术，扫描效果是比较理想的，但识别效果还不十分另人满意，经常会出现错误，尤其是当两个字形状特别接近的时候，而且，这种错误是很难用眼睛看出来的。\
    \ \n我们的纸稿上有一个数字串，识别之后得到的字符串保存在输入文件中，这个串可能有识别错误。已知，可能出现的错误有如下几种： \n1、把数字0错误地识别为大写字母O；\
    \ \n2、把数字1错误地识别为小写字母l； \n3、把数字2错误地识别为大写字母Z； \n4、把数字5错误地识别为大写字母S； \n5、把数字6错误地识别为小写字母b；\
    \ \n6、把数字8错误地识别为大写字母B； \n7、把数字9错误地识别为小写字母q。 \n你的改正方案是：如果字符串中出现了上述字母，请替换为原来的数字。最后把改正之后的数字串输出。\n\
    \n### 输入格式\n只有一个字符串，表示识别后得到的字符串。串的长度不超过100。\n\n### 输出格式\n只有一个数字串，表示改正后的数字串。"
  samples:
  - input: '321lO88BqS

      '
    output: '3211088895

      '
  tests:
  - input: 'Z2q9S0Bl

      '
    output: '22995081

      '
- slug: dfby-p04-p37
  seq: 37
  title: 判断是否构成回文
  knowledge:
  - 字符串
  difficulty: easy
  statement: '输入一串字符,字符个数不超过100,且以"."结束。 判断它们是否构成回文。


    ### 输入格式

    输入只有一行，包括一串字符.&nbsp;


    ### 输出格式

    输出只有一行.TRUE 或者FALSE&nbsp;'
  samples:
  - input: '12321.

      '
    output: 'TRUE

      '
  tests:
  - input: '12322.

      '
    output: 'FALSE

      '
