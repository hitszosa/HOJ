- slug: dfby-p04-p48
  seq: 48
  title: 字符串编辑
  knowledge:
  - 字符串
  difficulty: easy
  statement: "从键盘输入一个字符串（长度<=40个字符），并以字符 '.'结束。\n例如：‘This is a book.’ 现对该字符串进行编辑，编辑功能有：\n\
    D：删除一个字符，命令的方式为：\nD a  其中a为被删除的字符\n     例如：D s  表示删除字符 ‘s’ ，若字符串中有多个 ‘s’，则删除第一次出现的。\n\
    \              如上例中删除的结果为： ‘Thi is a book.’\n\nI：插入一个字符，命令的格式为：\n    I a1 a2 \
    \ 其中a1表示插入到指定字符前面，a2表示将要插入的字符。\n    例如：I s d  表示在指定字符 ‘s’ 的前面插入字符 ‘d’ ，若原串中有多个\
    \ ‘s’ ，则插入在最后一个字符的前面。\n             如上例中：\n                   原串：‘This is a book.’\n\
    \                   插入后：‘This ids a book.’\n\nR：替换一个字符，命令格式为：\n     R a1 a2  其中a1为被替换的字符，a2为替换的字符，若在原串中有多个a1则应全部替换。\n\
    \     例如： 原串： ‘This is a book.’\n               输入命令：R o e\n               替换后的字符串为：‘This\
    \ is a beek.’\n在编辑过程中，若出现被改的字符不存在时，则给出提示信息\"Not exist\"。\n\n### 输入格式\n每个测试文件只包含一组测试数据，每组输入数据包含两行：\
    \ \n第一行，输入一个字符串，表示原串； \n第二行，输入一个字符串，表示命令，数据保证命令不会出错，也就是命令一定严格按照题目要求输入。\n\n###\
    \ 输出格式\n对于每组输入数据，输出编辑后的字符串，如果被改的字符不存在，则输出\"Not exist\"（引号不输出）。"
  samples:
  - input: 'This is a book.

      '
    output: 'Thi is a book.

      '
  tests:
  - input: 'a123 b12 aa.

      D 2

      '
    output: 'a13 b12 aa.

      '
  - input: '.

      R . %

      '
    output: '%

