- slug: dfby-p04-p14
  seq: 14
  title: 字符串的反码
  knowledge:
  - 字符串
  difficulty: easy
  statement: '一个二进制数，将其每一位取反，称之为这个数的反码。下面我们定义一个字符的反码。如果这是一个小写字符，则它和字符''a’的距离与它的反码和字符''z’的距离相同；如果是一个大写字符，则它和字符''A’的距离与它的反码和字符''Z’的距离相同；如果不是上面两种情况，它的反码就是它自身。
    举几个例子，''a’的反码是''z’；''c’的反码是''x’；''W’的反码是''D’；''1’的反码还是''1’；''$''的反码还是''$''。 一个字符串的反码定义为其所有字符的反码。我们的任务就是计算出给定字符串的反码。


    ### 输入格式

    一个长度不超过80个字符的字符串。


    ### 输出格式

    字符串的反码。'
  samples:
  - input: 'Hello

      '
    output: 'Svool

      '
  tests:
  - input: 'He

      '
    output: 'Sv

      '
- slug: dfby-p04-p15
  seq: 15
  title: 国王的魔镜
  knowledge:
  - 字符串
  difficulty: easy
  statement: '国王有一个魔镜，可以把任何接触镜面的东西变成原来的两倍——只是，因为是镜子嘛，增加的那部分是反的。 比如一条项链，我们用AB来表示，不同的字母表示不同颜色的珍珠。如果把B端接触镜面的话，魔镜会把这条项链变为ABBA。如果再用一端接触的话，则会变成ABBAABBA（假定国王只用项链的某一端接触魔镜）。
    给定最终的项链，请编写程序输出国王没使用魔镜之前，最初的项链可能的最小长度。


    ### 输入格式

    只有一个字符串，由大写英文字母组成，表示最终的项链。


    ### 输出格式

    只有一个整数，表示国王没使用魔镜前，最初的项链可能的最小长度。'
  samples:
  - input: 'ABBAABBA

      '
    output: '2

      '
  tests:
  - input: 'CBAABC

      '
    output: '3

      '
