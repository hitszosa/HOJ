- slug: dfby-p04-p30
  seq: 30
  title: 查找子串并替换
  knowledge:
  - 字符串
  difficulty: easy
  statement: '对输入的一句子实现查找且置换的功能（找到某个子串并换成另一子串）。

    比如：将“abcf&nbsp; abdabc”中的“abc”，替换为“AA”，则替换结果为“AAf&nbsp; abdAA”，而将“abcf&nbsp; abdabc”中的“abc”替换为“abcabc”，则替换结果为“abcabcf&nbsp;
    abdabcabc”。本题查找子串时注意，大小写完全一致，才能作为子串，比如：在“Abcf abd Abc”中，如果找字符串“abc”是不存在的。


    ### 输入格式

    第一行为原来的字符串 第二行为要查找的子串 第三行为要替换成的子串。


    ### 输出格式

    只有一行，为替换好的字符串'
  samples:
  - input: 'abcf  abdabc

      abc

      AA

      '
    output: 'AAf  abdAA

      '
  tests:
  - input: 'abcf  abdabc

      abc

      abcabcabc

      '
    output: 'abcabcabcf  abdabcabcabc

      '
  - input: 'aa bb aa cc haha

      aa

      aaaaaa

      '
    output: 'aaaaaa bb aaaaaa cc haha

      '
  - input: 'good student and good teacher

      good

      good good

      '
    output: 'good good student and good good teacher

      '
