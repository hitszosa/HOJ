  title: 组合的输出
  knowledge:
  - 递归
  difficulty: easy
  statement: "排列与组合是常用的数学方法，其中组合就是从n个元素中抽出r个元素(不分顺序且r < ＝ n)，我们可以简单地将n个元素理解为自然数1，2，…，n，从中任取r个数。\
    \  \n现要求你不用递归的方法输出所有组合。  \n例如n ＝ 5 ，r ＝ 3 ，所有组合为：  \n1 2 3  \n1 2 4  \n1 2 5 \
    \ \n1 3 4  \n1 3 5  \n1 4 5  \n2 3 4  \n2 3 5  \n2 4 5  \n3 4 5\n\n### 输入格式\n\
    一行两个自然数n、r ( 1 < n < 21，1 < ＝ r < ＝ n )。\n\n### 输出格式\n所有的组合，每一个组合占一行且其中的元素按由小到大的顺序排列，所有的组合也按字典顺序。"
