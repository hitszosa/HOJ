- slug: dfby-p05-p39
  seq: 39
  title: 连续非素数的最长度
  knowledge:
  - 函数
  - noip复赛
  difficulty: easy
  statement: '给出一个正整数n（2≤n≤1000000），例如n=30，在1，2，3，……30中，连续的非素数有

    4    长度为1

    6    长度为1

    8 9 10    长度为3

    12    长度为1

    14 15 16 长度为3

    18 长度为1

    20 21 22    长度为3

    24 25 26 27 28 长度为5

    30    长度为1

    其中，最大长度为5，即有连续的5个非素数。


    ### 输入格式

    一个整数n。


    ### 输出格式

    一个整数，即连续非素数最大长度。'
  samples:
