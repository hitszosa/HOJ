  statement: "考虑如下的3参数递归函数w(a,b,c)； \n如果a≤0或b≤0或c≤0，则w(a,b,c)=1； \n如果a>20或b>20或c>20，则w(a,b,c)=w(20,20,20)；\
    \ \n如果a其他情况下：w(a,b,c)=w(a-1,b,c)+w(a-1,b-1,c)+w(a-1,b,c-1)-w(a-1, b-1,c-1)。\n\n\
    ### 输入格式\n1行整数，包含3个数值，分别对应a、b和c的值。\n\n### 输出格式\n一个数，即w(a,b,c)的结果。"
