- slug: dfby-p05-p15
  seq: 15
  title: 递归问题—汉诺塔
  knowledge:
  - 递归
  difficulty: easy
  statement: "汉诺塔（又称河内塔）问题是印度的一个古老的传说。开天辟地的神勃拉玛在一个庙里留下了三根金刚石的棒，第一根上面套着64个圆的金片，最大的一个在底下，其余一个比一个小，依次叠上去，庙里的众僧不倦地把它们一个个地从这根棒搬到另一根棒上，规定可利用中间的一根棒作为帮助，但每次只能搬一个，而且大的不能放在小的上面。面对庞大的数字(移动圆片的次数)18446744073709551615，看来，众僧们耗尽毕生精力也不可能完成金片的移动。\n\
    \ \n<img src=\"http://oj.czos.cn/upload/image/20171202/20171202130058_45390.jpg\"\
    \ alt=\"\" /> \n \n后来，这个传说就演变为汉诺塔游戏:\n1.有三根杆子A,B,C。A杆上有若干碟子\n2.每次移动一块碟子,小的只能叠在大的上面\n\
    3.把所有碟子从A杆全部移到C杆上\n \n经过研究发现，汉诺塔的破解很简单，就是按照移动规则向一个方向移动金片：　　如3阶汉诺塔的移动：A→C,A→B,C→B,A→C,B→A,B→C,A→C\
    \ 　　此外，汉诺塔问题也是程序设计中的经典递归问题。\n \n算法思路：\n1.如果只有一个金片，则把该金片从源移动到目标棒，结束。\n2.如果有n个金片，则把前n-1个金片移动到辅助的棒，然后把自己移动到目标棒，最后再把前n-1个移动到目标棒。\n\
    \n### 输入格式\n一个整数N，表示A柱上有N个碟子。（0<n<=10）\n\n### 输出格式\n若干行，即移动的最少步骤"
  samples:
  - input: '3

      '
    output: 'A To C

      A To B

      C To B

      A To C

      B To A

      B To C

      A To C

      '
  tests:
  - input: '5

      '
    output: 'A To C

      A To B

      C To B

      A To C

      B To A

      B To C

      A To C

      A To B

      C To B

      C To A

      B To A

      C To B

      A To C

      A To B

      C To B

      A To C

      B To A

      B To C

      A To C

      B To A

      C To B

      C To A

      B To A

      B To C

      A To C

      A To B

      C To B

      A To C

      B To A

      B To C

      A To C

      '
