- slug: dfby-p05-p40
  seq: 40
  title: 数组元素之和
  knowledge:
  - 递归
  difficulty: easy
  statement: '已知一个一维数组a[1..n](n<25)，又已知一整数m。 如能使数组a中任意几个元素之和等于m，则输出YES，反之则为NO。


    ### 输入格式

    第一行正整数n，n<25；

    第二行，n个整数（不超过1000）；

    第三行整数m。


    ### 输出格式

    YES或NO。'
  samples:
  - input: '5

      1 2 3 4 5

      7

      '
    output: 'YES

      '
  tests:
  - input: '6

      1 2 3 4 5 6

      100

      '
    output: 'NO

      '
