- slug: dfby-p05-p36
  seq: 36
  title: 数根
  knowledge:
  - 函数问题
  - 递归
  difficulty: easy
  statement: "数根是这样定义的：对于一个正整数n，将它的各个数位上的数字相加得到一个新数，如果这个数是一位数，我们就称之为n的数根，否则重复处理直到它成为一个一位数。\
    \ \n例如，n=34,3+4=7, 7是一位数，所以7是34的数根。 \n再如，n=345 ,3+4+5=12，1+2=3,3是一位数，所以3是345的数根。\
    \ \n对于输入数字n,编程计算它的数根。\n\n### 输入格式\n一个整数。（n<=999999999）\n\n### 输出格式\n一个整数。"
  samples:
  - input: '345

      '
    output: '3

      '
  tests:
  - input: '9384728

      '
    output: '5

      '
- slug: dfby-p05-p37
  seq: 37
  title: 加数
  knowledge:
  - noip复赛
  - 递归
  - 字符串
  difficulty: easy
  statement: '给出一个正整数n（1≤n≤100000）。在n的右边加入n的一半，然后在新数的右边再加入n的一半的一半，一直进行，直到不能再加为止。

    例如  n=37  37的一半为18（取整数）加到n的右边成为

    3718         18的一半为9，加到新数的右边成为

    37189        9的一半为4，加到新数的右边成为

    371894       4的一半为2，加到新数的右边成为

    3718942      2的一半为1，加到新数的右边成为

    37189421     1的一半为0，加数结束，最后得到的数是一个8位的数


    ### 输入格式

    整数n


    ### 输出格式

    加数结束后新数的长度。'
