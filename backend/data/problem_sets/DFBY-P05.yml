- slug: dfby-p05-p03-m-n
  seq: 3
  title: 输出m和n范围内的完全数(完美数)
  knowledge:
  - 函数
  difficulty: easy
  statement: '任何一个自然数的约数中都有1和它本身，我们把小于它本身的因数叫做这个自然数的真约数。 如6的所有真约数是1、2、3，而且6=1＋2＋3。像这样，一个数所有真约数的和正好等于这个数，通常把这个数叫做完美数。
    古希腊人非常重视完美数。毕达哥拉斯发现它之后，人们就开始了对完美数的研究。 现在要求输出所有在m和n范围内的完美数。


    ### 输入格式

    输入只有一行，是两个整数，（2<=m<=n<=32767)，中间用空格隔开。


    ### 输出格式

    输出范围内的所有完全数，数与数之间用空格隔开。'
  samples:
  - input: '2 10

      '
    output: '6

      '
  tests:
  - input: '2 30

      '
    output: '6 28

      '
- slug: dfby-p05-p04
  seq: 4
  title: 求无暇素数
  knowledge:
  - 函数
  difficulty: easy
  statement: '一个两位整数A本身是素数，若将其个位数字与十位数字交换，得到一个新的两位数B，而B也是素数，我们则称A为无暇素数。 例如：31是素数，个位数字与十位数字交换后得到13，也是素数。所以31是无暇素数。
    问题： 给出一个数字字符串（即字串中的字符全部由数字组成），求出其所有组成的无暇素数。


    ### 输入格式

    一个数字字符串（长度<＝20），以“%”结束。


    ### 输出格式

    全部的无暇素数，之间用一个逗号隔开。'
  samples:
