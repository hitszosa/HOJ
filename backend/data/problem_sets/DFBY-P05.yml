      .#...#

      .##...

      ..#..#

      .#..##

      #.....

      '
    output: '5

      '
- slug: dfby-p05-p25
  seq: 25
  title: 迷宫的路径
  knowledge:
  - 回溯
  - 深搜
  - 递归
  difficulty: easy
  statement: 'Mitch老鼠在森林里游玩，不小心走进了一个迷宫里面，这个迷宫是一个 nn 行 mm 列的矩阵，迷宫中有些格子是可以走的，有些格子是不能走的，能走的格子用
    o （小写字母 o ）表示，不能走的格子用 # 表示。


    Mitch选择走出迷宫的策略是：先向右，如果右边走不通则选择向下，如果下边走不通则选择向左，如果左边走不通则选择向上；如果四个方向都走不通，则后退选择其他能走的路径。


    Mitch从类似下图所示的迷宫的左上角 (1,1)(1,1) 点进入迷宫（请注意：入口 1,11,1 和出口的 n,mn,m 点都不是 # ），请问Mitch有哪些方法可以走出迷宫，走到
    (n,m)(n,m) 点；请编程求出所有可能的路径，输出这些路径，如果不存在任何的路径可以走出迷宫，请输出 no。

    ![](https://oj.czos.cn/uploads/20211116/26bd8aeb99ab71d7bc397194b8a4f048.png)


    ### 输入格式

    第一行包含两个整数n和m，中间用单个空格隔开，代表迷宫的行和列的数量。

    接下来n行，每行m个字符，描述迷宫地图。字符只有“o”或“#”两种，“o”代表这个格子可以走，“#”代表这个格子不能走。(4 <= n,m <= 10 )


    ### 输出格式

    请按照Mitch选择的走出迷宫的策略，输出所有可能的路径，输出形式请参考样例输出的形式。'
  samples:
  - input: '6 5

      ooooo

      o####

      ooooo

      #oo#o

      oooo#

      o#ooo

