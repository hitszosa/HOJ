- slug: dfby-p05-p31-usaco
  seq: 31
  title: 数池塘（四方向） USACO
  knowledge:
  - USACO
  - 深搜
  - 递归
  difficulty: easy
  statement: "农夫约翰的农场可以表示成N*M（1≤N≤100≤M≤100）个方格组成的矩形。由于近日的降雨，在约翰农场上的不同地方形成了池塘。每一个方格或者有积水（'W'）或者没有积水（'.'）。农夫约翰打算数出他的农场上共形成了多少池塘。一个池塘是一系列相连的有积水的方格，每一个方格周围的四个方格都被认为是与这个方格相连的。现给出约翰农场的图样，要求输出农场上的池塘数。\n\
    \n### 输入格式\n第1行：由空格隔开的两个整数：N和M \n第2..N+1行：每行M个字符代表约翰农场的一排方格的状态。每个字符或者是'W'或者是'.'，字符之间没有空格。\n\
    \n### 输出格式\n输出只有1行，输出约翰农场上的池塘数"
  samples:
  - input: '10 12

      W........WW.

      .WWW.....WWW

      ....WW...WW.

      .........WW.

      .........W..

      ..W......W..

      .W.W.....WW.

      W.W.W.....W.

      .W.W......W.

      ..W.......W.

      '
    output: '13

      '
  tests:
