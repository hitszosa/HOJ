  seq: 50
  title: 全部排列问题
  knowledge:
  - 递归
  difficulty: easy
  statement: '输入 n 输出 1..n 个数的全部排列。全部排列中，数字可以重复 。

    例如输入 3， 输出全部排列的结果如下 111、112 、 113 、 121 、 122 、 123 、 131 、 132 、 133 、 211 、
    212 、 213 、 221 、 222 、 223 、 231 、 232 、 233 、 311 、 312 、 313 、 321 、 322 、
    323 、 331 、 332 、 333。


    ### 输入格式

    一个整数n（n<=6）。


    ### 输出格式

    按照由小到大的顺序输出1..n这n个数的全部排列情况。'
