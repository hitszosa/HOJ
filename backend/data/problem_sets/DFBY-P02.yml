- slug: dfby-p02-p35
  seq: 35
  title: 纸盒的最大体积是多少？
  knowledge:
  - 循环
  difficulty: easy
  statement: "在一张尺寸为 n * n 厘米的正方形硬纸板的四个角上，分别裁剪掉一个 m * m 厘米的小正方形，就可以做成一个无盖纸盒，请问这个无盖纸盒的最大体积是多少？\
    \   \n立方体的体积 v =  底面积  *  高）   \n比如： n = 5 ，那么裁掉的小正方形的尺寸可能是 1 厘米、 2 厘米   \n如果裁掉\
    \ 1 厘米的四个小正方形，得到纸盒的体积  = (5 - 2) * (5 - 2) * 1 = 9 立方厘米   \n如果裁掉 2 厘米的四个小正方形，得到纸盒的体积\
    \  = (5 - 4) * (5 - 4) * 2 = 2 立方厘米   \n因此，裁掉边长为2的四个小正方形得到的纸盒体积最大，最大体积为9（立方厘米）\n\
    <img src=\"http://oj.czos.cn/upload/image/20180625/20180625003118_49213.jpg\"\
    \ alt=\"\" />\n\n### 输入格式\n一个整数n，代表正方形纸板的边长\n\n### 输出格式\n纸盒的最大体积"
  samples:
  - input: '5

      '
    output: '9

      '
  tests:
  - input: '12

      '
    output: '128

      '
