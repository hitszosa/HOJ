- slug: dfby-p02-p01
  seq: 1
  title: 回文数
  knowledge:
  - 循环
  difficulty: easy
  statement: "回文数的定义为：如果把一个数的各个数位上的数字颠倒过来得到的新数与原数相等，则此数是回文数，例：7,22,131,2112,31013,…都是回文数。\
    \ 对任意给出的一个整数n,经过一系列的处理，最后都能成为回文数。处理的方法是，该数加上它的颠倒数，\n例如：n=176 \n第一次处理后　　　　176+671＝847\
    \ \n第二次处理后　　　　847+748＝1595 \n第三次处理后　　　　1595+5951＝7546 \n第四次处理后　　　　7546+6457＝14003\
    \ \n第五次处理后　　　　14003+30041＝44044 \n此时成为回文数，共进行５次处理。 \n问题：给出n 后，求出使该数按照以上规则进行一系列处理后成为回文数的最少操作次数。\n\
    \n### 输入格式\nn 一个整数（１≤n≤1000000）\n\n### 输出格式\n使n成为回文数的最少处理次数。 若开始给出的n是回文数，则输出０（即不需任何处理）。"
  samples:
  - input: '67

      '
    output: '2

      '
  tests:
  - input: '2 37

      '
    output: 'Impossible

      '
  - input: '7 55

      '
    output: '0

      '
  - input: '2 32

      '
    output: '3

      '
  - input: '5 45

      '
    output: '2

      '
  - input: '6 71

      '
    output: '3

      '
- slug: dfby-p02-p02-1-1-2-1-3-1-n
  seq: 2
  title: 编程求1+1/2+1/3+...+1/n
  knowledge:
  - 循环
  difficulty: easy
  statement: '编程求1+1/2+1/3+...+1/n


    ### 输入格式

    输入一行，只有一个整数n(1<=n<=200)


    ### 输出格式

    输出只有一行（这意味着末尾有一个回车符号），包括1个实数。(保留3位小数)'
  samples:
