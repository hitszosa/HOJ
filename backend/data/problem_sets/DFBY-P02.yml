- slug: dfby-p02-p26
  seq: 26
  title: 马克思手稿的问题
  knowledge:
  - 循环
  difficulty: easy
  statement: '马克思手稿中有一道趣味数学题：有30个人，其中可能有男人、女人和小孩，在一家饭馆里吃饭共花了50先令，假设每个男人各花3先令，每个女人各花2先令，每个小孩各花1先令，问男人、女人和小孩各有几人？（注意：不一定男人、女人、小孩都有）


    ### 输入格式

    无


    ### 输出格式

    每行3个数，按照男人、女人、小孩的顺序，由小到大依次输出所有可能的人数方案（男人、女人、小孩其中某些人的数量可以为0）'
  samples:
