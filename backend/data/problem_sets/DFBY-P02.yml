      1 18 11

      2 16 12

      3 14 13

      4 12 14

      5 10 15

      6 8 16

      7 6 17

      8 4 18

      9 2 19

      10 0 20

      '
- slug: dfby-p02-p27
  seq: 27
  title: 姐妹数对
  knowledge:
  - 循环
  difficulty: easy
  statement: '给定两个不同的正整数x，y，若x+y能被3除尽或能被7除尽，则称x，y为姐妹数对。例如：

    2,4；2,5；为姐妹数对。

    3,14；    不是姐妹数对。

    那么，对给出的一个整数n(1≤n≤100)， 1,2，…，n之间有多少个姐妹数。


    ### 输入格式

    一个整数n。


    ### 输出格式

    一个整数，即1～n之间姐妹数对的个数。'
  samples:
  - input: '6

      '
    output: '8

      '
  tests:
  - input: '80

      '
    output: '1354

      '
