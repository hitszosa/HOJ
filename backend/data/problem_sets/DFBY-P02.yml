- slug: dfby-p02-p03
  seq: 3
  title: 放大镜
  knowledge:
  - 循环
  difficulty: easy
  statement: "张老师有一个神奇的放大镜，他可以把一个1~9之间的整数n，放大为n个整数n。 \n比如：你有1个整数5，通过放大镜放大，你将看到55555。\n\
    \n### 输入格式\n一个1~9之间的整数\n\n### 输出格式\n输出放大后的数字"
  samples:
  - input: '3

      '
    output: '333

      '
  tests:
  - input: '1

      '
    output: '1

      '
  - input: '5

      '
    output: '55555

      '
