- slug: dfby-p02-p29-n
  seq: 29
  title: 第n盆花是什么颜色？
  knowledge:
  - 循环
  difficulty: easy
  statement: "学校操场上摆放了 m 组花排成了一排，每组花有 3 盆颜色分别是蓝花、黄花、红花。小芳和同学们开始玩一个游戏，从第一盆花开始数数，当数到\
    \ n 的时候让同学们来计算他面前的是什么颜色的花。如果数到最后一盆了，就倒过来往前数。  \n例如：有 3 组花，小芳数到了 8 ，就是倒数第二盆黄花（\
