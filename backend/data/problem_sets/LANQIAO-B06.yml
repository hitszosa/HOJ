- slug: lanqiao-b06-p01
  seq: 1
  title: 历届试题 决赛 九宫重排
  knowledge:
  - 蓝桥杯-历届试题
  difficulty: medium
  statement: "如下面第一个图的九宫格中，放着 1~8 的数字卡片，还有一个格子空着。与空格子相邻的格子中的卡片可以移动到空格中。经过若干次移动，可以形成第二个图所示的局面。\n\
    ![九宫重排.jpg](/api/public/img/fa841e671df74fe3aa1200e0bebc2d21.jpg)\n把第二个图的局面记为：123.46758\n\
    \ 　　显然是按从上到下，从左到右的顺序记录数字，空格记为句点。\n 　　本题目的任务是已知九宫的初态和终态，求最少经过多少步的移动可以到达。如果无论多少步都无法到达，则输出-1。\n\
    \n### 输入格式\n输入第一行包含九宫的初态，第二行包含九宫的终态。\n\n### 输出格式\n输出最少的步数，如果不存在方案，则输出-1。"
  samples:
  - input: '12345678.

      123.46758

      '
    output: '3

      '
  tests:
  - input: '12345678.

      152743.86

      '
    output: '6

      '
  - input: '12345678.

      12356.784

      '
    output: '13

      '
  - input: '2315.6784

      8235164.7

      '
    output: '17

      '
  - input: '12345678.

      87654321.

      '
    output: '30

      '
  - input: '.87654321

      12345678.

      '
    output: '28

      '
