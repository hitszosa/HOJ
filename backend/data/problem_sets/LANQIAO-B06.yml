- slug: lanqiao-b06-p15
  seq: 15
  title: 历届试题 高僧斗法
  knowledge:
  - 蓝桥杯-历届试题
  difficulty: medium
  statement: "古时丧葬活动中经常请高僧做法事。仪式结束后，有时会有“高僧斗法”的趣味节目，以舒缓压抑的气氛。\n 　　节目大略步骤为：先用粮食（一般是稻米）在地上“画”出若干级台阶（表示N级浮屠）。又有若干小和尚随机地“站”在某个台阶上。最高一级台阶必须站人，其它任意。(如图1所示)\n\
    \ 　　两位参加游戏的法师分别指挥某个小和尚向上走任意多级的台阶，但会被站在高级台阶上的小和尚阻挡，不能越过。两个小和尚也不能站在同一台阶，也不能向低级台阶移动。\n\
    \ 　　两法师轮流发出指令，最后所有小和尚必然会都挤在高段台阶，再也不能向上移动。轮到哪个法师指挥时无法继续移动，则游戏结束，该法师认输。\n 　　对于已知的台阶数和小和尚的分布位置，请你计算先发指令的法师该如何决策才能保证胜出。\n\
    \n### 输入格式\n输入数据为一行用空格分开的N个整数，表示小和尚的位置。台阶序号从1算起，所以最后一个小和尚的位置即是台阶的总数。（N<100, 台阶总数<1000）\n\
    \n### 输出格式\n输出为一行用空格分开的两个整数: A B, 表示把A位置的小和尚移动到B位置。若有多个解，输出A值较小的解，若无解则输出-1。"
  samples:
  - input: '1 5 9

      '
    output: '1 4

      '
  tests:
  - input: '5 9 15

      '
    output: '5 8

      '
  - input: '1 4 7 13

      '
    output: '7 10

      '
  - input: '1 5 8 12 19 21

      '
    output: '1 2

      '
  - input: '1 400 500

      '
    output: '1 399

      '
  - input: '1 4 8 12 16 19 28 33 35 36 40 45 52 66 67 68 69 77 85 99 102 134 155 211
      214 216 355 376 400 412

      '
    output: '134 148

      '
- slug: lanqiao-b06-p16
  seq: 16
  title: 历届试题 格子刷油漆
  knowledge:
  - 蓝桥杯-历届试题
  difficulty: medium
  statement: 'X国的一段古城墙的顶端可以看成 2*N个格子组成的矩形（如下图所示），现需要把这些格子刷上保护漆。

    ![刷油漆.png](/api/public/img/439a0f91844b458c9cf665fd932886ef.png)


    　　你可以从任意一个格子刷起，刷完一格，可以移动到和它相邻的格子（对角相邻也算数），但不能移动到较远的格子（因为油漆未干不能踩！）

    　　比如：a d b c e f 就是合格的刷漆顺序。

    　　c e f d a b 是另一种合适的方案。

    　　当已知 N 时，求总的方案数。当N较大时，结果会迅速增大，请把结果对 1000000007 (十亿零七) 取模。


    ### 输入格式

    输入数据为一个正整数（不大于1000）.


    ### 输出格式

    输出数据为一个正整数。'
  samples:
  - input: '2

      '
    output: '24

      '
  tests:
  - input: '18

      '
    output: '757182408

      '
  - input: '33

      '
    output: '305954685

      '
  - input: '50

      '
    output: '800324904

      '
  - input: '297

      '
    output: '688794777

      '
  - input: '880

      '
    output: '276016707

      '
- slug: lanqiao-b06-p17
  seq: 17
  title: 历届试题 农场阳光
  knowledge:
  - 蓝桥杯-历届试题
  difficulty: medium
  statement: "X星球十分特殊，它的自转速度与公转速度相同，所以阳光总是以固定的角度照射。\n 　　最近，X星球为发展星际旅游业，把空间位置出租给Y国游客来晒太阳。每个租位是漂浮在空中的圆盘形彩云（圆盘与地面平行）。当然，这会遮挡住部分阳光，被遮挡的土地植物无法生长。\n\
    \ 　　本题的任务是计算某个农场宜于作物生长的土地面积有多大。\n\n### 输入格式\n输入数据的第一行包含两个整数a, b，表示某农场的长和宽分别是a和b，此时，该农场的范围是由坐标(0,\
    \ 0, 0), (a, 0, 0), (a, b, 0), (0, b, 0)围成的矩形区域。\n 　　第二行包含一个实数g，表示阳光照射的角度。简单起见，我们假设阳光光线是垂直于农场的宽的，此时正好和农场的长的夹角是g度，此时，空间中的一点(x,\
    \ y, z)在地面的投影点应该是(x + z * ctg(g度), y, 0)，其中ctg(g度)表示g度对应的余切值。\n 　　第三行包含一个非负整数n，表示空中租位个数。\n\
    \ 　　接下来 n 行，描述每个租位。其中第i行包含4个整数xi, yi, zi, ri，表示第i个租位彩云的圆心在(xi, yi, zi)位置，圆半径为ri。\
    \ \n输入样例: \n10 10\n 90.0\n 1\n 5 5 10 5\n\n### 输出格式\n要求输出一个实数，四舍五入保留两位有效数字，表示农场里能长庄稼的土地的面积。"
