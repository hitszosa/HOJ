- slug: lanqiao-b06-p10
  seq: 10
  title: 历届试题 幸运数
  knowledge:
  - 蓝桥杯-历届试题
  difficulty: medium
  statement: '幸运数是波兰数学家乌拉姆命名的。它采用与生成素数类似的“筛法”生成。

    首先从1开始写出自然数1,2,3,4,5,6,…

    1 就是第一个幸运数。

    我们从2这个数开始。把所有序号能被2整除的项删除，变为：

    1 _ 3 _ 5 _ 7 _ 9 …

    把它们缩紧，重新记序，为：

    1 3 5 7 9 … 。这时，3为第2个幸运数，然后把所有能被3整除的序号位置的数删去。注意，是序号位置，不是那个数本身能否被3整除!! 删除的应该是5，11,
    17, …

    此时7为第3个幸运数，然后再删去序号位置能被7整除的(19,39,…)

    最后剩下的序列类似：

    1, 3, 7, 9, 13, 15, 21, 25, 31, 33, 37, 43, 49, 51, 63, 67, 69, 73, 75, 79, …


    ### 输入格式

    输入两个正整数m n, 用空格分开 (m < n < 1000*1000)


    ### 输出格式

    程序输出 位于m和n之间的幸运数的个数（不包含m和n）。'
  samples:
  - input: '1 20

      '
    output: '5

      '
  tests:
  - input: '50 100

      '
    output: '10

      '
  - input: '99 300

      '
    output: '33

      '
  - input: '100 1000

      '
    output: '130

      '
  - input: '5000 15000

      '
    output: '989

      '
- slug: lanqiao-b06-p11
  seq: 11
  title: 历届试题 横向打印二叉树
  knowledge:
  - 蓝桥杯-历届试题
  difficulty: medium
  statement: '二叉树可以用于排序。其原理很简单：对于一个排序二叉树添加新节点时，先与根节点比较，若小则交给左子树继续处理，否则交给右子树。

    当遇到空子树时，则把该节点放入那个位置。

    比如，10 8 5 7 12 4 的输入顺序，应该建成二叉树如下图所示，其中.表示空白。

    …|-12

    10-|

    …|-8-|

    …|…|-7

    …|-5-|

    …|-4

    本题目要求：根据已知的数字，建立排序二叉树，并在标准输出中横向打印该二叉树。


    ### 输入格式

    输入数据为一行空格分开的N个整数。 N<100，每个数字不超过10000。

    输入数据中没有重复的数字。


    ### 输出格式

    输出该排序二叉树的横向表示。为了便于评卷程序比对空格的数目，请把空格用句点代替：


    ### 提示与数据范围

    ='
