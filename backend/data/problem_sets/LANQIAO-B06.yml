- slug: lanqiao-b06-p03
  seq: 3
  title: 历届试题 带分数
  knowledge:
  - 蓝桥杯-历届试题
  difficulty: medium
  statement: '100 可以表示为带分数的形式：100 = 3 + 69258 / 714。

    还可以表示为：100 = 82 + 3546 / 197。

    注意特征：带分数中，数字1~9分别出现且只出现一次（不包含0）。

    类似这样的带分数，100 有 11 种表示法。


    ### 输入格式

    从标准输入读入一个正整数N (N<1000*1000)


    ### 输出格式

    程序输出该数字用数码1~9不重复不遗漏地组成带分数表示的全部种数。

    注意：不要求输出每个表示，只统计有多少表示法！'
  samples:
  - input: '100

      '
    output: '11

      '
  tests:
  - input: '2013

      '
    output: '5

      '
  - input: '1111

      '
    output: '12

      '
  - input: '10

      '
    output: '7

      '
- slug: lanqiao-b06-p04
  seq: 4
  title: 历届试题 剪格子
  knowledge:
  - 蓝桥杯-历届试题
  difficulty: medium
  statement: "如下图所示，3 x 3 的格子中填写了一些整数。\n\n  +--*--+--+\n |10* 1|52|\n +--****--+\n\
    \ |20|30* 1|\n *******--+\n | 1| 2| 3|\n +--+--+--+  我们沿着图中的星号线剪开，得到两个部分，每个部分的数字和都是60。\n\
    \n  本题的要求就是请你编程判定：对给定的m x n 的格子中的整数，是否可以分割为两个部分，使得这两个区域的数字和相等。\n\n 如果存在多种解答，请输出包含左上角格子的那个区域包含的格子的最小数目。\
    \   \n\n 如果无法分割，则输出 0。\n\n### 输入格式\n程序先读入两个整数 m n 用空格分割 (m,n<10)。\n表示表格的宽度和高度。\n\
    接下来是n行，每行m个正整数，用空格分开。每个整数不大于10000。\n\n### 输出格式\n输出一个整数，表示在所有解中，包含左上角的分割区可能包含的最小的格子数目。"
  samples:
  - input: '±-–±-+

      |10 1|52|

      ±-***–+

      |20|30 1|

      *******–+

      | 1| 2| 3|

      ±-±-±-+

      '
    output: '3 3

      10 1 52

      20 30 1

      1 2 3

      '
  tests:
  - input: '3 3

      1 1 1

      1 8 1

      1 1 1

      '
    output: '8

      '
  - input: "4 5\n10 20 30 1\n1 1 40 1 \n1 60 50 1 \n1 150 1 1 \n1 1 1 348\n"
    output: '7

      '
  - input: '4 4

      100 2 2 2

      1 30 30 1

      30 2 20 1

      2 1 1 1

      '
    output: '10

      '
- slug: lanqiao-b06-p05
  seq: 5
  title: 历届试题 错误票据
  knowledge:
  - 蓝桥杯-历届试题
  difficulty: medium
  statement: '某涉密单位下发了某种票据，并要在年终全部收回。

    每张票据有唯一的ID号。全年所有票据的ID号是连续的，但ID的开始数码是随机选定的。

    因为工作人员疏忽，在录入ID号的时候发生了一处错误，造成了某个ID断号，另外一个ID重号。

    你的任务是通过编程，找出断号的ID和重号的ID。

    假设断号不可能发生在最大和最小号。


    ### 输入格式

    要求程序首先输入一个整数N(N<100)表示后面数据行数。

    接着读入N行数据。

    每行数据长度不等，是用空格分开的若干个（不大于100个）正整数（不大于100000），请注意行内和行末可能有多余的空格，你的程序需要能处理这些空格。

    每个整数代表一个ID号。


    ### 输出格式

    要求程序输出1行，含两个整数m n，用空格分隔。

    其中，m表示断号ID，n表示重号ID'
  samples:
  - input: '2

      5 6 8 11 9

      10 12 9

      '
    output: '7 9

      '
  tests:
  - input: "3\n25 13 22 21 27 17 19 \n12 16 26 28 \n20 23 18 29 14 24 10 11 19\n"
    output: '15 19

      '
  - input: '7

      2066 2052 2025 2068 2027 2093 2069 2016 2022 2026 2011 2091 2028 2013 2054 2065

      2086 2036 2097 2001 2062 2064 2037 2039 2013 2041 2021 2077 2063 2060 2030 2089

      2080 2032 2044 2067 2040 2056 2082 2057 2043 2079 2045 2058 2095 2035 2081 2046

