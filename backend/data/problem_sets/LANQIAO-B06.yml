  difficulty: medium
  statement: '![公式求和.jpg](http://101.34.251.72/api/public/img/08ae9007bc354597b3e28ccbd151ecf3.jpg)


    ### 输入格式

    输入的第一行包含一个整数n；第二行包含一个整数m，第三行包含一个整数k。


    ### 输出格式

    162


    ### 提示与数据范围

    对于10%的数据，n≤10，k≤3；

    对于20%的数据，n≤20，k≤3；

    对于30%的数据，n≤1000，k≤5；

    对于40%的数据，n≤10^7，k≤10；

    对于60%的数据，n≤10^15，k ≤100；

    对于70%的数据，n≤10^100，k≤200；

    对于80%的数据，n≤10^500，k ≤500；

    对于100%的数据，n在十进制下不超过1000位，即1≤n<10^1000，1≤k≤1000，同时0≤m≤n，k≤n。'
