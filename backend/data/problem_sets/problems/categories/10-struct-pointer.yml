  statement: "新年快到了，小蓝 打算给他的好朋友们发贺年卡，而且他已经选好了自己要购买的贺卡的样式。俗话说得好，货比三家，小蓝 来到商店，看了各个商铺这种贺卡的价钱。不仅如此，小蓝
    还记住了每个商铺的存货量。已知 小蓝 打算购买  m  张贺卡，问她最少花多少钱。\n\n### 输入格式\n第一行两个整数m和n。其中m表示要购买的贺卡的数量，n
    表示商铺的个数。 \n以下n行，每行两个整数，分别表示该商铺这种贺卡的单价和存货量。\n\n### 输出格式\n仅一个数，表示 小蓝 花的最少钱数。    \n
    \n\n### 提示与数据范围\n**【数据规模】**\n  0<m,n<=1000  ，每个商铺贺卡单价在  1~100  之间，数量在  1~1000
    \ 之间，输入保证商铺的总存货量不少于  m  。"
