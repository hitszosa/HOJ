- slug: 10-struct-pointer-p02
  seq: 2
  title: 奖学金
  difficulty: L1-入门
  category: 结构体与复合数据类型
  tags:
  - 结构体与复合数据类型
  - 一本通在线评测
  knowledge:
  - 一本通在线评测
  provenance: 一本通基础篇
  statement: "某小学最近得到了一笔赞助，打算拿出其中一部分为学习成绩优秀的前5名学生发奖学金。\n期末，每个学生都有3门课的成绩:语文、数学、英语。先按总分从高到低排序，如果两个同学总分相同，再按语文成绩从高到低排序，如果两个同学总分和语文成绩都相同，那么规定学号小的同学排在前面，这样，每个学生的排序是唯一确定的。
    \ \n任务：先根据输入的3门课的成绩计算总分，然后按上述规则排序，最后按排名顺序输出前五名名学生的学号和总分。\n注意，在前5名同学中，每个人的奖学金都不相同，因此，你必须严格按上述规则排序。例如，在某个正确答案中，如果前两行的输出数据(每行输出两个数:学号、总分)
    是:\n7 279\n5 279\n这两行数据的含义是:总分最高的两个同学的学号依次是7号、5号。这两名同学的总分都是279(总分等于输入的语文、数学、英语三科成绩之和)，但学号为7的学生语文成绩更高一些。如果你的前两名的输出数据是:\n5
    279\n7 279\n则按输出错误处理，不能得分。\n\n### 输入格式\n输入包含n+1行:\n第1行为一个正整数n（小于300），表示该校参加评选的学生人数。\n第2到n+1行，每行有3个用空格隔开的数字，每个数字都在0到100之间。\n第j行的3个数字依次表示学号为
    j-1 的学生的语文、数学、英语的成绩。\n每个学生的学号按照输入顺序编号为1~n (恰好是输入数据的行号减1)。\n\n### 输出格式\n共有5行，每行是两个用空格隔开的正整数，依次表示前5名学生的学号和总分。"
  samples:
  - input: '7 279

      5 279

      '
    output: '5 279

      7 279

      '
