- slug: 10-struct-pointer-p03
  seq: 3
  title: 期末考试成绩排名
  difficulty: L2-基础
  category: 结构体与复合数据类型
  tags:
  - 结构体与复合数据类型
  - '容器 '
  - 结构体
  knowledge:
  - '容器 '
  - 结构体
  provenance: 东方博宜OJ
  statement: "期末考试结束了，数学成绩已经出来，数学老师请你帮忙编写一个程序，可以帮助老师对班级所有同学的考试分数按照由高到第低进行排序，并输出按照成绩排序后每个同学的学号、姓名、数学成绩。\n\n###
    输入格式\n第一行是一个整数n（n<=100），代表班级的总人数 \n接下来n行，每行有3个数据，第一个数据是某个同学的学号，第二个数据是该同学的姓名的拼音（拼音不含空格），第三个数据是该同学的数学成绩（成绩是整数）\n\n###
    输出格式\n按照数学成绩由高到低输出每个同学的学号、姓名、数学成绩，每行含1个同学的3个数据，3个数据用空格隔开。（如果出现多个同学数学成绩相同，则按照学号由小到大输出，不存在多个同学学号相同的情况）"
  samples:
  - input: '3

      1 zhangfang 98

      2 liming 100

      3 sunhua 99

      '
    output: '2 liming 100

      3 sunhua 99

      1 zhangfang 98

      '
  tests:
  - input: '5

      4 qianliu 98

      2 lisi 100

      3 wangwu 99

      1 zhangsan 98

      5 sunqi 97

      '
    output: '2 lisi 100

      3 wangwu 99

      1 zhangsan 98

      4 qianliu 98

      5 sunqi 97

      '
  - input: '3

      1 zhouming 98

      3 zhangfang 100

      2 wangrui 100

      '
    output: '2 wangrui 100

      3 zhangfang 100

      1 zhouming 98

      '
- slug: 10-struct-pointer-p04-2
  seq: 4
  title: 宇宙总统2
  difficulty: L2-基础
  category: 结构体与复合数据类型
  tags:
  - 结构体与复合数据类型
  - 容器
  - 结构体
  knowledge:
  - 容器
  - 结构体
  provenance: 东方博宜OJ
  statement: "地球历公元6036年，全宇宙准备竞选一个最贤能的人当总统，共有n个非凡拔尖的人竞选总统，现在投票已经结束，获得选票最多的人将荣登总统的宝座，如果有多个候选人获得票数一致，那么名字字典码最大的人将获得总统的宝座。请你编程计算出谁能够胜任总统的职位。
    \n比如，有10个人参加了投票，这10张选票结果分别是。 \nzhangguoqiang \nliming \nwangfang \nzhangguoqiang
    \nwangfang \nzhangguoqiang \nzhaofei \nzhaofei \nwangfang \nzhaofei \n统计结果zhangguoqiang、wangfang、zhaofei三人每人都是3票，由于zhaofei名字的字典码最大，zhaofei当选为本届宇宙总统。
    \n<div>\n\t \n</div>\n\n### 输入格式\n第1行是一个整数n，代表投票的总数。（n<=1000）\n第2行~第n+1行，每行是一个得到选票的人的名字（名字一定是小写的拼音，没有空格）。\n\n###
    输出格式\n输出n行，按照每个人的得票数由高到低的顺序输出每个人的名字和得票数，中间用空格隔开。（如果有多个人得票数一致，则名字字典码大的人排在前面）"
  samples:
  - input: '10

      liming

      wangfang

      zhangguoqiang

      zhangguoqiang

      wangfang

      zhangguoqiang

      zhaofei

      zhaofei

      wangfang

      zhaofei

      '
    output: 'zhaofei 3

      zhangguoqiang 3

      wangfang 3

      liming 1

      '
  tests:
  - input: '5

      wanggang

      wanggang

      wanggang

      zhaofei

      zhaofei

      '
    output: 'wanggang 3

      zhaofei 2

      '
