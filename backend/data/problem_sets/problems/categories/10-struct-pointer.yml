- slug: 10-struct-pointer-p06
  seq: 6
  title: 新生舞会
  difficulty: L2-基础
  category: 结构体与复合数据类型
  tags:
  - 结构体与复合数据类型
  - 蓝桥杯
  - 结构体
  knowledge:
  - 蓝桥杯
  - 结构体
  provenance: 东方博宜OJ
  statement: "新生舞会开始了。n名新生每人有三个属性：姓名、学号、性别。其中，姓名用长度不超过20的仅由大小写字母构成的字符串表示，学号用长度不超过10的
    仅由数字构成的字符串表示，性别用一个大写字符‘F’或‘M’表示。任意两人的姓名、学号均互不相同。换言之，每个人可被其姓名或学号唯一确定。\n \n给出m对两人的信息（姓名或学号），判断他们是否能共舞。两人能共舞的充要条件为两人性别相异。\n\n###
    输入格式\n第一行一个整数n（2<=n<=1000），表示学生人数。接下来的n行每行依次包含一名新生的姓名、学号、性别，分别用一个空格隔开。\n \n之后的一行是一个整数m(1<=m<=1000)，表示询问的数目。接着的m行每行包含两个信息（姓名或学号），保证两个信息不属于同一人，中间用一个空格隔开。\n\n###
    输出格式\n对于每个询问输出一行，如果两人可以共舞，输出一个大写字母‘Y’，否则输出一个大写字母‘N’。\n\n### 提示与数据范围\n【来源】蓝桥杯算法训练"
