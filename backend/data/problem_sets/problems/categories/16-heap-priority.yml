- slug: 16-heap-priority-p02-1-1-1
  seq: 2
  title: 「一本通 1.1 练习 1」数列极差
  difficulty: L4-提高
  category: 二叉堆与优先队列
  tags:
  - 二叉堆与优先队列
  - 贪心
  - 堆
  knowledge:
  - 贪心
  - 堆
  provenance: 一本通提高篇
  statement: "佳佳的老师在黑板上写了一个由 $n$ 个正整数组成的数列，要求佳佳进行如下操作：每次擦去其中的两个数 $a$ 和 $b$，然后在数列中加入一个数
    $a\\times b+1$，如此下去直至黑板上剩下一个数为止，在所有按这种操作方式最后得到的数中，最大的为 $\\max$，最小的为 $\\min$， 则该数列的极差定义为
    $M=\\max -\\min$。\n\n由于佳佳忙于准备期末考试，现请你帮助他，对于给定的数列，计算出相应的极差 $M$。\n\n### 输入格式\n第一行为一个正整数
    $n$ 表示正整数序列的长度；  \n\n在接下来的 $n$ 行中，每行输入一个正整数。  \n\n接下来的一行有一个 $0$，表示数据结束。\n\n###
    输出格式\n输出只有一行，为相应的极差 $d$。\n\n### 提示与数据范围\n对于全部数据，$0\\le n\\le 50000$，保证所有数据计算均在
    $32$ 位有符号整数范围内。"
  samples:
  - input: '3

      1

      2

      3

      0

      '
    output: '2

      '
  tests:
  - input: "10\n3\n12\n5 \n4\n8\n19\n16\n5\n13\n2\n0\n"
    output: "63571141\r\n\r\n"
  - input: '6

      2

      3

      6

      5

      4

      1

      0


      '
    output: "528\r\n"
- slug: 16-heap-priority-p03
  seq: 3
  title: 取扑克牌
  difficulty: L1-入门
  category: 二叉堆与优先队列
  tags:
  - 二叉堆与优先队列
  - 容器
  knowledge:
  - 容器
  provenance: 东方博宜OJ
  statement: "有N（N<=1000）张扑克牌放成一堆，每次从上面取一张牌翻开，再从上面取一张牌放到这堆牌的下面。也就是从上面奇数次取到的牌翻开放成一排，偶数次取到的牌放在下面直到取完。
    \n输入N张扑克牌的排满数字，输出翻开的情况。比如，N=4，牌面从上到下依次是1 2 3 4，那么翻开牌面的情况为1 3 2 4。\n\n### 输入格式\n第一行是一个整数N（N<=1000），第二行是N个整数，代表从上到下的牌面数。\n\n###
    输出格式\n按照翻开牌面的顺序，输出翻开的结果，数字之间用一个空格隔开。"
  samples:
  - input: '4

      1 2 3 4

      '
    output: '1 3 2 4

      '
  tests:
  - input: '10

      1 2 3 4 5 10 9 8 7 6

      '
    output: '1 3 5 9 7 2 10 6 8 4

      '
  - input: '7

      7 6 5 4 3 2 1

      '
    output: '7 5 3 1 4 6 2

      '
  - input: '1

      1

      '
    output: '1

      '
  - input: '6

      1 2 3 4 5 6

      '
    output: '1 3 5 2 6 4

      '
  - input: '5

      1 2 3 4 5

      '
    output: '1 3 5 4 2

      '
- slug: 16-heap-priority-p04
  seq: 4
  title: 论坛帖子
  difficulty: L1-入门
  category: 二叉堆与优先队列
  tags:
  - 二叉堆与优先队列
  - 容器
  knowledge:
  - 容器
  provenance: 东方博宜OJ
  statement: "你是一个论坛的站长,你们论坛有约10万个帖子,每个帖子编号为1-100000。每个帖子里面又有若干个回复。现在告诉你每个帖子下面的回复人的ID(ID的范围为1-100000)现在你要写一个程序,支持插入操作,即ADD
    x y 代表编号为x的帖子有一个ID为y的人回复。支持查询操作，即QUERY x y 代表查询编号为x的帖子第y个回复的人的ID。\n\n### 输入格式\n第1行一个整数N，代表有N次询问（1<=N<=100000）
    \n第2行到第N+1行代表N次询问的内容，每行为以下2种格式之一： \nADD x y 新增加了一个回复，代表编号为x的帖子有一个ID为y的人回复 \nQUERY
    x y 代表查询编号为x的帖子第y个回复的人的ID \n保证1<=x<=100000,1<=y<=100000\n\n### 输出格式\n对于每个QUERY的查询,每次输出占一行,代表编号为x的帖子第y个回复的人的ID，如果编号为x的帖子总的回复数小于y，则输出-1。"
  samples:
  - input: '8

      ADD 10 10086

      ADD 10 10010

      QUERY 10 1

      QUERY 88888 1

      ADD 88888 10010

      ADD 88888 12580

      QUERY 88888 2

      QUERY 88888 3

      '
    output: "10086 \n-1 \n12580 \n-1\n"
  tests:
  - input: '8

      ADD 10 88

      ADD 20 80

      ADD 20 81

      ADD 10 90

      QUERY 10 2

      QUERY 20 3

      QUERY 10 1

      QUERY 100 5

      '
    output: '90

      -1

      88

      -1

      '
  - input: '6

      ADD 10 88

      ADD 20 80

      ADD 20 81

      QUERY 20 2

      QUERY 10 2

      QUERY 100 5

      '
    output: '81

      -1

      -1

      '
  - input: '5

      ADD 12000 90000

      ADD 90010 80000

      QUERY 12000 1

      QUERY 12000 2

      QUERY 12000 3

      '
    output: '90000

      -1

      -1

      '
- slug: 16-heap-priority-p05
  seq: 5
  title: 叫号软件
  difficulty: L1-入门
  category: 二叉堆与优先队列
  tags:
  - 二叉堆与优先队列
  - 容器
  knowledge:
  - 容器
  provenance: 东方博宜OJ
  statement: "课代表SW由于工作失误被扣了奖学金，所以他不得不去某家饭店打工，饭店很火爆，经常没有位置，所以不得不叫号。 \n他管理叫号软件，一天他不小心把叫号软件的程序删除了，他感觉他完蛋了，
    正准备跑路，善良的你不忍心他丢工作你能帮他重新写一个叫号软件吗？ \n软件有三个指令： \nEND为结束程序 \nPUSH NAME 为新来了一个名字叫做NAME的人排队,NAME的长度小于等于10，且NAME没有重复。
    \nPOP为如果有人在排队则输出当前队列中来的最早的人的名字并将其从队列里删除，如果队列没有人输出“EMPTY”(没有引号)\n\n### 输入格式\n只有一组测试数据
    \n但是输入可能有若干行(保证不超过100000)，每行一个命令： \nPUSH NAME（NAME没有空格） \nPOP \nEND \n其中，END命令只会在最后一行出现，并且保证有END
    \n输入END命令后立刻结束程序\n\n### 输出格式\n针对每个POP命令输出一行，如果有人在排队则输出当前队列中来的最早的人的名字并将其从队列里删除
    否则 输出“EMPTY”(没有引号)"
  samples:
  - input: 'PUSH LZX

      PUSH CQW

      POP

      PUSH SW

      POP

      POP

      POP

      END

      '
    output: 'LZX

      CQW

      SW

      EMPTY

      '
  tests:
  - input: 'POP

      PUSH XIAOMING

      PUSH ZHANGFANG

      POP

      POP

      POP

      POP

      POP

      PUSH WANGFANG

      PUSH ZHAOMING

      POP

      POP

      POP

      END

      '
    output: 'EMPTY

      XIAOMING

      ZHANGFANG

      EMPTY

      EMPTY

      EMPTY

      WANGFANG

      ZHAOMING

      EMPTY

      '
  - input: 'PUSH ZHANG

      PUSH LI

      PUSH WANG

      POP

      PUSH ZHAO

      POP

      POP

      POP

      POP

      POP

      PUSH SUN

      POP

      END

      '
    output: 'ZHANG

      LI

      WANG

      ZHAO

      EMPTY

      EMPTY

      SUN

      '
- slug: 16-heap-priority-p06
  seq: 6
  title: 数的操作
  difficulty: L1-入门
  category: 二叉堆与优先队列
  tags:
  - 二叉堆与优先队列
  - 容器
  knowledge:
  - 容器
  provenance: 东方博宜OJ
  statement: "给定一个N个数的数组，M次操作，每次操作为下列操作之一。求最后的数组。 \n操作1：在第X个数之后插入一个数Y。 \n操作2：删除第X个数。\n\n###
    输入格式\n第一行两个整数N，M（N，M≤100000），N表示数组中一开始有N个数，M表示M次操作。 \n第二行N个整数，表示原来的数组。 \n接下来M行，每行第一个数OPT，表示操作类型。
    \n对于操作1，接下来两个数X，Y，表示在第X数之后插入一个数Y，保证0≤X≤当前数的个数，若X=0，表示在数组开头插入。 \n对于操作2，接下来一个数X，表示要删除第X个数，保证1≤X≤当前数的个数\n\n###
    输出格式\n输出若干个数，表示最后的数组。"
  samples:
  - input: '5 3

      1 2 3 4 5

      1 1 6

      2 1

      2 2

      '
    output: '6 3 4 5

      '
  tests:
  - input: '6 5

      10 20 30 40 50 60

      1 0 100

      1 5 200

      1 3 300

      2 2

      2 2

      '
    output: '100 300 30 40 200 50 60

      '
