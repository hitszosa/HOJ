    价格（单价*数量），商品名是长度不超过20的字符串（商品名不含空格）。 \n请按商品名的字典顺序，输出当天每种商品名和其售出的总价。\n\n### 输入格式\n第一行是一个整数N（N<100000），代表了订单的数量
