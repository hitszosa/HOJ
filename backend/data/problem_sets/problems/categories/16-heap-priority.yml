  statement: '在黑板上写了N个正整数作成的一个数列，进行如下操作：每一次擦去其中的两个数a和b，然后在数列中加入一个数a×b+1，如此下去直至黑板上剩下一个数，在所有按这种操作方式最后得到的数中，最大的max，最小的为min，则该数列的极差定义为M=max−min。


    ### 输入格式

    第一行，一个数为N;


    第二行，N个数。


    ### 输出格式

    输出极差。


    ### 提示与数据范围

    数据范围：$n \le 100$'
