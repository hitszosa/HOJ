- slug: 16-heap-priority-p10
  seq: 10
  title: 户口统计
  difficulty: L1-入门
  category: 二叉堆与优先队列
  tags:
  - 二叉堆与优先队列
  - 容器
  knowledge:
  - 容器
  provenance: 东方博宜OJ
  statement: "某小区统计了一下该小区的常住人数，并详细统计了家庭关系，每个家庭的户口簿中有户主1名，还有若干家庭成员。请你写程序，读入每个家庭的户主及家庭成员，读入结束后，根据户主的名字可以打印出该家庭的所有成员（含户主），并按家庭成员姓名的字典码升序排序！\n\n###
    输入格式\n输入由多行组成，首先是一系列家庭关系的描述，其中每一组关系中户主只有一行，家庭成员可能有若干行；用#name的形式描写一组家庭关系中的户主的名字，用+name的形式描写一组家庭关系中的成员的名字，成员的名字一定紧接着户主的名字出现；\n\n（请注意，读入时，户主以#读入，不再以+再次读入）接下来用一个?name的形式表示要求该户主对应的所有家庭成员（含户主）；（?name一定在家庭关系描述结束之后出现）
    \n最后用单独的一个$表示文件结束。\n\n### 输出格式\n输出该户主对应的家庭中，所有成员的名字，每行1个（假设小区中户主名字不存在重复，而家庭成员名字可以重复），如果户主名字不存在，请输出“no
    data”（双引号中间的内容）。"
  samples:
  - input: '#wangxiaoming

      +wangguixiang

      +lidaxin

      +zhangxiaoyang

      +wangyunfei

      #zhangfang

      +zhangxinyu

      +zhangyufei

      +zhaochengyu

      +anqi

      +anjia

      ?zhangfang

      $

      '
    output: 'anjia

      anqi

      zhangfang

      zhangxinyu

      zhangyufei

      zhaochengyu

      '
  tests:
  - input: '#wangxiaoming

      +wangguixiang

      +lidaxin

      +zhangxiaoyang

      +wangyunfei

      #zhangfang

      +zhangxinyu

      +zhangyufei

      +zhaochengyu

      +anqi

      +anjia

      ?zhanggang

      $

      '
    output: 'no data

      '
- slug: 16-heap-priority-p11
  seq: 11
  title: 会话列表
  difficulty: L1-入门
  category: 二叉堆与优先队列
  tags:
  - 二叉堆与优先队列
  - 容器
  knowledge:
  - 容器
  provenance: 东方博宜OJ
  statement: "小云正在参与开发一个即时聊天工具，他负责其中的会话列表部分。会话列表为显示为一个从上到下的多行控件，其中每一行表示一个会话，每一个会话都可以以一个唯一正整数id表示。当用户在一个会话中发送或接收信息时，如果该会话已经在会话列表中，则会从原来的位置移到列表的最上方；如果没有在会话列表中，则在会话列表最上方插入该会话。小云在现在要做的工作是测试，他会先把会话列表清空等待接收信息。当接收完大量来自不同会话的信息后，就输出当前的会话列表，以检查其中是否有bug。\n\n###
    输入格式\n输入的第一行为一个正整数T（T<=1000），表示测试数据组数。 \n接下来有T组数据。每组数据的第一行为一个正整数N（1<=N<=200），表示接收到信息的次数。第二行为N个正整数，按时间从先到后的顺序表示接收到信息的会话id。会话id不大于1000000000。\n\n###
    输出格式\n对于每一组数据，输出一行，按会话列表从上到下的顺序，输出会话id。 \n相邻的会话id以一个空格分隔，行末没有空格。"
  samples:
  - input: '3

      5

      1 2 3 4 5

      6

      1 100 1000 1000 100 1

      7

      1 6 3 3 1 8 1

      '
    output: '5 4 3 2 1

      1 100 1000

      1 8 3 6

      '
  tests:
  - input: '5

      3

      2 3 2

      5

      2 5 4 3 1

      6

      3 5 6 1 3 5

      8

      1 8 7 6 8 7 8 6

      10

      1 6 7 8 7 6 1 7 6 1

      '
    output: '2 3

      1 3 4 5 2

      5 3 1 6

      6 8 7 1

      1 6 7 8

      '
- slug: 16-heap-priority-p12
  seq: 12
  title: 火车编组
  difficulty: L1-入门
  category: 二叉堆与优先队列
  tags:
  - 二叉堆与优先队列
  - 容器
  knowledge:
  - 容器
  provenance: 东方博宜OJ
  statement: "货运火车要在编组站根据挂靠车厢到达目的地重新分组，如果一列火车有４节车厢，经过编组后，车厢的编组顺序为3,2,4,1；您知道编组站是怎么编组的吗？小明到编组站参观后发现编组站的铁路有很多岔道，火车在岔道上来来回回地开动，最后列车编组就完成了。小明想到学习过的栈操作，发现火车编组的过程就是由若干进栈，出栈操作构成的。于是小明编了一个程序，只要知道最后的编组要求，就能将编组方案输出。\n
    \n比如，有4辆火车，初始的顺序是1 2 3 4，最后编组的结果是3 2 4 1，那么只需要准备一个栈，让这4辆火车按照：进栈、进栈、进栈、出站、出站、进栈、出站、出站的顺序进行栈的操作就可以得到3
    2 4 1的编组结果。\n\n### 输入格式\n第１行１个正整数n,n<=100 \n第２行n个小于或等于n的正整数，表示有n节车厢，编号为1,2,3,……,n；编组时按照编号进栈，第２行表示列车经过编组后的车厢编号顺序；\n\n###
    输出格式\n一行一个由大写字母A和B构成的字符串，A表示进栈，B表示出栈。表示编组时进栈出栈的操作序列；"
  samples:
  - input: '4

      3 2 4 1

      '
    output: 'AAABBABB

      '
  tests:
  - input: '10

      1 3 5 6 4 8 7 10 9 2

      '
    output: 'ABAABAABABBAABBAABBB

      '
  - input: '20

      2 1 5 4 3 6 8 7 9 12 11 13 10 14 15 16 18 20 19 17

      '
    output: 'AABBAAABBBABAABBABAAABBABBABABABAABAABBB

      '
- slug: 16-heap-priority-p13
  seq: 13
  title: 快速堆猪
  difficulty: L1-入门
  category: 二叉堆与优先队列
  tags:
  - 二叉堆与优先队列
  - 优先队列
  knowledge:
  - 优先队列
  provenance: 电子学会C++等级考试
  statement: '小明有很多猪，他喜欢玩叠猪游戏，就是将猪一头头叠起来。猪叠上去后，还可以把顶上的猪拿下来。小明知道每头猪的重量，而且他还随时想知道叠在那里的猪最轻的是多少斤。


    ### 输入格式

    有三种输入 1)push n n是整数(0<=0 <=20000)，表示叠上一头重量是n斤的新猪 2)pop 表示将猪堆顶的猪赶走。如果猪堆没猪，就啥也不干
    3)min 表示问现在猪堆里最轻的猪多重。如果猪堆没猪，就啥也不干 输入总数不超过100000条。


    ### 输出格式

    对每个min输入，输出答案。如果猪堆没猪，就啥也不干。'
  samples:
  - input: 'pop

      min

      push 5

      push 2

      push 3

      min

      push 4

      min

      '
    output: '2

      2

      '
  tests:
  - input: '8

      pop

      min

      push 5

      push 2

      push 3

      min

      push 4

      min

      '
    output: '2

      2

      '
  - input: '5

      push 10

      min

      push 20

      min

      pop

      '
    output: '10

      10

      '
  - input: '4

      push 8

      push 3

      min

      pop

      '
    output: '3

      '
