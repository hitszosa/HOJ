  statement: '输入一个正整数 n，从 1 到 n 的 n 个自然数中任选 m 个数进行全排列，我们知道共有 A(n,m) 种排列，将这些排列按字典序编号为
    1 到 A(n,m)，请输出编号为 r 的排列。 如果A(n,m)< r 则输出-1。


    ### 输入格式

    第一行为三个正整数n，m，r，两两之间用一个空格隔开。


    ### 输出格式

    按题目要求输出，若有多个数，则两两之间用一个空格分隔。


    ### 提示与数据范围

    1〈=n,m,r〈=20


    m〈=n.


    1 2 3 4 5


    1 2 3 5 4


    1 2 4 3 5


    1 2 4 5 3


    1 2 5 3 4


    1 2 5 4 3


    ......'
