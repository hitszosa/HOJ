  statement: '我们知道在中国象棋的棋盘上,马走日字行的(如下图所示),现在有一个 N*M 的方格棋盘,给定两个点的坐标 A(a1,b1) 和 B（a2,b2）,问按照马走日字的规则，再附加一条马只能望右跳，问能否实现从
    A 点走到 B 点。


    <img alt="" src="http://223.71.216.214/oj/upfile/1468891160741.png#xhe_tmpurl"
    />


    ### 输入格式

    两行，第一行包含两个数 N 和 M，第二行包括四个数分别为 a1,b1,a2 和 b2。各行的数两两之间用一个空格分隔。


    ### 输出格式

    yes 或 no


    ### 提示与数据范围

    数据范围：1 < N,M < 100, 0 <= a1,a2 <= M-1,0 <= b1,b2 <= N-1.'
