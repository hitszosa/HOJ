  statement: "**原题来自：USACO**\n\n已知原数列 $a_1,a_2,\\cdots,a_n$ 中的前 $1$ 项，前 $2$ 项，前 $3$
    项， $\\cdots$ ，前 $n$ 项的和，以及后 $1$ 项，后 $2$ 项，后 $3$ 项， $\\cdots$ ，后 $n$ 项的和，但是所有的数都被打乱了顺序。此外，我们还知道数列中的数存在于集合
    $S$ 中。试求原数列。当存在多组可能的数列时，求字典序最小的数列。\n\n### 输入格式\n第 $1$ 行，一个整数 $n$ 。  \n\n第 $2$
