  provenance: 洛谷精选题库
  statement: '乔治拿来一组等长的木棒，将它们随机地砍断，使得每一节木棍的长度都不超过 $50$ 个长度单位。


    然后他又想把这些木棍恢复到为裁截前的状态，但忘记了初始时有多少木棒以及木棒的初始长度。


    请你设计一个程序，帮助乔治计算木棒的可能最小长度。


    每一节木棍的长度都用大于零的整数表示。


    ### 输入格式

    第一行是一个不超过 $64$ 的整数，表示砍断之后共有多少节木棍。


    第二行是截断以后，所得到的各节木棍的长度。


    ### 输出格式

    输出原始木棒的可能最小长度。


    ### 提示与数据范围

    数据范围


    数据保证每一节木棍的长度均不大于 $50$。'
