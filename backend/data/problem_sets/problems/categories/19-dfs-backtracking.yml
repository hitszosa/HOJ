  statement: "某寝室的同学们在学术完之后准备玩一个游戏： 游戏是这样的，每个人头上都被贴了一张白色或者黑色的纸，现在每个人都会说一句话 “ 我看到 x
    张白色纸条和 y 张黑色的纸条 ” ，又已知每个头上贴着白色纸的人 说的是真话、每个头上贴着黑色纸的人说的是谎话，现在要求你判断哪些人头上贴着的是白色的纸条，如果无解输出
    “NoSolution.” ；\n\n如果有多组解， 则把每个答案中贴白条的人的编号按照大小排列后组成一个数（比如第一个人和第三个人头上贴着的是白纸条，那么这个数就是
    13 ；如果第 6 、 7 、 8 个人都贴的 是白纸条，那么这个数就是 678 ）输出最小的那个数（如果全部都是黑纸条也满足情况的话，那么输出 0 ）\n\n###
    输入格式\n第一行为一个整数 n ，接下来 n 行中的第 i 行有两个整数 x 和 y ，分别表示第 i 个人说 “ 我看到 x 张白色纸条和 y 张黑色的纸条
    ” 。（n<8）\n\n### 输出格式\n一行。如果无解输出 “NoSolution.” 。否则输出答案中数值（具体见问题描述）最小的那个，如果全部都是黑纸条也满足情况的话，那么输出
    0     \n \n\n### 提示与数据范围\n【来源】蓝桥杯算法训练\n \n如果全部都是黑纸条也满足情况的话，那么输出 0。"
