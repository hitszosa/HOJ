- slug: 19-dfs-backtracking-p09-1-3-2
  seq: 9
  title: 「一本通 1.3 例 2」生日蛋糕
  difficulty: L4-提高
  category: 深度优先搜索与状态回溯
  tags:
  - 深度优先搜索与状态回溯
  - 搜索
  - 剪枝优化
  knowledge:
  - 搜索
  - 剪枝优化
  provenance: 一本通提高篇
  statement: "Mr.W 要制作一个体积为 $N\\pi$ 的 $M$ 层生日蛋糕，每层都是一个圆柱体。\n\n设从下往上数第 $i$ 蛋糕是半径为 $R_i$，高度为
    $H_i$ 的圆柱。当 $i<M$ 时，要求  $R_i>R_{i+1}$ 且 $H_i >H_{i+1}$。由于要在蛋糕上抹奶油，为尽可能节约经费，我们希望蛋糕外表面（最下一层的下底面除外）的面积
    $Q$ 最小。\n\n令 $Q =Sπ$ ，请编程对给出的 $N$ 和 $M$ ，找出蛋糕的制作方案（适当的 $R_i$ 和 $H_i$ 的值），使 $S$
    最小。（除 $Q$ 外，以上所有数据皆为正整数） \n\n![birthdaycake.png](https://img.loj.ac.cn/2020/10/17/5f8aab1bb4312.png)\n\n###
    输入格式\n第一行为 $N$ ，表示待制作的蛋糕的体积为 $N\\pi$；\n\n第二行为 $M$ ，表示蛋糕的层数为 $M$ 。\n\n### 输出格式\n输出仅一行，一个整数
    $S$（若无解则 $S=0$ ）。\n\n### 提示与数据范围\n对于全部数据，$1 \\leq N \\leq 10^4,1 \\leq M \\leq
    20$。"
  samples:
  - input: '100

      2

      '
    output: '68

      '
  tests:
  - input: "10000\r\n1\n"
    output: "1400\r\n"
  - input: "9876\r\n6\n"
    output: "1448\r\n"
  - input: "1000\r\n3\n"
    output: "316\r\n"
  - input: "4999\r\n8\n"
    output: "1015\r\n"
  - input: "9397\r\n10\n"
    output: "1618\r\n"
- slug: 19-dfs-backtracking-p10-1-3-3
  seq: 10
  title: 「一本通 1.3 例 3」小木棍
  difficulty: L4-提高
  category: 深度优先搜索与状态回溯
  tags:
  - 深度优先搜索与状态回溯
