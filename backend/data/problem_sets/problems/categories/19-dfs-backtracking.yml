  statement: '在一张 n*m 的棋盘上（如 6 行 7 列）的最左上角（ 1,1 ）的位置有一个卒。该卒只能向下或者向右走，且卒采取的策略是先向下，下边走到头就向右，请问从（
    1,1 ）点走到（ n,m ）点可以怎样走，输出这些走法。

    <img src="http://oj.czos.cn/upload/image/20180703/20180703190238_29231.png" alt=""
    />


    ### 输入格式

    两个整数n，m代表棋盘大小（3=<n<=8,3<=m<=8）


    ### 输出格式

    卒的行走路线'
