    (很容易创建形状稀奇古怪的牧场，甚至是围着其它圆圈的圆圈。) \n\t每一张照片都数字化的抽象了，牧场区显示为\"*\",非牧场区显示为\".\"。下面是一个10
    * \n5的卫星照片样例:&nbsp;\n \n<pre class=\"prettyprint lang-html\">..*.....**\n.**..*****\n.*...*....\n..****.***\n..****.***</pre>\n
    这张照片显示了大小分别为4、16、6个像素的连续牧场区。帮助农场主约翰在他的每张卫星照片中找到最大的连续牧场。\n\n### 输入格式\n第1行: 两个由空格分开的整数，W
    和 H。\n第2到H+1行: 每一行包含W个\"*\"或者\".\"，代表卫星照片的横向行。\n\n### 输出格式\n最大连续牧场的大小。"
