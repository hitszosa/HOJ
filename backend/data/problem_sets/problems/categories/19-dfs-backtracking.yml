- slug: 19-dfs-backtracking-p48
  seq: 48
  title: 算法训练 单词接龙
  difficulty: L3-普及
  category: 深度优先搜索与状态回溯
  tags:
  - 深度优先搜索与状态回溯
  - 蓝桥杯-算法训练
  knowledge:
  - 蓝桥杯-算法训练
  provenance: 蓝桥杯VIP题库 · 蓝桥杯-算法训练
  statement: '单词接龙是一个与我们经常玩的成语接龙相类似的游戏，现在我们已知一组单词，且给定一个开头的字母，要求出以这个字母开头的最长的“龙”（每个单词都最多在“龙”中出现两次），在两个单词相连时，其重合部分合为一部分，例如
    beast和astonish，如果接成一条龙则变为beastonish，另外相邻的两部分不能存在包含关系，例如at 和 atide 间不能相连。


    ### 输入格式

    输入的第一行为一个单独的整数n (n<=20)表示单词数，以下n 行每行有一个单词，输入的最后一行为一个单个字符，表示“龙”开头的字母。你可以假定以此字母开头的“龙”一定存在.


    ### 输出格式

    只需输出以此字母开头的最长的“龙”的长度。'
  samples:
  - input: '5

      at

      touch

      cheat

      choose

      tact

      a

      '
