- slug: 19-dfs-backtracking-p02
  seq: 2
  title: 单词接龙
  difficulty: L1-入门
  category: 深度优先搜索与状态回溯
  tags:
  - 深度优先搜索与状态回溯
  - 一本通在线评测
  knowledge:
  - 一本通在线评测
  provenance: 一本通基础篇
  statement: '单词接龙是一个与我们经常玩的成语接龙相类似的游戏，现在我们已知一组单词，且给定一个开头的字母，要求出以这个字母开头的最长的“龙”（每个单词都最多在“龙”中出现两次），在两个单词相连时，其重合部分合为一部分，例如beast和astonish，如果接成一条龙则变为beastonish，另外相邻的两部分不能存在包含关系，例如at和atide间不能相连。


    ### 输入格式

    输入的第一行为一个单独的整数n(n≤20)表示单词数，以下n行每行有一个单词（只含有大写或小写字母，长度不超过20），输入的最后一行为一个单个字符，表示“龙”开头的字母。你可以假定以此字母开头的“龙”一定存在。


    ### 输出格式

    只需输出以此字母开头的最长的“龙”的长度。'
  samples:
  - input: '5

      at

      touch

      cheat

      choose

      tact

      a

      '
    output: '23

      '
  tests:
  - input: '14

      abcd

      cdef

      efgh

      ghij

      ijkl

      lmno

      nopq

      pqrs

      rstu

      tuvw

      vwxy

      xyza

      abcd

      dzzzzzzzzzzr

      a

      '
    output: '68

      '
  - input: '10

      abcd

      cdef

      efgh

      ghij

      ijkl

      lmno

      nopq

      pqrs

      rstu

      tuva

      a

      '
    output: '45

      '
