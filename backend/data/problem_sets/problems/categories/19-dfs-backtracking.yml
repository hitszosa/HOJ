  statement: '给出n个整数，请问这n个数字在不改变顺序且不加入括号的情况下，有多少种运算能得到24。

    比如：4 10 2 4 8，有如下3种运算能够得到24。

    4+10-2+4+8=24

    4-10-2+4x8=24

    4x10-2x4-8=24


    ### 输入格式

    第1行有一个整数n；（2<=n<=10）

    第2行有n个整数ai；（1<=ai<=100）


    ### 输出格式

    一个整数，代表能计算出24点的方案数；'
