  provenance: 一本通基础篇
  statement: '农民JOHN以拥有世界上最健康的奶牛为傲。他知道每种饲料中所包含的牛所需的最低的维他命量是多少。请你帮助农夫喂养他的牛，以保持它们的健康，使喂给牛的饲料的种数最少。


    给出牛所需的最低的维他命量，输出喂给牛需要哪些种类的饲料，且所需的饲料剂量最少。


    维他命量以整数表示，每种饲料最多只能对牛使用一次，数据保证存在解。


    ### 输入格式

    第1行：一个整数V(1<=V<=25)，表示需要的维他命的种类数。


    第2行：V个整数(1<=每个数<=1000)，表示牛每天需要的每种维他命的最小量。


    第3行：一个整数G(1<=G<=15)，表示可用来喂牛的饲料的种数。


    下面G行，第n行表示编号为n饲料包含的各种维他命的量的多少。


    ### 输出格式

    输出文件只有一行，包括牛必需的最小的饲料种数P


    后面有P个数，表示所选择的饲料编号（按从小到大排列）。


    如果有多个解，输出饲料序号最小的（即字典序最小）。


    ### 提示与数据范围

    <span style="color: rgba(0, 0, 0, 0.75);">【数据范围】</span>


    <span style="color: rgba(0, 0, 0, 0.75);">对于</span><span style="color: rgba(0,
    0, 0, 0.75);">100%</span><span style="color: rgba(0, 0, 0, 0.75);">的数据，</span><span
    style="color: rgba(0, 0, 0, 0.75);">1≤v≤25</span><span style="color: rgba(0, 0,
    0, 0.75);">，</span><span style="color: rgba(0, 0, 0, 0.75);">1≤g≤15</span><span
    style="color: rgba(0, 0, 0, 0.75);">。</span>


    <span style="color: rgba(0, 0, 0, 0.75);">输入的所有整数在</span><span style="color: rgba(0,
    0, 0, 0.75);">[1,1000]</span><span style="color: rgba(0, 0, 0, 0.75);">范围内。'
