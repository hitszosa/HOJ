- slug: 19-dfs-backtracking-p13-1-3-1
  seq: 13
  title: 「一本通 1.3 练习 1」埃及分数
  difficulty: L4-提高
  category: 深度优先搜索与状态回溯
  tags:
  - 深度优先搜索与状态回溯
  - 数论
  - 搜索
  - 剪枝优化
  knowledge:
  - 数论
  - 搜索
  - 剪枝优化
  provenance: 一本通提高篇
  statement: "**来源：BIO 1997 Round 1 [Question 3](http://www.olympiad.org.uk/papers/1997/bio/bio97r1q3.html)**\n\n在古埃及，人们使用单位分数的和（形如
    $\\dfrac{1}{a}$ 的，$a$ 是自然数）表示一切有理数。如：$\\dfrac{2}{3} = \\dfrac{1}{2} + \\dfrac{1}{6}$，但不允许
    $\\dfrac{2}{3} = \\dfrac{1}{3} + \\dfrac{1}{3}$，因为加数中有相同的。对于一个分数 $\\dfrac{a}{b}$，表示方法有很多种，但是哪种最好呢？首先，加数少的比加数多的好，其次，加数个数相同的，最小的分数越大越好。如：\n\n$$\n\n\\begin{aligned}\n\n\\frac{19}{45}
    &= \\frac{1}{3} + \\frac{1}{12} + \\frac{1}{180}\\\\\n\n\\frac{19}{45} &= \\frac{1}{3}
    + \\frac{1}{15} + \\frac{1}{45}\\\\\n\n\\frac{19}{45} &= \\frac{1}{3} + \\frac{1}{18}
    + \\frac{1}{30}\\\\\n\n\\frac{19}{45} &= \\frac{1}{4} + \\frac{1}{6} + \\frac{1}{180}\\\\\n\n\\frac{19}{45}
    &= \\frac{1}{5} + \\frac{1}{6} + \\frac{1}{18}\\\\\n\n\\end{aligned}\n\n$$\n\n最好的是最后一种，因为
    $\\dfrac{1}{18}$ 比 $\\dfrac{1}{180}, \\dfrac{1}{45}, \\dfrac{1}{30}, \\dfrac{1}{18}$
    都大。  \n\n注意，可能有多个最优解。如：\n\n$$\n\n\\begin{aligned}\n\n\\frac{59}{211} &= \\frac{1}{4}
    + \\frac{1}{36} + \\frac{1}{633} + \\frac{1}{3798}\\\\\n\n\\frac{59}{211} &= \\frac{1}{6}
    + \\frac{1}{9} + \\frac{1}{633} + \\frac{1}{3798}\\\\\n\n\\end{aligned}\n\n$$\n\n由于方法一与方法二中，最小的分数相同，因此二者均是最优解。\n\n给出
    $a,b$，编程计算最好的表达方式。保证最优解满足：最小的分数 $\\ge \\cfrac{1}{10^7}$。\n\n### 输入格式\n一行两个整数，分别为
    $a$ 和 $b$ 的值。\n\n### 输出格式\n输出若干个数，自小到大排列，依次是单位分数的分母。\n\n### 提示与数据范围\n$0 \\lt a
    \\lt b \\lt 1000$"
