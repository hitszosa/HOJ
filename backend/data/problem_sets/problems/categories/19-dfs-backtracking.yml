  provenance: 东方博宜OJ
  statement: "设有一个  N*M  方格的棋盘（   l  ≤   N  ≤  100  ，  1  ≤  M  ≤  100  ）。求出该棋盘中包含有多少个正方形、多少个长方形（不包括正方形）。
    \n例如：当   N=2  ，   M  ＝  3  时：   \n正方形的个数有  8  个：即边长为  1  的正方形有  6  个；边长为  2  的正方形有
    \ 2  个。 \n长方形的个数有  10  个：即  2*1  的长方形有  4  个；  1*2  的长方形有  3  个；  3*1  的长方形有  2
    \ 个；  3*2  的长方形有  1  个。\n\n### 输入格式\nN和M两个整数。\n\n### 输出格式\n正方形的个数与长方形的个数 。"
  samples:
  - input: '2 3

      '
    output: '8 10

      '
