  statement: "Mike同学在为扫地机器人设计一个在矩形区域中行走的算法，Mike是这样设计的：先把机器人放在出发点(1,1)点上，机器人在每个点上都会沿用如下的规则来判断下一个该去的点是哪里。规则：优先向右，如果向右不能走（比如：右侧出了矩形或者右侧扫过了）则尝试向下，向下不能走则尝试向左，向左不能走则尝试向上；直到所有的点都扫过。\n
    \nMike为了验证自己设计的算法是否正确，打算先模拟一下这个算法，每当机器人走过一个单元格时，会在单元格内标记一个数字，这个数字从1开始，每经过一个单元格数字会递增1，直到所有的单元格都扫一遍，也就是所有的单元格都标记过数字，机器人会自动停止。\n
    \n比如：如果机器人按照上面的规则，清扫一个3 * 4大小的矩形区域，那么标记数字的结果如下图所示。\n ![](https://oj.czos.cn/uploads/20211116/50142d947e281a3ef9bef1119f9c6be8.png)\n\t再比如：如果机器人按照上面的规则，清扫一个5
    * 5大小的矩形区域，那么标记数字的结果如下图所示。\n ![](https://oj.czos.cn/uploads/20211116/97844b1567fb5b4572c4bfb3c00510d8.png)\n\t请你帮助Mike设计一个程序，按照上面的规则，将一个n
    * m大小的矩形，标记一下数字，输出最终标记的结果。\n\n### 输入格式\n一行内有2个两个整数n和m，用空格隔开，分别代表矩形区域的行数（高）和列数（宽）（n和m都是2~9之间的整数）\n\n###
    输出格式\n输出按题意机器人走过每个点之后，标记数字的结果，每个数字输出时场宽设置为3。"
