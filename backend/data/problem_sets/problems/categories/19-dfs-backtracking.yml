  provenance: 东方博宜OJ
  statement: "单词接龙是一个与我们经常玩的成语接龙相类似的游戏，现在我们已知一组单词，且给定一个开头的字母，要求出以这个字母开头的最长的 “ 龙 ”
    （每个单词都 最多在 “ 龙 ” 中出现两次），在两个单词相连时，其重合部分合为一部分，例如  beast 和 astonish ，如果接成一条龙则变为 beastonish
    ，另外相邻的两部分不能存在包含关系，例如 at  和  atide  间不能相连。\n\n### 输入格式\n输入的第一行为一个单独的整数 n (n<=20)
    表示单词数，以下 n  行每行有一个单词，输入的最后一行为一个单个字符，表示 “ 龙 ” 开头的字母。\n\n你可以假定以此字母开头的 “ 龙 ” 一定存在
    。\n\n### 输出格式\n只需输出以此字母开头的最长的 “ 龙 ” 的长度    \n\n### 提示与数据范围\n【来源】\n蓝桥杯算法训练\n \n【样例说明】
    \n连成的 “ 龙 ” 为 atoucheatactactouchoose"
