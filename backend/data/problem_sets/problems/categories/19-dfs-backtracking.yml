- slug: 19-dfs-backtracking-p45
  seq: 45
  title: 棋盘方格
  difficulty: L1-入门
  category: 深度优先搜索与状态回溯
  tags:
  - 深度优先搜索与状态回溯
  - noip复赛
  knowledge:
  - noip复赛
  provenance: 东方博宜OJ
  statement: "设有一个 n*m 方格的棋盘（ 1 ≤ m,n ≤ 100 ）。\n求出该棋盘中包含多少个正方形、多少个长方形（不包括正方形）。\n例如：当n=2，m=3时\n![](https://oj.czos.cn/upload/pimg1995_1.jpg)\n正方形的个数有
    8 个，即边长为 1 的正方形有 6 个，边长为2的正方形有2个。\n\n长方形的个数有10个：\n\n2*1的长方形有4个； \n\n1*2的长方形有3个；\n![](https://oj.czos.cn/upload/pimg1995_2.jpg)\n\n3*1的长方形有2个；\n![](https://oj.czos.cn/upload/pimg1995_3.jpg)
    \n\n3*2的长方形有1个。 \n![](https://oj.czos.cn/upload/pimg1995_4.jpg)\n\n### 输入格式\n每个测试文件只包含一组测试数据，每组输入两个正整数n和m。\n\n###
    输出格式\n对于每组输入数据， 出该棋盘中包含的正方形个数和长方形个数。  \n \n \n\t  \n  \n \n\n### 提示与数据范围\n【来源】1997年NOIP全国联赛普及组"
  samples:
  - input: '2 3

      '
    output: '8 10

      '
  tests:
  - input: '10 10


      '
    output: '385 2640

      '
  - input: '50 50


      '
    output: '42925 1582700

      '
  - input: '20 30


      '
    output: '4970 92680

      '
  - input: '1 1


      '
    output: '1 0

      '
  - input: '2 2


      '
    output: '5 4

      '
- slug: 19-dfs-backtracking-p46-dfs
  seq: 46
  title: 图的dfs遍历
  difficulty: L1-入门
  category: 深度优先搜索与状态回溯
  tags:
  - 深度优先搜索与状态回溯
  - 图论
  - 图的遍历
  knowledge:
  - 图论
  - 图的遍历
  provenance: 东方博宜OJ
  statement: "一个有n个结点的无向连通图，这些结点以编号：1、2、……n进行编号，现给出结点间的连接关系。请以结点1为起点，按dfs（深度优先搜索）、优先访问小编号结点的顺序遍历并输出该图。\n\n###
    输入格式\n第一行为两整数，n和e，表示n个顶点，e条边。（2<=n,e<=10） \n以下e行每行两个数，表示两个结点是联通的。\n\n### 输出格式\n只有一行，为按照优先访问小编号结点的dfs的结果。"
  samples:
  - input: '5 7

      1 2

      1 3

      1 4

      2 4

      2 5

      3 5

      4 5

      '
    output: '1 2 4 5 3

      '
  tests:
