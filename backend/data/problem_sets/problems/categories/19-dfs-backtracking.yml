      6:1,1->2,1->3,1->3,2->4,2->4,3->5,3->6,3->6,4->6,5

      7:1,1->2,1->3,1->3,2->4,2->5,2->5,3->5,4->6,4->6,5

      8:1,1->2,1->3,1->3,2->4,2->5,2->5,3->6,3->6,4->6,5

      '
