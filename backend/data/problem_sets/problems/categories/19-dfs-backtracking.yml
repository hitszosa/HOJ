  statement: "给出n组4个整数，请问有多少组整数，在不改变顺序，且不加入括号的情况下，可以通过+ - *三种运算，得到24。\n \n比如1 2 3
    4四个数，可以通过如下的方法得到24：1*2*3*4=24。\n \n而20 30 40 50四个数，在不改变顺序、不添加括号的情况下，通过+ - *三种运算是无法获得24的。&nbsp;&nbsp;\n\n###
    输入格式\n第1行有一个整数n；（2<=n<=100）\n接下来n行，每行有4个整数ai（1<=ai<=100）\n\n### 输出格式\n输出一个整数，代表有几组数能够通过题目的规则计算得到24。"
  samples:
  - input: "4\n1 2 3 4 \n10 20 30 40\n50 60 70 80\n9 1 8 2\n"
