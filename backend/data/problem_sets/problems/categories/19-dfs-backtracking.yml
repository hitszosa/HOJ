  statement: '设有一个n*m方格的棋盘(1<= n< = 100,l< = m<=100)。求出该棋盘中包含有多少个正方形、多少个长方形（不包括正方形）。


    例如：当n=2, m=3时：


    正方形的个数有8个：即边长为1的正方形有6个;边长为2的正方形有2个。


    长方形的个数有10个：即2 * 1的长方形有4个;1 * 2的长方形有3个；3 * 1的长方形 有2个;3 * 2的长方形有1个。


    ### 输入格式

    棋盘长宽：n,m。


    ### 输出格式

    正方形的个数与长方形的个数。'
