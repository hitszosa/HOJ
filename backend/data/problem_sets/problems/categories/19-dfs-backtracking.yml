  statement: '马在中国象棋以日字形规则移动，给定n*m大小的棋盘，以及马的初始位置(x，y)和目标位置（s，t），要求不能重复经过棋盘上的同一个点，计算马至少走多少步可以到达目标位置，所有棋盘保证从初始位置到结束位置一定有路径可达。


    ### 输入格式

    测试数据包含一行，为六个整数，分别为棋盘的大小以及初始位置坐标nmxyst。（1≤x，s≤n≤5，1≤y，t≤m≤5）


    ### 输出格式

    包含一行，为一个整数，表示马能到达目标位置的最小步数。'
