  statement: '**原题来自：[ZOJ 1937](https://zoj.pintia.cn/problem-sets/91827364500/problems/91827365436)**


    已知一个数列 $a_0,a_1...a_m$（其中 $a_0 = 1 , a_m = n , a_0 \lt a_1 \lt a_2 \lt ... \lt
    a_{m-1} \lt a_m$）。对于每个 $k$，需要满足 $a_k=a_i+a_j$（$0 \leq i , j \leq k-1$，这里 $i$ 与
    $j$ 可以相等）。


    现给定 $n$ 的值，要求 $m$ 的最小值（并不要求输出），及这个数列每一项的值（可能存在多个数列，只输出任一个满足条件的就可以了）。


    ### 输入格式

    多组数据，每行给定一个正整数 $n$ 。


    输入以 $0$ 结束。


    ### 输出格式

    对于每组数据，输出满足条件的长度最小的数列。


    ### 提示与数据范围

    $1 \leq n \leq 100,1 \leq k \leq m$'
