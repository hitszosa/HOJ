      26 26\r\n"
    output: "70\r\n"
  - input: "23\r\n24 29 2 46 50 15 16 49 26 8 2 28 48 18 1 30 38 14 14 44 14 31 16\r\n"
    output: "563\r\n"
  - input: "8\r\n46 15 23 34 49 33 16 50\r\n"
    output: "133\r\n"
