- slug: 19-dfs-backtracking-p17-1-4-3
  seq: 17
  title: 「一本通 1.4 练习 3」移动玩具
  difficulty: L4-提高
  category: 深度优先搜索与状态回溯
  tags:
  - 深度优先搜索与状态回溯
  - 搜索
  - HAOI
  - hash 表
  knowledge:
  - 搜索
  - HAOI
  - hash 表
  provenance: 一本通提高篇
  statement: "**原题来自：HAOI 2008**\n\n在一个 $4\\times 4$ 的方框内摆放了若干个相同的玩具，某人想将这些玩具重新摆放成为他心中理想的状态，规定移动时只能将玩具向上下左右四个方向移动，并且移动的位置不能有玩具，请你用最少的移动次数将初始的玩具状态移动到目标状态。\n\n###
    输入格式\n前四行表示玩具的初始状态，每行 $4$ 个数字 $1$ 或 $0$，$1$ 表示方格中放置了玩具，$0$ 表示没有放置玩具。  \n\n接着是一个空行。
    \ \n\n接下来四行表示玩具的目标状态，每行 $4$ 个数字 $1$ 或 $0$，意义同上。\n\n### 输出格式\n一个整数，所需要的最少移动次数。"
  samples:
  - input: '1111

      0000

      1110

      0010


      1010

      0101

      1010

      0101

      '
    output: '4

      '
  tests:
  - input: "0000\r\n0001\r\n0100\r\n0001\r\n\r\n1000\r\n0000\r\n0011\r\n0000\n"
    output: "6\r\n"
  - input: "0011\r\n1100\r\n0011\r\n1100\r\n\r\n1111\r\n1001\r\n1001\r\n0000\r\n"
    output: "8\r\n"
  - input: "1000\r\n1000\r\n1000\r\n1011\r\n\r\n1000\r\n1000\r\n1000\r\n1011\r\n\r\n"
    output: "0\r\n"
  - input: "1111\r\n1111\r\n1101\r\n1111\r\n\r\n0111\r\n1111\r\n1111\r\n1111\r\n"
    output: "4\r\n"
  - input: "0101\r\n1010\r\n0000\r\n0001\r\n\r\n0000\r\n0000\r\n0001\r\n1111\r\n"
    output: "9\r\n"
- slug: 19-dfs-backtracking-p18-2-4-5
  seq: 18
  title: 「一本通 2.4 练习 5」病毒
  difficulty: L4-提高
  category: 深度优先搜索与状态回溯
  tags:
  - 深度优先搜索与状态回溯
  - AC 自动机
  - 搜索
  - POI
  knowledge:
  - AC 自动机
  - 搜索
  - POI
  provenance: 一本通提高篇
  statement: '**原题来自：POI 2000**


    二进制病毒审查委员会最近发现了如下的规律：某些确定的二进制串是病毒的代码。如果某段代码中不存在任何一段病毒代码，那么我们就称这段代码是安全的。现在委员会已经找出了所有的病毒代码段，试问，是否存在一个无限长的安全的二进制代码。


    示例：例如如果 $\{011, 11, 00000\}$ 为病毒代码段，那么一个可能的无限长安全代码就是 $010101\cdots $。如果 $\{01,
    11, 000000\}$ 为病毒代码段，那么就不存在一个无限长的安全代码。


    请写一个程序，读入病毒代码，判断是否存在一个无限长的安全代码，将结果输出。


    ### 输入格式

    第一行包括一个整数 $n$，表示病毒代码段的数目；


    以下的 $n$ 行，每一行都包括一个非空的 $01$ 字符串——就是一个病毒代码段。


    ### 输出格式

    第一行输出一个单词。假如存在这样的代码，则输出 `TAK`，否则输出 `NIE`。


    ### 提示与数据范围

    对于全部数据，所有病毒代码段的总长度不超过 $3\times 10^4$。'
