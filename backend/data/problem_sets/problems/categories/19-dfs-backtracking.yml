  statement: "一个迷宫由R行C列格子组成，有的格子里有障碍物，不能走；有的格子是空地，可以走。  给定一个迷宫，求从左上角走到右下角最少需要走多少步(数据保证一定能走到)。只能在水平方向或垂直方向走，不能斜着走。\n\n###
    输入格式\n第一行是两个整数，Ｒ和Ｃ，代表迷宫的长和宽。（ 1≤ R，C ≤ 40) \n 接下来是Ｒ行，每行Ｃ个字符，代表整个迷宫。  \n空地格子用‘.’表示，有障碍物的格子用‘#’表示。
    \ \n迷宫左上角和右下角都是‘.’。\n\n### 输出格式\n输出从左上角走到右下角至少要经过多少步（即至少要经过多少个空地格子）。计算步数要包括起点和终点。"
