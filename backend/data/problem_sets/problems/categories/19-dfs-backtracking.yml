- slug: 19-dfs-backtracking-p58
  seq: 58
  title: 速算游戏
  difficulty: L3-普及
  category: 深度优先搜索与状态回溯
  tags:
  - 深度优先搜索与状态回溯
  - DFS
  knowledge:
  - DFS
  provenance: 洛谷精选题库
  statement: '“算24点”的游戏规则如下：每局游戏随机抽出4张牌，每张牌的点数代表相应数字（其中A表示1，J代表11，Q代表12，K代表13，无Joker）。


    而游戏者必须通过+、-、*、/ 四种运算和括号（除法必须能够除尽，例如6/3是允许的）合理地安排运算的顺序，最终得出24，如（7+5）（7-5）=24，2K-6/3=24等。


    有一次，小明和小强算24点，结果小明每一次都输，他感到很郁闷，于是新加了一条规则：除了+、-、*、/ 四种运算以外，还允许使用位运算（&、|、和^）。但是加了这个规则以后，小明还是每次都输。请写一个程序，在新的规则下帮小明在1s内算出24点的答案。


    ### 输入格式

    <span style="color: rgb(51, 51, 51);">1行4个字符，用1个空格分开，分别为4张牌的点数，其中，A、T、J、Q、K分别表示1、10、11、12和13。输入数据保证有解。</span>


    ### 输出格式

    <span style="color: rgb(51, 51, 51);">输出一行，表示24点的解法。输出时请用圆括号补齐每一步的运算。例如，3+4+5表示为（（3+4）+5），3*（4+5）表示为（3*（4+5））。如果有多组解，输出所有解中字典顺序最小的一个。</span>'
  samples:
  - input: 'T J Q K

      '
    output: '（（（J*T）&K）+Q）

      '
  tests:
  - input: '3 8 3 8

      '
    output: '(((9+K)&T)*Q)

      '
  - input: '9 T Q K

      '
    output: '(((5&A)+2)*8)

      '
  - input: 'A 2 5 8

      '
    output: '(((2*7)-8)*4)

      '
  - input: '4 7 2 8

      '
    output: '(((2*9)&T)*Q)

      '
  - input: '9 Q 2 T

      '
    output: '(((Q&Q)&Q)+Q)

      '
- slug: 19-dfs-backtracking-p59
  seq: 59
  title: 相遇问题
  difficulty: L3-普及
  category: 深度优先搜索与状态回溯
  tags:
  - 深度优先搜索与状态回溯
  - DFS
  knowledge:
  - DFS
  provenance: 洛谷精选题库
  statement: '贝丽斯和她的姐姐艾丽斯想从谷仓走到她们最喜爱的牧场。她们在同一时间离开谷仓，也在同一时间到达最喜爱的牧场。


    整个农场是一个有N个牧场，1号牧场就是谷仓，N号牧场是她们最喜爱的牧场。整个农场是建在一个山坡上的，如果X＜Y，则代表X号牧场比Y号牧场要高。有M条路径连接一堆牧场。然而，由于每条路径都很陡，每条路只能向下山的方向走。比如。一条连接5号和8号农场的路只能从5走到8而不能反过来，因为那样就是向山上走了。每队牧场之间最多有一条路径，故M≤N（N-1）/2。


    贝丽斯和艾丽斯可能需要不同的时间来走过一条路径。例如，贝丽斯可能花10个单位的  时间，而艾丽斯会花20个单位，而且她们只在路径上花时间，在牧场上是不花时间的。


    请帮助决定贝丽斯和艾丽斯至少要花多少时间，使她们能同时到达她们最喜爱的农场。


    ### 输入格式

    第1行是N和M，用一个空格分开。


    接下来我的M行，每行有4个整数A、B、C、D，表示A牧场和B牧场是被连接，C是贝丽斯经过这条路要花的时间，D是艾丽斯经过这条路要花的时间。C和D的范围是1~1000。


    ### 输出格式

    <span style="color: rgb(51, 51, 51);">一行一个整数，表示贝丽斯和艾丽斯至少要花多少时间使她们能同时到达她们最喜爱的农场。如果这是不可能的，或者根本就没有路径使她们能到达她们最喜爱的农场，在一行输出“IMPOSSIBLE”。</span>


    ### 提示与数据范围

    对于20%的数据满足：$N≤5$。


    对于60%的数据满足：$M≤90$。


    对于100%的数据满足：$1≤N≤16，M≤N（N-1）/2$。'
