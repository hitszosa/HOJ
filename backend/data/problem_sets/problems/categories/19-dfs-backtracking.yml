  statement: '二值图像是由黑白两种像素组成的矩阵点阵，图像识别的一个基本操作是求出图像中最大黑区域的面积。请设计一个程序完成二值图像的这个操作。黑区域有黑像素组成，一个黑区域中的每像素至少与该区域中的另一个像素相邻，规定一个像素与其上下左右的像素相邻，两个不同的黑区域没有相邻的像素。一个黑区域的面积是其所包含的像素。


    ### 输入格式

    第一行含两个正整数n和m，1<=n、m<=100，分别表示二值图像的行数与列数，后面紧跟着n行，每行含m个整数1或0，其中第i行表示图像的第i行的m个像素，0表示白像素，1表示黑像素。


    ### 输出格式

    输出一个数表示图像中最大黑区域的面积。'
