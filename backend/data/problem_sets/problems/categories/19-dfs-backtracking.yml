  statement: "**原题来自：[POJ 1915](http://poj.org/problem?id=1915)**\n\n编写一个程序，计算一个骑士从棋盘上的一个格子到另一个格子所需的最小步数。骑士一步可以移动到的位置由下图给出。\n\n![Picture
    1](http://miao.su/images/2018/07/04/aaaca493.png)\n\n### 输入格式\n第一行给出骑士的数量 $n$。
    \ \n\n在接下来的 $3n$ 行中，每 $3$ 行描述了一个骑士。其中，\n\n* 第一行一个整数 $L$ 表示棋盘的大小，整个棋盘大小为 $L\\times
    L$；\n\n* 第二行和第三行分别包含一对整数 $(x,y)$，表示骑士的起始点和终点。假设对于每一个骑士，起始点和终点均合理。\n\n### 输出格式\n对每一个骑士，输出一行一个整数表示需要移动的最小步数。如果起始点和终点相同，则输出
    $0$。\n\n### 提示与数据范围\n对于 $100\\%$ 的数据，有 $4\\le L\\le 300$，保证 $0\\le x,y\\le L-1$。"
