- slug: 19-dfs-backtracking-p27
  seq: 27
  title: 棋盘里的麦子？
  difficulty: L1-入门
  category: 深度优先搜索与状态回溯
  tags:
  - 深度优先搜索与状态回溯
  - 高精度算法
  knowledge:
  - 高精度算法
  provenance: 东方博宜OJ
  statement: "传说西塔发明了国际象棋而使国王十分高兴，他决定要重赏西塔，西塔说：“我不要你的重赏 ，陛下，只要你在我的棋盘上赏一些麦子就行了。在棋盘的第1个格子里放1粒，在第2个格子里放2粒，在第3个格子里放4粒，在第4个格子里放8粒，依此类推，以后每一个格子里放的麦粒数都是前一个格子里放的麦粒数的2倍，直到放满第64个格子就行了”。“区区小数，几粒麦子，这有何难，来人”，国王令人如数付给西塔。
    \n计数麦粒的工作开始了，第一格内放1粒，第二格内放2粒第三格内放4粒，…还没有到第二十格，一袋麦子已经空了。一袋又一袋的麦子被扛到国王面前来。但是，麦粒数一格接一格飞快增长着，国王很快就看出，即便拿出全国的粮食，也兑现不了他对西塔的诺言。
    \n请你编程帮助国王计算出，第n个棋盘格子中需要放多少粒麦子？\n\n### 输入格式\n一个整数N代表第n格棋盘（n<=100）\n\n### 输出格式\n一个整数，代表第n格棋盘中麦子的总数。"
  samples:
  - input: '3

      '
    output: '4

      '
  tests:
  - input: '88

      '
    output: '154742504910672534362390528

      '
  - input: '100

      '
    output: '633825300114114700748351602688

      '
  - input: '30

      '
    output: '536870912

      '
- slug: 19-dfs-backtracking-p28
  seq: 28
  title: 迷宫的路径
  difficulty: L1-入门
  category: 深度优先搜索与状态回溯
  tags:
  - 深度优先搜索与状态回溯
  - 回溯
  - 深搜
  - 递归
  knowledge:
  - 回溯
  - 深搜
  - 递归
  provenance: 东方博宜OJ
  statement: 'Mitch老鼠在森林里游玩，不小心走进了一个迷宫里面，这个迷宫是一个 nn 行 mm 列的矩阵，迷宫中有些格子是可以走的，有些格子是不能走的，能走的格子用
    o （小写字母 o ）表示，不能走的格子用 # 表示。


    Mitch选择走出迷宫的策略是：先向右，如果右边走不通则选择向下，如果下边走不通则选择向左，如果左边走不通则选择向上；如果四个方向都走不通，则后退选择其他能走的路径。


    Mitch从类似下图所示的迷宫的左上角 (1,1)(1,1) 点进入迷宫（请注意：入口 1,11,1 和出口的 n,mn,m 点都不是 # ），请问Mitch有哪些方法可以走出迷宫，走到
    (n,m)(n,m) 点；请编程求出所有可能的路径，输出这些路径，如果不存在任何的路径可以走出迷宫，请输出 no。

    ![](https://oj.czos.cn/uploads/20211116/26bd8aeb99ab71d7bc397194b8a4f048.png)


    ### 输入格式

    第一行包含两个整数n和m，中间用单个空格隔开，代表迷宫的行和列的数量。

    接下来n行，每行m个字符，描述迷宫地图。字符只有“o”或“#”两种，“o”代表这个格子可以走，“#”代表这个格子不能走。(4 <= n,m <= 10 )


    ### 输出格式

    请按照Mitch选择的走出迷宫的策略，输出所有可能的路径，输出形式请参考样例输出的形式。'
  samples:
  - input: '6 5

      ooooo

      o####

      ooooo

      #oo#o

      oooo#

      o#ooo

      '
    output: '1:1,1->2,1->3,1->3,2->3,3->4,3->5,3->5,4->6,4->6,5

