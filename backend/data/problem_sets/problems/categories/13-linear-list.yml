  provenance: 一本通基础篇
  statement: '试编写一个算法，在带表头结点的单链表中寻找一个数。


    若找到，则函数返回该数在列表中的地址(i [1~n])；


    若找不到，则函数返回0。


    ### 输入格式

    <span style="color: rgb(51, 51, 51);">第一行 原始数列；</span>


    第二行 需要找的数


    ### 输出格式

    <span style="color: rgb(51, 51, 51);">找到则输出数在数列中的位置，第一个位置输出1依次类推</span>


    若没有找到输出0


    ### 提示与数据范围

    使用<b>线性表</b>方法


    暂无题解AC程序'
  samples:
  - input: '2 3 4 5 6 7 8 9

      5

      '
    output: '4

      '
  tests:
  - input: '2 3 4 5 6 7 8 9

      5

      '
    output: '4

      '
  - input: '5 7 9 3 5 6 8 1

      8

      '
    output: '7

      '
  - input: '99 97

      99

      '
    output: '1

      '
  - input: '7 6 8 9 3 2 4 6 6 6 6 6 6 6 6

      6

      '
    output: '2

      '
