- slug: 13-linear-list-p05-kkt-406
  seq: 5
  title: KKT基本算法406新约瑟夫游戏
  difficulty: L1-入门
  category: 线性表与链表应用
  tags:
  - 线性表与链表应用
  - 递推
  knowledge:
  - 递推
  provenance: 洛谷精选题库
  statement: '你一定听说过经典“约瑟夫”问题吧？现在来组织一个皆大欢喜的新游戏：假设 n 个人站成一圈，从第 1 人开始交替的去掉游戏者，但只是暂时去掉（例如，首先去掉
    2），直到最后剩下唯一的幸存者为止。幸存者选出后，所有比幸存者号码高的人每人将得到 1 块钱，并且永久性地离开，其余剩下的人将重复以上过程，比幸存者号码高的人每人将得到
    1 块钱后离开。一旦经过这样的过程后，人数不再减少，最后剩下的那些人将得到 2 块钱。请计算一下组织者一共要付出多少钱？


    例如，第一轮有 5 人，幸存者是 3，所以 4、5 得到 1 块钱后离开，下一轮幸存者仍然是 3，因此没有人离开，所以每人得到 2 块钱，总共要付出 2+2*3=8
    块钱。


    ### 输入格式

    一行一个整数 n。


    ### 输出格式

    一行一个整数，不超过65535，表示总共要付出多少钱。


    ### 提示与数据范围

    数据范围：n < 32767。'
  samples:
  - input: '10

      '
    output: '13

      '
  tests:
  - input: '7

      '
    output: '14

      '
  - input: '95

      '
    output: '158

      '
  - input: '2713

      '
    output: '2776

      '
  - input: '5732

      '
    output: '5795

      '
