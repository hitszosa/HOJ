  title: 「一本通 1.4 练习 1」棋盘游戏
  knowledge:
  - 搜索
  difficulty: hard
  statement: "在一个 $4\\times 4$ 的棋盘上有 $8$ 个黑棋和 $8$ 个白棋，当且仅当两个格子有公共边，这两个格子上的棋是相邻的。移动棋子的规则是交换相邻两个棋子。\
    \  \n\n给出一个初始棋盘和一个最终棋盘，请找出一个最短的移动序列使初始棋盘变为最终棋盘。\n\n### 输入格式\n前四行，每行 $4$ 个数字（$1$\
    \ 或者 $0$），描述了初始棋盘；  \n\n接着是一个空行；  \n\n第六到第九行，每行 $4$ 个数字（$1$ 或者 $0$），描述了最终棋盘。\n\
    \n### 输出格式\n输出文件的第一行是一个整数 $n$，表示最少的移动步数。"
