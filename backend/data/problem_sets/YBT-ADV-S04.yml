- slug: ybt-adv-s04-p07-1-3-1
  seq: 7
  title: 「一本通 1.3 练习 1」埃及分数
  knowledge:
  - 数论
  - 搜索
  - 剪枝优化
  difficulty: hard
  statement: "**来源：BIO 1997 Round 1 [Question 3](http://www.olympiad.org.uk/papers/1997/bio/bio97r1q3.html)**\n\
    \n在古埃及，人们使用单位分数的和（形如 $\\dfrac{1}{a}$ 的，$a$ 是自然数）表示一切有理数。如：$\\dfrac{2}{3} = \\\
    dfrac{1}{2} + \\dfrac{1}{6}$，但不允许 $\\dfrac{2}{3} = \\dfrac{1}{3} + \\dfrac{1}{3}$，因为加数中有相同的。对于一个分数\
    \ $\\dfrac{a}{b}$，表示方法有很多种，但是哪种最好呢？首先，加数少的比加数多的好，其次，加数个数相同的，最小的分数越大越好。如：\n\n$$\n\
    \n\\begin{aligned}\n\n\\frac{19}{45} &= \\frac{1}{3} + \\frac{1}{12} + \\frac{1}{180}\\\
    \\\n\n\\frac{19}{45} &= \\frac{1}{3} + \\frac{1}{15} + \\frac{1}{45}\\\\\n\n\\\
    frac{19}{45} &= \\frac{1}{3} + \\frac{1}{18} + \\frac{1}{30}\\\\\n\n\\frac{19}{45}\
    \ &= \\frac{1}{4} + \\frac{1}{6} + \\frac{1}{180}\\\\\n\n\\frac{19}{45} &= \\\
    frac{1}{5} + \\frac{1}{6} + \\frac{1}{18}\\\\\n\n\\end{aligned}\n\n$$\n\n最好的是最后一种，因为\
    \ $\\dfrac{1}{18}$ 比 $\\dfrac{1}{180}, \\dfrac{1}{45}, \\dfrac{1}{30}, \\dfrac{1}{18}$\
    \ 都大。  \n\n注意，可能有多个最优解。如：\n\n$$\n\n\\begin{aligned}\n\n\\frac{59}{211} &= \\frac{1}{4}\
    \ + \\frac{1}{36} + \\frac{1}{633} + \\frac{1}{3798}\\\\\n\n\\frac{59}{211} &=\
    \ \\frac{1}{6} + \\frac{1}{9} + \\frac{1}{633} + \\frac{1}{3798}\\\\\n\n\\end{aligned}\n\
    \n$$\n\n由于方法一与方法二中，最小的分数相同，因此二者均是最优解。\n\n给出 $a,b$，编程计算最好的表达方式。保证最优解满足：最小的分数 $\\\
    ge \\cfrac{1}{10^7}$。\n\n### 输入格式\n一行两个整数，分别为 $a$ 和 $b$ 的值。\n\n### 输出格式\n输出若干个数，自小到大排列，依次是单位分数的分母。\n\
    \n### 提示与数据范围\n$0 \\lt a \\lt b \\lt 1000$"
  samples:
  - input: '19 45

      '
    output: '5 6 18

      '
  tests:
  - input: "19 45\r\n"
    output: "5 6 18\r\n"
  - input: "27 441\r\n"
    output: "28 49 196\r\n"
  - input: "4 109\r\n"
    output: "30 545 654\r\n"
  - input: "59 211\r\n"
    output: "4 36 633 3798\r\n"
  - input: "101 103\r\n"
    output: "2 3 7 238 5253\r\n"
- slug: ybt-adv-s04-p08-1-3-2
  seq: 8
  title: 「一本通 1.3 练习 2」平板涂色
  knowledge:
  - 搜索
  - 拓扑排序
  difficulty: hard
  statement: "**原题来自：[ICPC Tehran 1999](http://poj.org/problem?id=1691)**\n\nCE 数码公司开发了一种名为自动涂色机（APM）的产品。它能用预定的颜色给一块由不同尺寸且互不覆盖的矩形构成的平板涂色。\n\
    \n![](https://i.loli.net/2018/07/04/5b3cac95b9b71.png)\n\n为了涂色，APM 需要使用一组刷子。每个刷子蘸了颜色\
    \ $C$ 。APM 拿起一把蘸有颜色 $C$ 的刷子，并给所有颜色为 $C$ 的矩形涂色。请注意，涂色有顺序要求：为了避免颜料渗漏使颜色混合，一个矩形只能在所有紧靠它上方的矩形涂色后，才能涂色。例如图中矩形\
    \ $F$ 必须在 $C$ 和 $D$ 涂色后才能涂色。注意，每一个矩形必须立刻涂满，不能只涂一部分。\n\n写一个程序求一个使 APM 拿起刷子次数最少的涂色方案。注意，如果一把刷子被拿起超过一次，则每一次都必须记入总数中。\n\
    \n### 输入格式\n第一行为矩形的个数 $N$ 。  \n\n下面有 $N$ 行描述了 $N$ 个矩形。每个矩形有 $5$ 个整数描述，左上角的 $y$\
    \ 坐标和 $x$ 坐标，右下角的 $y$ 坐标和 $x$ 坐标，以及预定颜色。\n\n### 输出格式\n一行一个整数，表示拿起刷子的最少次数。\n\n\
    ### 提示与数据范围\n对于全部数据，$1 \\leq N \\leq 14$，颜色号为 $1$ 到 $20$ 的整数。保证平板的左上角坐标总是 $(0,\
    \ 0)$，坐标的范围是 $0$ 到 $9$ 。"
  samples:
  - input: '7

      0 0 2 2 1

      0 2 1 6 2

      2 0 4 2 1

      1 2 4 4 2

      1 4 3 6 1

      4 0 6 4 1

      3 4 6 6 2

      '
    output: '3

      '
  tests:
  - input: "7\r\n0 0 2 2 1\r\n0 2 1 6 2\r\n2 0 4 2 1\r\n1 2 4 4 2\r\n1 4 3 6 1\r\n\
      4 0 6 4 1\r\n3 4 6 6 2\n"
    output: "3\r\n"
  - input: "14\r\n0 0 3 2 3\r\n0 2 2 4 1\r\n0 4 1 8 4\r\n1 4 2 7 2\r\n1 7 3 8 1\r\n\
      2 2 3 7 4\r\n3 4 7 6 3\r\n3 6 7 8 4\r\n5 0 8 3 3\r\n5 3 6 4 2\r\n8 0 9 3 2\r\
      \n6 3 9 4 1\r\n7 4 9 8 2\r\n3 0 5 4 4\n"
    output: "8\r\n"
  - input: "4\r\n0 0 3 1 1\r\n0 1 2 5 2\r\n0 5 3 6 1\r\n2 1 3 5 1\n"
    output: "2\r\n"
  - input: "13\r\n0 0 3 3 1\r\n0 3 2 4 2\r\n0 4 2 5 1\r\n2 3 5 4 1\r\n2 4 3 5 3\r\n\
      3 4 6 5 2\r\n3 2 4 3 1\r\n3 0 4 2 2\r\n4 0 8 1 3\r\n4 1 5 3 2\r\n5 1 6 4 3\r\
      \n6 1 8 3 1\r\n6 3 8 5 1\n"
    output: "6\r\n"
  - input: "13\r\n0 0 3 3 1\r\n0 3 2 4 2\r\n0 4 2 5 1\r\n2 3 5 4 1\r\n2 4 3 5 2\r\n\
      3 4 6 5 2\r\n3 2 4 3 1\r\n3 0 4 2 2\r\n4 0 8 1 3\r\n4 1 5 3 2\r\n5 1 6 4 3\r\
      \n6 1 8 3 1\r\n6 3 8 5 1\n"
    output: "5\r\n"
