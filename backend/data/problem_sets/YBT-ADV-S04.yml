- slug: ybt-adv-s04-p03-1-3-2
  seq: 3
  title: 「一本通 1.3 例 2」生日蛋糕
  knowledge:
  - 搜索
  - 剪枝优化
  difficulty: hard
  statement: "Mr.W 要制作一个体积为 $N\\pi$ 的 $M$ 层生日蛋糕，每层都是一个圆柱体。\n\n设从下往上数第 $i$ 蛋糕是半径为 $R_i$，高度为\
    \ $H_i$ 的圆柱。当 $i<M$ 时，要求  $R_i>R_{i+1}$ 且 $H_i >H_{i+1}$。由于要在蛋糕上抹奶油，为尽可能节约经费，我们希望蛋糕外表面（最下一层的下底面除外）的面积\
    \ $Q$ 最小。\n\n令 $Q =Sπ$ ，请编程对给出的 $N$ 和 $M$ ，找出蛋糕的制作方案（适当的 $R_i$ 和 $H_i$ 的值），使 $S$\
    \ 最小。（除 $Q$ 外，以上所有数据皆为正整数） \n\n![birthdaycake.png](https://img.loj.ac.cn/2020/10/17/5f8aab1bb4312.png)\n\
    \n### 输入格式\n第一行为 $N$ ，表示待制作的蛋糕的体积为 $N\\pi$；\n\n第二行为 $M$ ，表示蛋糕的层数为 $M$ 。\n\n###\
    \ 输出格式\n输出仅一行，一个整数 $S$（若无解则 $S=0$ ）。\n\n### 提示与数据范围\n对于全部数据，$1 \\leq N \\leq 10^4,1\
    \ \\leq M \\leq 20$。"
  samples:
  - input: '100

      2

      '
    output: '68

      '
  tests:
  - input: "10000\r\n1\n"
    output: "1400\r\n"
  - input: "9876\r\n6\n"
    output: "1448\r\n"
  - input: "1000\r\n3\n"
    output: "316\r\n"
  - input: "4999\r\n8\n"
    output: "1015\r\n"
  - input: "9397\r\n10\n"
    output: "1618\r\n"
- slug: ybt-adv-s04-p04-1-3-3
  seq: 4
  title: 「一本通 1.3 例 3」小木棍
  knowledge:
  - 搜索
  - 剪枝优化
  - 早于 2010
  difficulty: hard
  statement: '**原题来自：CERC 1995**


    乔治有一些同样长的小木棍，他把这些木棍随意砍成几段，直到每段的长都不超过 $50$ 。现在，他想把小木棍拼接成原来的样子，但是却忘记了自己开始时有多少根木棍和它们的长度。给出每段小木棍的长度，编程帮他找出原始木棍的最小可能长度。


    ### 输入格式

    第一行为一个单独的整数 $N$ 表示砍过以后的小木棍的总数。


    第二行为 $N$ 个用空格隔开的正整数，表示 $N$ 根小木棍的长度。


    ### 输出格式

    输出仅一行，表示要求的原始木棍的最小可能长度。


    ### 提示与数据范围

    $1 \leq N \leq 60$'
  samples:
  - input: '9

      5 2 1 5 2 1 5 2 1

      '
    output: '6

      '
  tests:
  - input: "4\r\n2 44 12 35\r\n"
    output: "93\r\n"
  - input: "2\r\n31 45\r\n"
    output: "76\r\n"
  - input: "24\r\n26 43 23 20 19 6 34 25 21 22 48 47 38 28 27 3 25 13 36 27 15 32\
      \ 26 26\r\n"
    output: "70\r\n"
  - input: "23\r\n24 29 2 46 50 15 16 49 26 8 2 28 48 18 1 30 38 14 14 44 14 31 16\r\
      \n"
    output: "563\r\n"
  - input: "8\r\n46 15 23 34 49 33 16 50\r\n"
    output: "133\r\n"
- slug: ybt-adv-s04-p05-1-3-4-addition-chain
  seq: 5
  title: 「一本通 1.3 例 4」Addition Chains
  knowledge:
  - 搜索
  - 剪枝优化
  difficulty: hard
  statement: '**原题来自：[ZOJ 1937](https://zoj.pintia.cn/problem-sets/91827364500/problems/91827365436)**


    已知一个数列 $a_0,a_1...a_m$（其中 $a_0 = 1 , a_m = n , a_0 \lt a_1 \lt a_2 \lt ... \lt
    a_{m-1} \lt a_m$）。对于每个 $k$，需要满足 $a_k=a_i+a_j$（$0 \leq i , j \leq k-1$，这里 $i$ 与
    $j$ 可以相等）。


    现给定 $n$ 的值，要求 $m$ 的最小值（并不要求输出），及这个数列每一项的值（可能存在多个数列，只输出任一个满足条件的就可以了）。


    ### 输入格式

    多组数据，每行给定一个正整数 $n$ 。


    输入以 $0$ 结束。


    ### 输出格式

    对于每组数据，输出满足条件的长度最小的数列。


    ### 提示与数据范围

    $1 \leq n \leq 100,1 \leq k \leq m$'
