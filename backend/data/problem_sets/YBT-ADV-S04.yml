  difficulty: hard
  statement: "**原题来自：USACO 4.3.2**\n\n质数方阵是一个 $5\\times 5$ 的方阵，每行、每列、两条对角线上的数字可以看作是五位的素数。方格中的行按照从左到右的顺序组成一个素数，而列按照从上到下的顺序。两条对角线也是按照从左到右的顺序来组成。这些素数每一位上的数之和必须相等。\
    \ 左上角的数字是预先定好的。 一个素数可能在方阵中重复多次。不计含有前导 $0$ 的五位素数，如 $00003$ 不是五位素数。  \n\n![](https://i.loli.net/2018/07/04/5b3cab8a010c2.png)\n\
    \n给出每一位上的数之和，以及左上角的数字，请输出方阵所有可能的填数方案。  \n\n如果不只有一个解，将它们全部输出（按照这 $25$ 个数字组成的 $25$\
    \ 位数的大小排序）。\n\n### 输入格式\n一行，包括两个被空格分开的整数：每一位上的数之和，以及左上角的数字。\n\n### 输出格式\n对于每一个找到的方案输出\
    \ 5 行，每行 5 个字符，每行可以转化为一个 5 位的质数。在两组方案中间输出一个空行。如果没有解就单独输出一行 `NONE`。"
