- slug: ybt-adv-s04-p10-1-4-2
  seq: 10
  title: 「一本通 1.4 例 2」魔板
  knowledge:
  - 搜索
  - USACO Training
  difficulty: hard
  statement: "**原题来自：USACO 3.2.5**\n\nRubik 先生在发明了风靡全球魔方之后，又发明了它的二维版本——魔板。这是一张有 $8$\
    \ 个大小相同的格子的魔板：\n\n```plain\n\n1 2 3 4\n\n8 7 6 5\n\n```\n\n我们知道魔板的每一个方格都有一种颜色。这\
    \ $8$ 种颜色用前 $8$ 个正整数来表示。可以用颜色的序列来表示一种魔板状态，规定从魔板的左上角开始，沿顺时针方向依次取出整数，构成一个颜色序列。对于上图的魔板状态，我们用序列\
    \ $1,2,3,4,5,6,7,8$ 来表示。这是基本状态。\n\n这里提供三种基本操作，分别用大写字母 `A`，`B`，`C` 来表示（可以通过这些操作改变魔板的状态）：\n\
    \n- `A`：交换上下两行；\n\n- `B`：将最右边的一列插入最左边；\n\n- `C`：魔板中央作顺时针旋转。\n\n下面是对基本状态进行操作的示范：\n\
    \n`A`：\n\n```plain\n\n8 7 6 5\n\n1 2 3 4\n\n```\n\n`B`：\n\n```plain\n\n4 1 2 3\n\
    \n5 8 7 6\n\n```\n\n`C`：\n\n```plain\n\n1 7 2 4\n\n8 6 3 5\n\n```\n\n 对于每种可能的状态，这三种基本操作都可以使用。\n\
    \n 你要编程计算用最少的基本操作完成基本状态到特殊状态的转换，输出基本操作序列。\n\n### 输入格式\n输入仅一行，包括 $8$ 个整数，用空格分开，表示目标状态。\n\
    \n### 输出格式\n输出文件的第一行包括一个整数，表示最短操作序列的长度。 第二行为在字典序中最早出现的操作序列。\n\n### 提示与数据范围\n输入数据中的所有数字均为\
    \ $1$ 到 $8$ 之间的整数。"
  samples:
  - input: '2 6 8 4 5 7 3 1

      '
    output: '7

      BCABCCB

      '
  tests:
  - input: '2 6 8 4 5 7 3 1

      '
    output: '7

      BCABCCB

      '
  - input: '1 2 3 4 5 6 7 8

      '
    output: '0


      '
  - input: '6 7 4 1 8 5 2 3

      '
    output: '5

      CCBBB

      '
  - input: '5 1 2 4 3 7 8 6

      '
    output: '8

      ABBBCABB

      '
  - input: '6 1 5 4 3 2 7 8

      '
    output: '14

      ABBBCABBBCBBBC

      '
- slug: ybt-adv-s04-p11-1-4-3-knight-moves
  seq: 11
  title: 「一本通 1.4 例 3」Knight Moves
  knowledge:
  - 搜索
  difficulty: hard
  statement: "**原题来自：[POJ 1915](http://poj.org/problem?id=1915)**\n\n编写一个程序，计算一个骑士从棋盘上的一个格子到另一个格子所需的最小步数。骑士一步可以移动到的位置由下图给出。\n\
    \n![Picture 1](http://miao.su/images/2018/07/04/aaaca493.png)\n\n### 输入格式\n第一行给出骑士的数量\
    \ $n$。  \n\n在接下来的 $3n$ 行中，每 $3$ 行描述了一个骑士。其中，\n\n* 第一行一个整数 $L$ 表示棋盘的大小，整个棋盘大小为\
    \ $L\\times L$；\n\n* 第二行和第三行分别包含一对整数 $(x,y)$，表示骑士的起始点和终点。假设对于每一个骑士，起始点和终点均合理。\n\
    \n### 输出格式\n对每一个骑士，输出一行一个整数表示需要移动的最小步数。如果起始点和终点相同，则输出 $0$。\n\n### 提示与数据范围\n对于\
    \ $100\\%$ 的数据，有 $4\\le L\\le 300$，保证 $0\\le x,y\\le L-1$。"
  samples:
  - input: '3

      8

      0 0

      7 0

      100

      0 0

      30 50

      10

