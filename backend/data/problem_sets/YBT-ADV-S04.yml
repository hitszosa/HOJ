  - 博弈论
  difficulty: hard
  statement: "Alice 和 Bob 两个好朋友又开始玩取石子了。游戏开始时，有 $N$ 堆石子排成一排，然后他们轮流操作（Alice 先手），每次操作时从下面的规则中任选一个：\n\
    \n- 从某堆石子中取走一个；\n\n- 合并任意两堆石子。\n\n不能操作的人输。Alice 想知道，她是否能有必胜策略。\n\n### 输入格式\n第一行输入\
    \ $T$，表示数据组数。\n\n对于每组测试数据，第一行读入 $N$；  \n\n接下来 $N$ 个正整数 $a_1,a_2,\\cdots ,a_n$，表示每堆石子的数量。\n\
    \n### 输出格式\n对于每组测试数据，输出一行。\n\n输出 `YES` 表示 Alice 有必胜策略，输出 `NO` 表示 Alice 没有必胜策略。\n\
    \n### 提示与数据范围\n对于全部数据，$T\\le 100,N\\le 50,a_i\\le 1000$。"
