  seq: 14
  title: 「一本通 2.4 练习 5」病毒
  knowledge:
  - AC 自动机
  - 搜索
  - POI
  difficulty: hard
  statement: '**原题来自：POI 2000**


    二进制病毒审查委员会最近发现了如下的规律：某些确定的二进制串是病毒的代码。如果某段代码中不存在任何一段病毒代码，那么我们就称这段代码是安全的。现在委员会已经找出了所有的病毒代码段，试问，是否存在一个无限长的安全的二进制代码。


    示例：例如如果 $\{011, 11, 00000\}$ 为病毒代码段，那么一个可能的无限长安全代码就是 $010101\cdots $。如果 $\{01,
    11, 000000\}$ 为病毒代码段，那么就不存在一个无限长的安全代码。


    请写一个程序，读入病毒代码，判断是否存在一个无限长的安全代码，将结果输出。


    ### 输入格式

    第一行包括一个整数 $n$，表示病毒代码段的数目；


    以下的 $n$ 行，每一行都包括一个非空的 $01$ 字符串——就是一个病毒代码段。


    ### 输出格式

    第一行输出一个单词。假如存在这样的代码，则输出 `TAK`，否则输出 `NIE`。


    ### 提示与数据范围

    对于全部数据，所有病毒代码段的总长度不超过 $3\times 10^4$。'
