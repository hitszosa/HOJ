  difficulty: easy
  statement: '有一组数，其排列形式如下： 11，19，9，12，5，20，1，18，4，16，6，10，15，2，17，3，14，7，13，8， 且尾部8和头部11首尾相连，构成环形的一组数，编程找出相邻的4个数，其相加之和最大，并给出它们的起始位置。


    ### 输入格式

    第一行有一个整数n( 5 <= n <= 20 )

    第二行有n个数


    ### 输出格式

    第一行有一个数,即最大的和

