      '
- slug: dfby-p03-p33
  seq: 33
  title: 歌唱比赛评分
  knowledge:
  - 数组问题
  difficulty: easy
  statement: "四（1）班要举行一次歌唱比赛，以选拔更好的苗子参加校的歌唱比赛。评分办法如下：设N个评委，打N个分数（0 <= 每个分数 <= 10），去掉一个最高分，去掉一个最低分，剩下的评委的平均分即为该选手的最后得分。但是选手太多了，靠人工计算每个选手的得分太慢太麻烦。你能不能帮帮他们，设计一个程序让计算机来算出选手的最后得分呢？\n\
    \n### 输入格式\n第一行为一个整数N（ 5 <= N <= 10 ）&nbsp;  \n 第二行为N个整数Ai（ 0 <= Ai <= 10 ）\n\n\
    ### 输出格式\n选手的最后得分（保留两位小数）"
  samples:
  - input: '5

      5 6 7 8 9

      '
    output: '7.00

      '
  tests:
  - input: '6

      4 5 6 7 8 9

      '
    output: '6.50

      '
