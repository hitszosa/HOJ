- slug: dfby-p03-p19
  seq: 19
  title: 既生瑜，何生亮！
  knowledge:
  - 数组问题
  - 函数
  difficulty: easy
  statement: '某数的平方是7位数，且这7个数字不相同，如1267^2=1605289。 编写程序，输入x，y（1000≤x≤y≤9999）在x~y的范围内找出所有符合条件的数并打印出来。


    ### 输入格式

    一行，一个整数。


    ### 输出格式

    若干行，每行一个符合条件的数。'
  samples:
  - input: '1000 1025

      '
    output: '1017

      1023

      1024

      '
  tests:
  - input: '1000 1020

      '
    output: '1017

      '
- slug: dfby-p03-p20-n
  seq: 20
  title: 求n个数的最大值和最小值
  knowledge:
  - 数组问题
  difficulty: easy
  statement: '任意输入n个整数，把它们的最大值，最小值求出来.


    ### 输入格式

    输入只有一行，包括一个整数n(1<=n<=20),后面跟着n个数. 每个数的范围在0到32767之间。


    ### 输出格式

    输出只有一行,包括2个整数。'
  samples:
  - input: '5 1 99 3 6 0

      '
    output: '99 0

      '
  tests:
  - input: '2 1 99

      '
    output: '99 1

      '
- slug: dfby-p03-p21
  seq: 21
  title: 查找“支撑数”
  knowledge:
  - 数组问题
  difficulty: easy
  statement: '在已知一组整数中，有这样一种数非常怪，它们不在第一个，也不在最后一个，而且刚好都比左边和右边相邻的数大，你能找到它们吗？


    ### 输入格式

    第一行为整数m，表示输入的整数个数。（ 3<= m <=100 ) 第二行为m个整数。


    ### 输出格式

    若干个支撑数，每行一个。'
  samples:
  - input: '14

      1 3 2 4 1 5 3 9 7 10 8 23 85 43

      '
    output: '3

      4

      5

      9

      10

      85

      '
  tests:
  - input: '6

      1 3 2 4 1 5

      '
    output: '3

      4

      '
- slug: dfby-p03-p22
  seq: 22
  title: 找找谁的身高超过全家的平均身高
  knowledge:
  - 数组问题
  difficulty: easy
  statement: '找找谁的身高超过全家的平均身高。全家n口人，输入输出数据如下： (平均身高保留一位小数)


    ### 输入格式

    第一行有一个整数n( 1 < n < 11 )。第二行是n个整数，用空格隔开。


    ### 输出格式

    第一行为全家的平均身高（保留一位小数）；第二行有若干个数，为超过平均身高的人的身高厘米数。'
  samples:
  - input: '7

      175 160 172 158 178 162 142

      '
    output: 'AVE=163.9

      1:175 3:172 5:178

      '
  tests:
  - input: '3

      160 170 150

      '
    output: 'AVE=160.0

      2:170

      '
- slug: dfby-p03-p23
  seq: 23
  title: 排除异形基因
  knowledge:
  - 数组问题
  difficulty: easy
  statement: '神舟号飞船在完成宇宙探险任务回到地球后，宇航员张三感觉身体不太舒服，去了医院检查，医生诊断结果：张三体内基因已被改变，原有人体基因序列中已经被渗入外星球不明异形生物基因，但可喜的是，这些异形基因都有一个共同的特征，就是该基因序号的平方除以7的余数都是1，要赶快清除掉，否则会危害整个人类。赶快行动吧。


    ### 输入格式

    第一行是一个整数n（基因个数,3<=n<=200） 第二行是n个整数（张三的基因序列）


    ### 输出格式

    去除异形基因后的正常序列，空格隔开'
  samples:
  - input: '4

      6 2 8 12

      '
    output: '2 12

      '
  tests:
  - input: '3

      6 2 8

      '
    output: '2

      '
- slug: dfby-p03-p24
  seq: 24
  title: 最小数
  knowledge:
  - 数组问题
  difficulty: easy
  statement: '输入n个整数的数列，请找出数列中最小数所在的位置（若有多个最小数，则选最左边的那个最小数），把它与数列的第一个数对调，其他数的位置不动，输出此数列。


    ### 输入格式

    数组数的个数n　（Ｎ＜＝２００） 一行n个数，用空格分开（都＜＝３２７６７）


    ### 输出格式

    第一行：最小数所在的位置（只需要输出最左边的一个的位置） 第二行：交换后的数组（一个空格隔开）'
  samples:
  - input: '3

      2 6 1

      '
    output: '3

      1 6 2

      '
  tests:
  - input: '2

      6 2

      '
    output: '2

      2 6

      '
- slug: dfby-p03-p25
  seq: 25
  title: 输出奇数和偶数
  knowledge:
  - 数组问题
  difficulty: easy
  statement: '输入n个整数，将其中的奇数和偶数分别显示出来（1 < n < 30）


    ### 输入格式

    第一行：一个整数n。第二行：n个空格隔开的整数。


    ### 输出格式

    第一行：若干个奇数。第二行：若干个偶数。（每个数前面都有一个空格）'
  samples:
  - input: '10

      21 12 33 43 59 68 77 18 19 40

      '
    output: '21 33 43 59 77 19

      12 68 18 40

      '
  tests:
  - input: '5

      1 2 3 4 5

      '
    output: '1 3 5

      2 4

      '
- slug: dfby-p03-p26
  seq: 26
  title: 数组元素的移动
  knowledge:
  - 数组问题
  difficulty: easy
  statement: "数组元素的移动，把数组的第x个位置的元素先保存起来，然后把x+1到n的元素，依次往前移一位，最后原来的第x个位置的元素放在最后\n\n\
    ### 输入格式\n有3行  \n 第一行有一个整数n( n <= 10 )  \n 第二行有n个整数  \n 第三行有一个整数x\n\n### 输出格式\n\
    移动后的数组"
