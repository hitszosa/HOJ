- slug: dfby-p03-p16
  seq: 16
  title: 小明的电梯
  knowledge:
  - 数组
  difficulty: easy
  statement: '可怜的小明，他的住的小区只有一个电梯，大家都知道，只要是有人按得号，电梯都会停，每到一站停止5秒，往上走，走一层需要6秒，往下走一层需要4秒，。我们认为每一次电梯的起始点都在第0层。

    对于给出的电梯的层数，你要算出需要的时间。


    ### 输入格式

    输入一个整数N，随后有N个整数，所有的整数都不超过100。


    ### 输出格式

    输出所需要的时间'
  samples:
  - input: '1 2

      '
    output: '17

      '
  tests:
  - input: '8 68 3 52 65 28 55 9 38

      '
    output: '1748

      '
  - input: '6 68 38 43 18 65 31

      '
    output: '1106

      '
  - input: '7 68 3 52 65 28 55 9

      '
    output: '1569

      '
- slug: dfby-p03-p17
  seq: 17
  title: 杰克的小牛
  knowledge:
  - 数组
  difficulty: easy
  statement: '若一头小母牛，从出生起第四个年头开始每年生一头母牛，杰克第一年有一头刚出生的小母牛，问第 n 年杰克共有几头母牛？


    ### 输入格式

    第一行一个整数 t （t < 50），表示 t 组数据；

    下面每行一个整数 n （n < 50）。


    ### 输出格式

    对于每组数据 n ，输出第 n 年杰克有多少头牛。'
  samples:
  - input: '3

