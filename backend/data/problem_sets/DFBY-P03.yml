- slug: dfby-p03-p01
  seq: 1
  title: 平均绩点
  knowledge:
  - 数组
  difficulty: easy
  statement: '每门课的成绩分为A、B、C、D、F五个等级，为了计算平均绩点，规定A、B、C、D、F分别代表4分、3分、2分、1分、0分。


    ### 输入格式

    从键盘读入一个整数n（3<n<100）,代表有n组成绩。每一组成绩输入数据占一行，由一个或多个大写字母组成(不含空格等其他字符)


    ### 输出格式

    每组输出结果占一行。如果输入的大写字母都在集合｛A,B,C,D,F｝中，则输出对应的平均绩点，结果保留两位小数。否则，输出“Unknown”。'
  samples:
  - input: '3

      ABCDF

      BFFCCA

      DCEF

      '
    output: '2.00

      1.83

      Unknown

      '
  tests:
  - input: '15

      A

      B

      C

      D

      E

      F

      AAAAABBBBBCCCCCDDDDDFFFFF

      ABCE

      AAAAAAAAAAAAAAAAAAAAAA

      BDACCBDDAAACD

      POABCQW

      S

      POIUYTRWQ

      ABCDFABCDFABCDFABCDFABCDF

      FFFFFFFFFFFFFFFFF

      '
    output: '4.00

      3.00

      2.00

      1.00

      Unknown

      0.00

      2.00

      Unknown

      4.00

      2.46

      Unknown

      Unknown

      Unknown

      2.00

      0.00

      '
- slug: dfby-p03-p02
  seq: 2
  title: 区间分数
  knowledge:
  - 数组问题
  difficulty: easy
  statement: '某班级有n名同学，请问这n名同学中，成绩在x~y之间（含x和y）的同学共有多少人，请按从大到小的顺序，输出成绩在x~y之间的所有同学的分数。


    ### 输入格式

    第1行读入一个整数n，代表班级人数（5≤n ≤100 ）

    第2行有n个整数，用空格隔开代表同学的分数（0 ≤ 分数 ≤100 ）

    第3行有2个整数x和y，代表要求解的分数范围（0 ≤x ≤y  ≤100  ）


    ### 输出格式

    第1行按分数从大到小的顺序，输出分数在x~y之间的这些同学的分数，分数之间用空格隔开

    第2行输出分数在x~y之间（含x和y）的同学的人数'
  samples:
  - input: '6

      100 99 90 98 96 95

      95 100

      '
    output: '100 99 98 96 95

      5

      '
  tests:
  - input: '19

      92 85 99 95 81 63 97 80 88 92 95 89 79 80 65 85 86 65 85

      80 100

      '
    output: "99 97 95 95 92 92 89 88 86 85 85 85 81 80 80 \n15\n"
  - input: '16

      90 82 93 80 65 76 69 70 88 78 74 85 63 77 100 100

      90 100

      '
    output: "100 100 93 90 \n4\n"
  - input: '11

      69 81 86 94 77 78 68 89 62 69 91

      62 100

      '
    output: "94 91 89 86 81 78 77 69 69 68 62 \n11\n"
  - input: '7

      85 97 96 71 77 94 98

      70 93

      '
    output: "85 77 71 \n3\n"
  - input: '11

      89 66 68 98 95 62 76 84 72 96 71

      89 100

      '
    output: "98 96 95 89 \n4\n"
- slug: dfby-p03-p03
  seq: 3
  title: 评奖要求
  knowledge:
  - 数组问题
  difficulty: easy
  statement: "A公司评选先进员工，要求参加评选的员工在本公司工作的n年内，至少有1次连续3年的年度考评分数在90分或90分以上，才能参加今年的评选。\n\
    \n现给定某员工到公司n年的年度考评分数数据，请问他是满足备参加今年评选先进员工的要求，如果满足，请输出Y，不满足请输出N。\n \n比如：王小芳连续5年的年度考评分数为90\
    \ 89 100 99 95，该员工从第3年到第5年连续3年考评分数都≥90分，因此她满足参选要求。\n \n再比如：李晓明连续6年的考评分数为100 98\
    \ 89 99 90 88，他没有连续3年考评分数≥90分的记录，因此不满足参选的要求。\n\n### 输入格式\n第1行读入一个整数n，代表员工在公司工作的年限（3≤n≤100）\n\
    \ \n第2行有n个整数，用空格隔开代表该员工每年获得的考评分数（0≤分数≤100）\n\n### 输出格式\n按题目要求输出字符Y或者字符N。"
  samples:
  - input: '5

      90 89 100 99 95

      '
    output: 'Y

      '
  tests:
  - input: '10

      88 97 85 88 93 97 90 97 84 80

      '
    output: 'Y

      '
  - input: '6

      86 99 93 80 95 82

      '
    output: 'N

      '
  - input: '7

      86 100 84 83 81 91 83

      '
    output: 'N

      '
  - input: '10

      100 82 100 80 97 83 82 91 92 84

      '
    output: 'N

      '
  - input: '10

      94 96 89 90 100 91 98 96 85 94

      '
    output: 'Y

      '
- slug: dfby-p03-p04
  seq: 4
  title: 求每位同学的身高
  knowledge:
  - 数组问题
  difficulty: easy
  statement: '小明是班上的体育委员，体育老师要求小明记录班上每位同学的身高。但小明的记录方式让体育老师很为难，因为他只记录了每位同学与自己身高的差值，正数表示比小明高的，负数表示比小明矮的。现在，已知了小明的身高，和每位同学与小明身高的差值，求每位同学的身高。体育老师找到学编程的你，你能帮助他吗？


    ### 输入格式

    第一行两个数H、N（1<=N<=100），其中H为小明的身高，N表示班上还有N位同学。

    第二行有N个数，第 i个数表示第i个同学与小明身高的差值。


    ### 输出格式

    共 N+1 个数，即全班同学的身高。

    请注意，输出时，先输出小明的身高，再按读入的顺序输出班级N位同学的身高（输出同学身高时，保留2位小数）。'
  samples:
  - input: '1.25 10

      0.37 -0.23 0.67 -0.21 0.64 0.51 -0.79 0.31 -0.28 -0.52

      '
    output: '1.25 1.62 1.02 1.92 1.04 1.89 1.76 0.46 1.56 0.97 0.73

      '
