  title: 寻找指定大小的数
  knowledge:
  - 数组问题
  difficulty: easy
  statement: "小智想从N个不同的整数中找出第X大和第Y小的数，你能帮助他吗？\n\n### 输入格式\n三行： \n第一行：整数N，代表有N个整数。3<=N<=100\
    \ \n第二行：连续N个不超过1000000的正整数 \n第三行：X和Y\n\n### 输出格式\n两个整数，用空格隔开，分别代表第X大的数和第Y小的数"
