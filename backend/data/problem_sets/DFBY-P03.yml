- slug: dfby-p03-p13-usaco
  seq: 13
  title: 阅读大赛 USACO
  knowledge:
  - 二维数组
  - USACO
  difficulty: easy
  statement: 'K (1 ≤ K ≤ 1,000) 头奶牛参加了 Farmer John 的年度阅读大赛。这个比赛的内容是读一本 N (1 ≤ N ≤
    100,000) 页的书，在理解它的情况下，比谁读的最快。

    奶牛 i 的阅读速度为 Si (1 ≤ Si ≤ 100) 页每分钟，最长连续读书的时间为 Ti (1 ≤ Ti ≤ 100) 分钟，需要休息的时间为 Ri
    (1 ≤ Ri ≤ 100) 分钟。奶牛i只能一次连续读 Ti 分钟，接下来她必须休息 Ri 分钟，才能继续读书。

    请你计算出每头奶牛读完书需要的时间，请向上保留到整数。


    ### 输入格式

    第 1 行: 两个整数 N , K

    第 2…K+1 行: 第 i+1 行 包含三个整数: Si , Ti , Ri


    ### 输出格式

    第 1..K 行: 第 i 行为一个整数，表示奶牛读完书需要的时间，向上保留到整数。'
