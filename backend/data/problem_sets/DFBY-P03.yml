  difficulty: easy
  statement: "输入n个不超过30000的整数（n≤10）。然后求出每个数的数字和，再按每个数的数字和由小到大排列输出。\n\n### 输入格式\n第一行为整数n;\
    \ \n第二行为n个整数\n\n### 输出格式\n由小到大排列的每个数的数字和（每个数之间保留一个空格）"
