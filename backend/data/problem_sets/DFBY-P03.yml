- slug: dfby-p03-p43-n
  seq: 43
  title: 求N个整数的平均数、众数和中位数
  knowledge:
  - 数组问题
  difficulty: easy
  statement: "求N个整数的平均数，众数和中位数。&nbsp; \n小知识：&nbsp; \n* 众数 \n&nbsp;　如有9个数：17 13 17\
    \ 9 17 17 3 16 17 　17出现的次数最多，即为这组数的众数。&nbsp; \n* 中位数 \n&nbsp;　如有9个数：102 170 96\
    \ 90 97 106 110 182 100 \n&nbsp;　将这9个数按一定的顺序（从大到小或从小到大）排列后得到： \n&nbsp;　182 170\
    \ 110 106 102 100 97 96 90 　正中间的一个数是102，102是这组数的中位数。 \n&nbsp;　而这10个数：106 99 104\
    \ 120 107 112 33 102 97 100 \n&nbsp;　按一定顺序排列后得到：120 112 107 106 104 102 100 99\
    \ 97 33 \n&nbsp;　正中间有两个数：104 102，中位数就是这两个数的平均数，即（104+102）/ 2 = 103。\n\n### 输入格式\n\
    第一行为整数N（5 <= N <= 10000 ) 第二行为空格隔开的N个数Ai（0 <= Ai <= 100 )\n\n### 输出格式\n输出空格隔开的平均数\
    \ 众数 中位数（平均数保留两位小数，中位数保留一位小数）。"
  samples:
  - input: '6

      5 2 2 3 4 6

      '
    output: '3.67 2 3.5

      '
  tests:
  - input: '5

      5 2 2 3 4

      '
    output: '3.20 2 3.0

      '
