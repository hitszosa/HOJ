- slug: dfby-p03-p08
  seq: 8
  title: 当总统
  knowledge:
  - 数组
  - 贪心
  difficulty: easy
  statement: "小明想当丑国的总统，丑国大选是按各州的投票结果来确定最终的结果的，如果得到超过一半的州的支持就可以当选，而每个州的投票结果又是由该州选民投票产生的，如果某个州超过一半的选民支持小明，则他将赢得该州的支持。现在给出每个州的选民人数，请问小明至少需要赢得多少选民的支持才能当选？\n\
    \n### 输入格式\n输入一个整数n，代表有n（1<n<100）组数据 \n每组数据的第一行是一个整数m（1<=m<=101）,表示丑国的州数。\n接下来包括m个正整数，分别表示每个州的选民数，每个州的选民数不超过100。\n\
    \n### 输出格式\n对于每组数据输出一行，表示小明至少需要赢得支持的选民数。"
