  title: 数字交换
  knowledge:
  - 数组问题
  difficulty: easy
  statement: "有一组数（设有N个）。编一程序交换这组数中任意指定的两段。(两段不重合，且这两段的数字个数一样)\n\n### 输入格式\n一个数N（不超过20个）\
    \  \n 一行N个数由空格分开  \n 两个空格分开的数（表示要交换的其中一段）  \n 两个空格分开的数（表示要交换的其中另一段）\n\n### 输出格式\n\
    交换后的一行数（中间用空格隔开）"
  samples:
  - input: "16\n3 6 11 45 23 70 67 34 26 89 90 15 56 50 20 10 \n3 5\n13 15\n"
