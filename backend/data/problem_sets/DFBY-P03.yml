- slug: dfby-p03-p12
  seq: 12
  title: 统计数字
  knowledge:
  - 数组
  difficulty: easy
  statement: "某次科研调查时得到了n个自然数，每个数均不超过1500000000（1.5*109）。已知不相同的数不超过10000个，现在需要统计这些自然数各自出现的次数，并按照自然数从小到大的顺序输出统计结果。\n\
    \n### 输入格式\n输入包含n+1行；\n第一行是整数n，表示自然数的个数；\n第2~n+1每行一个自然数。\n\n### 输出格式\n输出包含m行（m为n个自然数中不相同数的个数），按照自然数从小到大的顺序输出。每行输出两个整数，分别是自然数和该数出现的次数，其间用一个空格隔开。\n\
    \n### 提示与数据范围\n【限制】\n   40%的数据满足：1<=n<=1000\n   80%的数据满足：1<=n<=50000\n   100%的数据满足：1<=n<=200000，每个数均不超过1\
    \ 500 000 000（1.5*109）"
