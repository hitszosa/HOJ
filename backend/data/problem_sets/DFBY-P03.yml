- slug: dfby-p03-p37-k
  seq: 37
  title: 寻找第K大数
  knowledge:
  - 数组问题
  difficulty: easy
  statement: "N个小朋友在一起做游戏。 每个小朋友在自己的硬纸板上写一个数，然后同时举起来。 接着，小y老师提一个问题，看哪个小朋友先抢答出来。 问题是：在这N个数中，第K大的是哪个数？请你编程完成。\n\
    \n### 输入格式\n输入文件的第一行为2个整数，依次为N和K( K <= N <= 10000 )。 下面N行，每行为一个整数，表示从第1个小朋友到第N个朋友分别写的数。假设这些小朋友只知道-32768~32767之间的数。\n\
    \n### 输出格式\n输出文件只有一行，就一个数，为第K大的那个数。 \n\n### 提示与数据范围\n注意：本题第2大的数是2，第3大的数也是2，第4大的数是1。"
  samples:
  - input: '4 3

      1

      2

      2

      4

      '
    output: '2

      '
  tests:
  - input: '4 2

      1

      2

      3

      4

      '
    output: '3

      '
- slug: dfby-p03-p38
  seq: 38
  title: 求子序列的个数
  knowledge:
  - 数组问题
  difficulty: easy
  statement: "给定一串整数数列，求出所有的递增和递减子序列的数目。如数列7，2，6，9，8，3，5，2，1可分为（7，2），（2，6，9），（9，8，3），（3，5），（5，2，1）5个子序列，答案就是5。我们称2，9，3，5为转折元素。\n\
    \n### 输入格式\n第一行，一个整数N(2<=N<=10)。&nbsp;  \n 第二行，N个整数，任意两个相邻的数都不相等。\n\n### 输出格式\n\
    一个整数。"
  samples:
  - input: '5

      1 3 5 4 6

      '
    output: '3

      '
  tests:
  - input: '4

      1 3 5 4

      '
    output: '2

      '
- slug: dfby-p03-p39
  seq: 39
  title: 求和
  knowledge:
  - 数组问题
  difficulty: easy
  statement: '输入n（ 1 <= n <= 5000 ）个正整数，每个数都在1到20000之间；要求对这n个数中的奇数和偶数分别求和。


    ### 输入格式

    第一行，一个正整数n（1 <= n <= 5000 ）； 第2-n+1行，每行一个正整数，每个数都在1到20000之间。


    ### 输出格式

    输出文件共有二行，每行包含一个整数，第一行为所有奇数之和，第二行为所有偶数之和。'
  samples:
  - input: '5

      3

      10

      7

      5

      8

      '
    output: '15

      18

      '
  tests:
  - input: '5

      -2 6 7 7 -8

      '
    output: '1

      '
