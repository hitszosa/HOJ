      1 2 3 4 5 6 7 8

      1

      '
    output: '2 3 4 5 6 7 8 1

      '
  tests:
  - input: '5

      1 2 3 4 5

      1

      '
    output: '2 3 4 5 1

      '
- slug: dfby-p03-p27
  seq: 27
  title: 打折优惠
  knowledge:
  - 数组问题
  difficulty: easy
  statement: '商场周末大优惠，规定凡购物超过100元时，超过100元那部分便可打9折。小雄同妈妈一起购买了一大批物品，你能帮他算出最终的应付款吗？


    ### 输入格式

    第一行一个整数N，表示所买物品的个数。 （N<=100）

    第二行N个空格隔开的整数，表示N件物品要付的元数。


    ### 输出格式

    最终的应付款。（保留两位小数）'
  samples:
  - input: '5

      60 80 50 30 20

      '
    output: '226.00

      '
  tests:
  - input: '4

      60 80 50 20

      '
    output: '199.00

      '
- slug: dfby-p03-p28
  seq: 28
  title: 元素插入有序数组
  knowledge:
  - 数组问题
  difficulty: easy
  statement: '给你一个整数n和一个数列(数列个数不超过1000)，这个数列保证从小到大排列，现要求将这个整数n插入到数列中，使新的数列仍然从小到大排列。


    ### 输入格式

