- slug: luogu-t03-p26
  seq: 26
  title: 电路维修
  knowledge:
  - BFS
  difficulty: easy
  statement: 'Ha&#039;nyu是来自异世界的魔女，她在漫无目的地四处漂流的时候，遇到了善良的少女Rika，从而被收留在地球上。Rika的家里有一辆飞行车。有一天飞行车的电路板突然出现了故障，导致无法启动。


    电路板的整体结构是一个 R 行 C 列的网格。每个格点都是电线的接点。每个格子都包含一个电子元件。电子元件的主要部分是一个可旋转的、连接一条对角线上的两个接点的短电缆。在旋转之后，它就可以连接另一条对角线的两个接点。电路板左上角的接点接入直流电源，右下角的接点接入飞行车的发动装置。


    <img alt="image.png" src="/public/upload/c39db169d0.png" width="374" height="274"
    />


    Ha&#039;nyu发现因为某些元件的方向不小心发生了改变，电路板可能处于断路的状态。她准备通过计算，旋转最少数量的元件，使电源与发动装置通过若干条短电缆相连接。不过，电路的规模实在是太大了，Ha&#039;nyu并不擅长编程，希望你能够帮她解决这个问题。


    ### 输入格式

    第一行包含正整数 R 和 C，表示电路板的行数和列数。


    之后 R 行，每行 C 个字符，字符是“/”和“\”中的一个，表示标准件的方向。


    ### 输出格式

    单独的一行输出一个正整数，表示所需的最少旋转次数。


    如果无论怎样旋转都不能使得电源和发动机之间连通，则输出：NO SOLUTION。


    ### 提示与数据范围

    数据范围：R,C <= 500，T <= 5。'
