- slug: luogu-t03-p29-knight-moves
  seq: 29
  title: Knight Moves
  knowledge:
  - BFS
  difficulty: easy
  statement: '编写一个程序，计算一个骑士从棋盘上的一个格子到另一个格子所需的最小步数。骑士一步可以移动到的位置由下图给出。


    <img alt="image.png" src="/public/upload/133c1c1930.png" width="309" height="236"
    />


    ### 输入格式

    第一行给出骑士的数量n 。


    在接下来的3n  行中，每3  行描述了一个骑士。其中，


    第一行一个整数L  表示棋盘的大小，整个棋盘大小为 L*L；


    第二行和第三行分别包含一对整数(X,Y) ，表示骑士的起始点和终点。假设对于每一个骑士，起始点和终点均合理。


    ### 输出格式

    对每一个骑士，输出一行一个整数表示需要移动的最小步数。如果起始点和终点相同，则输出0 。


    ### 提示与数据范围

    4<=L<=300 保证1<=X,Y<=L-1'
