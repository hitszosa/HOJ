  difficulty: easy
  statement: '现在由 n 个人去完成 n 项任务（人的编号和任务的编号分别为 1 到 n ），每人做且只能做一项任务。现给程每个人完成各项任务所需要的时间，请你给出一个分配方案要求每个人完成任务所需的时间总和最小。


