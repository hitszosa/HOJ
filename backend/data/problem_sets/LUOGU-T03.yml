- slug: luogu-t03-p10-kkt
  seq: 10
  title: KKT基本算法背包问题
  knowledge:
  - DFS
  - 01背包
  - 剪枝
  difficulty: easy
  statement: '<p style="margin-left: 21pt;">小明就要去春游了。妈妈给他买了很多好吃的。小明想把这些吃的都放进他的书包，但他很快发现，妈妈买的东西实在太多了,他必须放弃一些，但又希望能带尽可能多的好吃的。


    <p style="margin-left: 21pt;">已知小明的书包最多可以装人总重量为s的物品同时也知道小明妈妈给他买的每样东西的重量。请从这些好吃的中选出若干装入小明的书包中.使得装人物品的总重量正好为s。找到任意一组解输出即可。


    ### 输入格式

    第1行包含两个正整数n(1<=n<=100)和s(1<=s<=10000)分别代表有n件物品和书包的最大承重s;


    第2行包含n个正整数,代表每件物品的重量Wi(1<=Wi<=1000)。同行的两个数字之间用一个空格隔开。


    ### 输出格式

    一行包含有若干用一个空格隔开的正整数，代表被放人书包的若干物品各自的重量。若无可行解，则输出"No Answer!"。'
  samples:
  - input: '8 14

      1 3 2 5 9 4 7 6

      '
    output: '1 3 4 6

      '
  - input: '3 12

      2 8 5

      '
    output: 'No Answer!

      '
  tests:
  - input: '5 20

      1 5 8 6 7

      '
    output: '1 5 8 6

      '
  - input: '10 50

      18 2 10 2 28 19 26 9 1 4

      '
    output: '18 2 10 19 1

      '
  - input: '15 100

      37 30 27 45 2 25 10 10 23 21 34 16 11 46 49

      '
    output: '37 30 2 10 10 11

      '
  - input: '20 300

      2 40 12 42 86 55 41 51 75 31 25 97 5 42 90 95 13 59 29 26

      '
    output: '2 40 12 42 86 41 51 26

      '
  - input: '30 500

      154 74 95 139 179 47 5 150 16 166 159 102 79 140 85 60 149 51 153 104 39 102
      55 168 134 32 6 187 12 40

      '
    output: '154 74 95 139 32 6

      '
- slug: luogu-t03-p11-kkt
  seq: 11
  title: kkt基本算法门票问题
  knowledge:
  - DFS
  - 剪枝
  difficulty: easy
  statement: '有很多人在门口排队，每个人将会被发到一个有效的通行密码作为门票。


    一个有效的密码由L(3<=L<=15)个小写英文字母组成，至少有一个元音(a、e、i、o或u)和两个辅音(除去元音以外的音节)，并且是按字母表顺序出现的(例如abe是有效的，而bac不是)。


    现在给定一个期望长度为L和C(1<=C<=26)个小写字母，写一个程序，输出所有的长度为L、能由所给定的C个字母组成的有效密码。


    密码必须按字母表顺序打印出来，一行一个。


    ### 输入格式

    第1行是两个由一个空格分开的正整数,L和C,3<=L<=15, 1<=C<=26。


    第2行是C个由一个空格隔开的小写字母,密码是由这个字母集中的字母来构建的。


    ### 输出格式

    若干行,每行输出一个长度为L个字符的密码(没有空格)。输出行必须按照字母顺序排列。


    程序只需要输出前25 000个有效密码,即使后面还存在有效密码。'
