- slug: luogu-t03-p33-f804
  seq: 33
  title: 最少转弯问题F804
  knowledge:
  - BFS
  difficulty: easy
  statement: '给出一张地图，这张地图被分为n×m（n,m<=100）个方块，任何一个方块不是平地就是高山。平地可以通过，高山则不能。现在你处在地图的（x1,y1）这块平地，问：你至少需要拐几个弯才能到达目的地（x2,y2）？你只能沿着水平和垂直方向的平地上行进，拐弯次数就等于行进方向的改变（从水平到垂直或从垂直到水平）的次数。例如：如图，最少的拐弯次数为5。


    <img alt="aHR0cDovL3p3dS5odXN0b2ouY29tL3VwbG9hZC9pbWFnZS8yMDE3MDcyNy8yMDE3MDcyNzIxNDcyN18zNjM1Mi5qcGc.jpg"
    src="/public/upload/9bfd5d34a0.jpg" width="385" height="306" />


    ### 输入格式

    第1行：n   m


    第2至n+1行：整个地图地形描述（0：空地；1：高山），


    如（图）第2行地形描述为：1 0 0 0 0 1 0


    第3行地形描述为：0 0 1 0 1 0 0


    ……


    第n+2行：x1  y1  x2  y2  （分别为起点、终点坐标）


    ### 输出格式

    s （即最少的拐弯次数）'
