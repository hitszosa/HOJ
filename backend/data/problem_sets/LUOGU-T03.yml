- slug: luogu-t03-p34-f805
  seq: 34
  title: 麻将游戏F805
  knowledge:
  - BFS
  difficulty: easy
  statement: '在一种"麻将"游戏中，游戏是在一个有W＊H格子的矩形平板上进行的。每个格子可以放置一个麻将牌，也可以不放。玩家的目标是将平板上的所有可通过一条路径相连的两张相同的麻将牌，从平板上移去。最后如果能将所有牌移出平板，则算过关。
    这个游戏中的一个关键问题是：两张牌之间是否可以被一条路径所连接，该路径满足以下两个特性：


    1.它由若干条线段组成，每条线段要么是水平方向，要么是垂直方向。


    2. 这条路径不能横穿任何一个麻将牌 (但允许路径暂时离开平板)。


    你的任务是编一个程序，检测两张牌是否能被一条符合以上规定的路径所连接。


    <img alt="" src="http://10.91.117.81/oj/upfile/1517293149352.jpg" />


    ### 输入格式

    第一行有两个整数w，h （1<=w，h<=75），表示平板的宽和高。接下来h行描述平板信息，每行包含w个字符，如果某格子有一张牌，则这个格子上有个&#039;X&#039;，否则是一个空格。平板上最左上角格子的坐标为（1，1），最右下角格子的坐标为（w,h）。接下来的若干行，每行有四个数x1， y1， x2， y2 ，且满足1<=x1,x2<=w，1<=y1,y2<=h，表示两张牌的坐标（这两张牌的坐标总是不同的）。如果出现连续四个0，则表示输入结束。


    ### 输出格式

    对于每一对牌输出占一行，为连接这一对牌的路径最少包含的线段数。如果不存在路径则输出0。


    ### 提示与数据范围

    其实就是所谓的连连看游戏啦~'
