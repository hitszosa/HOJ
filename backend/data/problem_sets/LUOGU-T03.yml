- slug: luogu-t03-p21
  seq: 21
  title: 警察找车
  knowledge:
  - BFS
  difficulty: easy
  statement: '年轻的拉尔夫开玩笑地从一个小镇上偷走一辆车，但他没想到的是那辆车属于警察局，并且车上装有用于发射车子移动路线的装置。


    那个装置太旧了，以至于只能发射关于那辆车的移动路线的方向信息。


    编写程序，通过使用一张小镇的地图帮助警察局找到那辆车。程序必须能表示出该车最终所有可能的位置。


    小镇的地图是矩形的，上面的符号用来标明哪儿可以行车和哪儿不行。“.”表示小镇上那块地方是可以行车的，而符号“X”表示此处不能行车。拉尔夫所开小车的初始位置用字符的“*”表示，且汽车能从初始位置通过。


    汽车能向四个方向移动：向北（向上）、向南（向下）、向西（向左）、向东（向右）。


    拉尔夫所开小车的行动路线是通过一组给定的方向来描述的。在每个给定的方向，拉尔夫驾驶小车通过小镇上一个或更多的可行车地点。


    ### 输入格式

    第1行包含两个自然数R和C，之间用1个空格隔开，$1≤R≤50，1≤C≤50$，分别表示小镇地图中的行数和列数。


    以下的R行中每行都包含一组C个符号（“.”或“X”或“*”）用来描述地图上相应的部位。


    接下来的第R+2行包含1个自然数N，$1≤N≤1000$，表示一组方向方向的长度。


    接下来的N行，每行包含单词NORTH（北）、SOUTH（南）、WEST（西）和EAST（东）中的任一个，它们表示汽车移动的方向，任何两个连续的方向都不相同。


    ### 输出格式

    <span style="color: rgb(51, 51, 51);">输出文件应包含用R行表示的小镇的地图（像输入文件中一样），字符“*”应该仅用来表示汽车最终可能出现的位置。</span>'
  samples:
  - input: '4 5

      . . . . .

      . X . . .

      . . . * X

      X . X . .

      3

      NORTH

      WEST

      SOUTH

      '
    output: '. . . . .

      * X * . .

      * . * . X

      X . X . .

      '
  tests:
  - input: "3 3\n...\n..X\n*..\n3\nEAST\nNORTH\nWEST\n\x1A\n"
    output: '*..

      *.X

