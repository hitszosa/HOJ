- slug: luogu-t03-p07
  seq: 7
  title: 奇怪的电梯
  knowledge:
  - BFS
  difficulty: easy
  statement: '有一种很奇怪的电梯。大楼的每一层楼都可以停电梯，而且第$i$层楼$(1 \le i \le N)$上有一个数字$K_i(0 \le K_i
    \le N)$。


    电梯只有四个按钮：开，关，上，下。上下的层数等于当前楼层上的那个数字。当然，如果不能满足要求，相应的按钮就会失灵。


    例如：$3, 3 ,1 ,2 ,5$代表了$K_i(K_1=3,K_2=3,…)$，从$1$楼开始。在$1$楼，按“上”可以到$4$楼，按“下”是不起作用的，因为没有$-2$楼。


    那么，从$A$楼到$B$楼至少要按几次按钮呢？


    ### 输入格式

    共二行。


    第一行为$3$个用空格隔开的正整数，表示$N,A,B(1≤N≤200, 1≤A,B≤N)$。


    第二行为$N$个用空格隔开的非负整数，表示$K_i$。


    ### 输出格式

    一行，即最少按键次数,若无法到达，则输出$-1$。'
