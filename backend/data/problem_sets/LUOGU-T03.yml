  title: 细胞F801
  knowledge:
  - BFS
  difficulty: easy
  statement: '一个n*m的矩形阵列由数字0到9组成，数字1到9代表细胞，细胞的定义为：沿细胞数字上下左右还是细胞数字则为同一细胞，求给定矩形阵列的细胞个数。


    ### 输入格式

    第一行输入两个数n和m。


    接下来的n行m列输入矩阵，由0到9组成。


    ### 输出格式

    输出矩阵里的细胞个数


    ### 提示与数据范围

    1<=n,m<=1,000'
