- slug: luogu-t03-p27
  seq: 27
  title: 魔板
  knowledge:
  - BFS
  difficulty: easy
  statement: '在成功地发明了魔方之后，拉比克先生发明了它的二维版本，称作魔板。这是一张有 8 个大小相同的格子的魔板：

    1234

    8765


    我们知道魔板的每一个方格都有一种颜色。这 8 种颜色用前 8 个正整数来表示。可以用颜色的序列来表示一种魔板状态,规定从魔板的左上角开始，沿顺时针方向依次取出整数，构成一个颜色序列。对于上图的魔板状态，我们用序列（1，2，3，4，5，6，7，8）来表示。这是基本状态。

    这里提供三种基本操作，分别用大写字母“A”，“B”，“C”来表示（可以通过这些操作改变魔板的状态）：

    “A”：交换上下两行；

    “B”：将最右边的一行插入最左边；

    “C”：魔板中央作顺时针旋转。


    下面是对基本状态进行操作的示范：

    A:  8  7  6  5


    <blockquote>1  2  3  4


    </blockquote>B:  4  1  2  3


    <blockquote>5  8  7  6


    </blockquote>C:  1  7  2  4


    <blockquote>8  6  3  5


    </blockquote>对于每种可能的状态，这三种基本操作都可以使用。


    你要编程计算,用最少的基本操作完成基本状态到特殊状态的转换，输出基本操作序列。


    ### 输入格式

    仅一行，包括 8 个整数，用空格分开（这些整数在范围 1——8 之间），表示目标状态。


    ### 输出格式

    第一行包括一个整数，表示最短操作序列的长度。


    第二行为在字典序中最早出现的操作序列。


    ### 提示与数据范围

    <span style="color: rgba(0, 0, 0, 0.87);">输入数据中的所有数字均1为</span><span style="color:
    rgba(0, 0, 0, 0.87);">到8</span><span style="color: rgba(0, 0, 0, 0.87);">之间的整数。</span>'
  samples:
  - input: '2 6 8 4 5 7 3 1

      '
    output: '7

      BCABCCB

      '
  tests:
  - input: '2 6 8 4 5 7 3 1

      '
    output: '7

      BCABCCB

      '
  - input: '1 2 3 4 5 6 7 8

