- slug: luogu-t03-p24-f916
  seq: 24
  title: 滑雪F916
  knowledge:
  - DP
  - DFS
  difficulty: easy
  statement: 'LYH喜欢滑雪，因为滑雪的确很刺激，可是为了获得速度，滑的区域必须向下倾斜，当LYH滑到坡底，不得不再次走上坡或等着直升机来载他，LYH想知道在一个区域中最长的滑坡。滑坡的长度由滑过点的个数来计算，区域由一个二维数组给出，数组的每个数字代表点的高度。下面是一个例子：


    1      2     3     4     5


    16    17    18    19    6


    15    24    25    20    7


    14    23    22    21    8


    13    12    11    10    9


    一个人可以从某个点滑向上下左右相邻四个点之一，当且仅当高度减小，在上面的例子中，一条可行的滑坡为25-24-17-16-1（从25开始到1结束），当然25-24……2…1更长，事实上这是最长的一条。


    ### 输入格式

    输入的第一行为表示区域的二维数组的行数R和列数C（1≤R、C≤100）下面是R行，每行有C个数代表高度。


    ### 输出格式

    输出区域中最长的滑坡长度。'
  samples:
  - input: '5 5

      1 2 3 4 5

      16 17 18 19 6

      15 24 25 20 7

      14 23 22 21 8

      13 12 11 10 9

      '
    output: '25

      '
