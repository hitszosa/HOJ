- slug: luogu-t03-p16
  seq: 16
  title: 火车进栈
  knowledge:
  - DFS
  - 栈
  - 普及+
  difficulty: easy
  statement: '这里有 $n$ 列火车将要进站再出站，但是，每列火车只有 $1$ 节，那就是车头。


    这 $n$ 列火车按 $1$ 到 $n$ 的顺序从东方左转进站，这个车站是南北方向的，它虽然无限长，只可惜是一个死胡同，而且站台只有一条股道，火车只能倒着从西方出去，而且每列火车必须进站，先进后出。


    也就是说这个火车站其实就相当于一个栈，每次可以让右侧头火车进栈，或者让栈顶火车出站。


    车站示意如图：


    <pre><code>           出站   <——    <——进站

                         |车|

                         |站|

                         |__|

    </code></pre>现在请你按《字典序》输出前 $20$ 种可能的出栈方案。


    ### 输入格式

    输入一个整数 $n$，代表火车数量。


    ### 输出格式

    按照《字典序》输出前 $20$ 种答案，每行一种，不要空格。


    ### 提示与数据范围

    数据范围


    $1 \le n \le 20$'
