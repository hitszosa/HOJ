# 种子题单 · 第 2 批（格式说明见 COMP1007-W01.yml 顶部注释）

course: COMP1007
batch: W02-循环结构
seq: 2
title: 第 2 周 · 循环与迭代
open_at: 2026-09-15 08:00
due_at: 2026-09-22 23:59
problems:
  - slug: sum-of-n
    title: 累加求和
    knowledge: [循环, 边界条件]
    difficulty: easy
    statement: |
      读入正整数 n，输出 1 + 2 + ... + n。
    samples:
      - input: "5"
        output: "15"

  - slug: factorial
    title: 阶乘
    knowledge: [循环, 整数溢出]
    difficulty: easy
    statement: |
      读入 n（0 ≤ n ≤ 20），输出 n! 。注意 n = 0 时结果为 1。
    samples:
      - input: "5"
        output: "120"

  - slug: count-digits
    title: 数位统计
    knowledge: [循环, 取余, 边界条件]
    difficulty: medium
    statement: |
      读入一个非负整数 n，输出它的位数。注意 n = 0 时位数为 1。
    samples:
      - input: "100"
        output: "3"
      - input: "0"
        output: "1"

  - slug: reverse-number
    title: 反转整数
    knowledge: [循环, 取余, 边界条件]
    difficulty: medium
    statement: |
      读入一个非负整数 n，输出各位数字反转后的数。反转后的前导零不输出。
    samples:
      - input: "1200"
        output: "21"

  - slug: is-prime
    title: 判断素数
    knowledge: [循环, 取余, 循环边界]
    difficulty: medium
    statement: |
      读入整数 n（2 ≤ n ≤ 10^9），若为素数输出 yes，否则输出 no。
    samples:
      - input: "97"
        output: "yes"
      - input: "1"
        output: "no"

  - slug: multiplication-table
    title: 九九乘法表
    knowledge: [嵌套循环, 格式化输出]
    difficulty: medium
    statement: |
      读入 n（1 ≤ n ≤ 9），输出 n 行的乘法表。
      第 i 行输出 i 个式子，形如 i*j=积，式子之间用一个空格分隔，行末不留空格。
    samples:
      - input: "3"
        output: "1*1=1
2*1=2 2*2=4
3*1=3 3*2=6 3*3=9"

  - slug: gcd-lcm
    title: 最大公约数与最小公倍数
    knowledge: [循环, 数论基础]
    difficulty: medium
    statement: |
      读入两个正整数 a 和 b，输出它们的最大公约数与最小公倍数，用空格分隔。
    samples:
      - input: "12 18"
        output: "6 36"

  - slug: golden-ratio-approx
    title: 递推求近似值
    knowledge: [循环, 浮点精度, 递推]
    difficulty: hard
    statement: |
      读入正整数 n，按下面递推计算并输出结果，保留六位小数：
      f(1) = 1，f(2) = 1，f(k) = f(k-1) + f(k-2)（k ≥ 3），
      输出 f(n+1) / f(n)。
    samples:
      - input: "10"
        output: "1.617647"
