[package]
name = "grader-backend"
version = "0.1.0"
edition = "2024"
default-run = "grader-backend"

[dependencies]
anyhow = "1"
aws-credential-types = "1"
percent-encoding = "2"
axum = { version = "0.8", features = ["macros", "form", "query"] }
aws-config = { version = "1", features = ["behavior-version-latest"] }
aws-sdk-s3 = "1"
base64 = "0.22"
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4", features = ["derive", "env"] }
cookie = { version = "0.18", features = ["private", "key-expansion", "percent-encode"] }
diesel = { version = "2.3", default-features = false, features = ["mysql_backend", "chrono", "serde_json", "32-column-tables"] }
diesel-async = { version = "0.9", features = ["mysql", "bb8", "migrations"] }
diesel_migrations = { version = "2.3", default-features = false, features = ["mysql"] }
dotenvy = "0.15"
futures-util = "0.3"
hex = "0.4"
hmac = "0.12"
http = "1"
pbkdf2 = "0.12"
prost = "0.14"
rand = "0.9"
redis = { version = "0.27.6", default-features = false, features = ["tokio-rustls-comp"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json", "multipart", "stream"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
subtle = "2"
thiserror = "2"
time = "0.3"
tokio = { version = "1", features = ["full"] }
tonic = { version = "0.14", features = ["transport"] }
tonic-prost = "0.14"
tower-http = { version = "0.6", features = ["cors", "trace", "normalize-path"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
url = "2"
uuid = { version = "1", features = ["v4", "serde"] }
zxcvbn = "3"
axum-prometheus = "0.10.1"

[build-dependencies]
protoc-bin-vendored = "3"
tonic-prost-build = "0.14"

[profile.release]
strip = true
lto = "thin"
