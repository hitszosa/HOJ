- slug: usaco-u01-p46-shopping-offers
  seq: 46
  title: 商店购物 Shopping Offers
  knowledge:
  - USACO
  difficulty: easy
  statement: '在商店中，每一种商品都有一个价格（用整数表示）。例如,一朵花的价格是 $2$ ，而一个花瓶的价格是 $5$ 。为了吸引更多的顾客，商店举行了促销活动。


    促销活动把一个或多个商品组合起来降价销售，例如：


    三朵花的价格是 $5$ 而不是 $6$ ，$2$ 个花瓶和一朵花的价格是 $10$ 而不是 $12$ 。 请编写一个程序，计算顾客购买一定商品的花费，尽量地利用优惠使花费最少。尽管有时候添加其他商品可以获得更少的花费，但是你不能这么做。


    对于上面的商品信息，购买三朵花和两个花瓶的最少花费的方案是：以优惠价购买两个花瓶和一朵花（$10$），以原价购买两朵花（$4$）。


    ### 输入格式

    输入文件包括一些商店提供的优惠信息，接着是购物清单。（最多有 $5$ 种商品）


    第一行 优惠方案的种类数（$0\leq s\leq99$）。


    第 $2$ 行 $\sim$ 第 $s+1$ 行  每一行都用几个整数来表示一种优惠方式。第一个整数 $n$ （$\leq n\leq5$），表示这种优惠方式由
    $n$ 种商品组成。后面 $n$ 对整数 $c$ 和 $k$ 表示 $k$ （$1\leq k\leq5$）个编号为 $c$ （$1\leq c\leq999$）的商品共同构成这种优惠，最后的整数
    $p$ 表示这种优惠的优惠价（$1\leq p\leq9,999$）。优惠价总是比原价低。


    第 $s+2$ 行 这一行有一个整数 $b$ （$0\leq b\leq5$），表示需要购买 $b$ 种不同的商品。


    第 $s+3$ 行 $\sim$ 第 $s+b+2$ 行 这 $b$ 行中的每一行包括三个整数：$c,k,p$ 。 $c$ 表示唯一的商品编号（$1\leq
    c\leq999$），$k$ 表示需要购买的 $c$ 商品的数量（$1\leq k\leq5$）。$p$ 表示 $c$ 商品的原价（$1\leq p\leq999$）。最多购买
    $5\times5=25$ 个商品。


    ### 输出格式

    只有一行，输出一个整数：购买这些物品的最低价格。'
