- slug: usaco-u01-p36-contact
  seq: 36
  title: 联系 Contact
  knowledge:
  - USACO
  difficulty: easy
  statement: '奶牛们开始对用射电望远镜扫描牧场外的宇宙感兴趣。最近，他们注意到了一种非常奇怪的脉冲调制微波从星系的中央发射出来。他们希望知道电波是否是被某些地外生命发射出来的，还是仅仅是普通的的星星发出的。


    帮助奶牛们用一个能够分析他们在文件中记下的记录的工具来找到真相。他们在寻找长度在 $A$ 到 $B$ 之间（包含 $A$ 和 $B$ 本身）在每天的数据文件中重复次数前
    $n$ 多的比特序列。


    符合的序列可能会重叠，并且至少出现一次的序列会被计数。


    ### 提示与数据范围

    **【样例解释】**


    在样例里，序列 $100$ 出现了 $12$ 次，而序列 $1000$ 出现了 $5$ 次。次数最多的序列是 $00$，出现了 $23$ 次。


    **【数据规模】**


    对于 $100\%$ 的数据，保证 $1 \leq n \leq 50$，$1 \leq A \leq B \leq 12$，$s$ 中只含字符 `0` 和字符
    `1`，且长度不超过 $2 \times 10^5$。'
