- slug: usaco-u01-p03-the-clocks
  seq: 3
  title: 时钟 The Clocks
  knowledge:
  - USACO
  difficulty: easy
  statement: "考虑将如此安排在一个3×3 行列中的九个时钟:\n![](https://cdn.luogu.com.cn/upload/pic/58.png)\n\
    \n目标要找一个最小的移动顺序将所有的指针指向 **12** 点。下面原表格列出了**9 **种不同的旋转指针的方法，每一种方法都叫一次移动。\n选择 1∼9\
    \ 号移动方法，将会使在表格中对应的时钟的指针顺时针旋转** 90 **度。\n\n移动方法\t受影响的时钟\n1\tABDE\n2\tABC\n3\tBCEF\n\
    4\tADG\n5\tBDEFH\n6\tCFI\n7\tDEGH\n8\tGHI\n9\tEFHI\nExample\n![](https://cdn.luogu.com.cn/upload/pic/59.png)\n\
    \n[但这可能不是正确的方法，请看下面]\n\n### 输入格式\n输入三行，每行三个正整数，表示一个时钟的初始时间，数字的含意和上面第一个例子一样。\n\n\
    ### 输出格式\n单独的一行包括一个用空格分开的将所有指针指向 1212 点的最短移动顺序的列表。\n\n如果有多种方案，输出那种使其连接起来的数字最小的方案。(举例来说\
    \ 5 2 4 6<9 3 1 1 )。"
