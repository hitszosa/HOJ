- slug: usaco-u01-p02-packing-rectangles
  seq: 2
  title: 铺放矩形块 Packing Rectangles
  knowledge:
  - USACO
  difficulty: easy
  statement: '给出了四个矩形。找到最小的封闭（新）矩形，这四个矩形可以不重叠地安装到其中。最小矩形是指面积最小的矩形。

    ![](https://cdn.luogu.com.cn/upload/pic/57.png)

    所有四个矩形的边都应与封闭矩形的相应边平行。图 1 显示了将四个矩形组合在一起的六种方法。这六个是唯一可能的基本

    布局，因为任何其他布局都可以通过旋转或反射从基本布局中获得。包装过程中可以将矩形旋转 90 度。

    可能存在几个不同的满足要求的外接矩形，它们都具有相同的面积。您必须生成所有此类封闭矩形。


    ### 输入格式

    四行，每行包含两个以空格分隔的正整数，表示矩形两侧的长度。矩形的每条边最少为 1，最多为 50。


    ### 输出格式

    输出文件包含的行多于解决方案的数量。

    第一行包含一个整数：封闭矩形的最小面积。

    以下每一行都包含一个解决方案，由两个数字 p 和 q 描述，其中 p<=q。

    这些行必须按 p 的升序排序，并且必须全部不同。


    ### 提示与数据范围

    **【数据范围】**

    对于100% 的数据，输入的所有数在 [1,50][1,50] 内。

    USACO Training Section 1.4'
  samples:
  - input: '1 2

      2 3

      3 4

      4 5

      '
    output: '40

      4 10

      5 8

      '
