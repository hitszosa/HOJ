- slug: usaco-u01-p08-superprime-rib
  seq: 8
  title: 特殊的质数肋骨 Superprime Rib
  knowledge:
  - USACO
  difficulty: easy
  statement: '农民约翰的母牛总是产生最好的肋骨。你能通过农民约翰和美国农业部标记在每根肋骨上的数字认出它们。

    农民约翰确定他卖给买方的是真正的质数肋骨,是因为从右边开始切下肋骨,每次还剩下的肋骨上的数字都组成一个质数,举例来说: 7 3 3 1 全部肋骨上的数字 7331是质数;三根肋骨
