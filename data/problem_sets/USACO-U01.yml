- slug: usaco-u01-p24-money-system
  seq: 24
  title: Money System  货币系统
  knowledge:
  - USACO
  difficulty: easy
  statement: '母牛们不但创建了它们自己的政府而且选择了建立了自己的货币系统。由于它们特殊的思考方式，它们对货币的数值感到好奇。


    传统地，一个货币系统是由 $1,5,10,20,25,50,100$ 的单位面值组成的。


    母牛想知道有多少种不同的方法来用货币系统中的货币来构造一个确定的数值。


    举例来说, 使用一个货币系统 $(1,2,5,10, \ldots)$ 产生 $18$ 单位面值的一些可能的方法是：$18 \times 1, 9 \times
    2, 8 \times 2+2 \times 1, 3 \times 5+2+1$，等等。


    写一个程序来计算有多少种方法用给定的货币系统来构造一定数量的面值。保证总数在 $64$ 位带符号整数的范围内。


    ### 输入格式

    第一行两个整数：货币系统中货币的种类数目 $V$（$1 \leq V \leq 25$）。要构造的数量钱是 $N$（$1 \leq N \leq 10,000$）。

    第二行 $V$ 个整数，代表所有可用的货币的面值。


    ### 输出格式

    单独的一行，包含用这 $V$ 种硬币凑足 $N$ 单位货币的方案数。'
