- slug: usaco-u01-p45-dual-palindromes
  seq: 45
  title: 双重回文数 Dual Palindromes
  knowledge:
  - USACO
  difficulty: easy
  statement: '如果一个数从左往右读和从右往左读都是一样，那么这个数就叫做“回文数”。例如，12321就是一个回文数，而77778就不是。当然，回文数的首和尾都应是非零的，因此0220就不是回文数。

    事实上，有一些数（如21），在十进制时不是回文数，但在其它进制（如二进制时为10101）时就是回文数。

    编一个程序，从文件读入两个十进制数N (1 <= N <= 15)S (0 < S < 10000)然后找出前N个满足大于S且在两种或两种以上进制（二进制至十进制）上是回文数的十进制数，输出到文件上。

    本问题的解决方案不需要使用大于32位的整型


    ### 输入格式

    只有一行，用空格隔开的两个数N和S。


    ### 输出格式

    N行, 每行一个满足上述要求的数，并按从小到大的顺序输出。


    ### 提示与数据范围

    【数据范围】

    对于 100% 的数据，1≤n≤15，1≤s≤9999

    USACO Training Section 1.2'
