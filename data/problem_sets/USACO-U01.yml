- slug: usaco-u01-p17-subset-sums
  seq: 17
  title: 集合 Subset Sums
  knowledge:
  - USACO
  difficulty: easy
  statement: "对于从 $1\\sim n$ 的连续整数集合，能划分成两个子集合，且保证每个集合的数字和是相等的。举个例子，如果 $n=3$，对于 $\\\
    {1,2,3\\}$ 能划分成两个子集合，每个子集合的所有数字和是相等的：\n\n$\\{3\\}$ 和 $\\{1,2\\}$ 是唯一一种分法（交换集合位置被认为是同一种划分方案，因此不会增加划分方案总数）\
    \  \n如果 $n=7$，有四种方法能划分集合 $\\{1,2,3,4,5,6,7 \\}$，每一种分法的子集合各数字和是相等的:\n\n$\\{1,6,7\\\
    }$ 和 $\\{2,3,4,5\\}$  \n$\\{2,5,7\\}$ 和 $\\{1,3,4,6\\}$  \n$\\{3,4,7\\}$ 和 $\\\
    {1,2,5,6\\}$  \n$\\{1,2,4,7\\}$ 和 $\\{3,5,6\\}$  \n\n给出n，你的程序应该输出划分方案总数，如果不存在这样的划分方案，则输出0。\n\
    **程序不能预存结果直接输出（不能打表）**\n\n### 输入格式\n输入文件只有一行，且只有一个整数 $n$\n\n### 输出格式\n输出划分方案总数。\n\
    \n### 提示与数据范围\n**【数据范围】 ** \n对于 $100\\%$ 的数据，$1\\le n \\le 39$。\nUSACO 2.2"
  samples:
  - input: '7

      '
    output: '4

      '
  tests:
  - input: '7

      '
    output: '4

      '
