- slug: usaco-u01-p28-cow-tours
  seq: 28
  title: 牛的旅行 Cow Tours
  knowledge:
  - USACO
  difficulty: easy
  statement: "Farmer John 的农场里有很多 **牧区**。有的路径连接一些特定的牧区。**一片所有连通的牧区** 称为一个 **牧场**。但是就目前而言，你能看到至少有两个牧区通过任何路径都不连通。这样，Farmer\
    \ John 就有 **多个** 牧场了。\n\nJohn 想在牧场里添加 **恰好** 一条路径。对这条路径有以下限制：\n\n一个牧场的 **直径**\
    \ 就是牧场中 **最远** 的两个牧区的距离（本题中所提到的所有距离指的都是 **最短的距离**）。考虑如下的有 5 个牧区的牧场，牧区用 `*` 表示，路径用直线表示。每一个牧区都有自己的坐标：\n\
    \n```plain\n                (15,15) (20,15)\n                 D       E\n    \
    \             *-------*\n                 |     _/|\n                 |   _/ \
    \ |\n                 | _/    |\n                 |/      |\n        *--------*-------*\n\
    \        A        B       C\n     (10,10)  (15,10) (20,10)\n```\n这个牧场的直径大约是 $12.07106$，最远的两个牧区是\
    \ A 和 E，它们之间的最短路径是 $A \\to B \\to E$。\n\n这里是 John 的另一个牧场：\n\n```plain\n      \
    \                   *F(30,15)\n                        / \n                  \
    \    _/  \n                    _/    \n                   /      \n          \
    \        *------* \n                  G      H\n                  (25,10)   (30,10)\n\
    ```\n\n在这个例子中，他刚好有这两个牧场。John 将会在这两个牧场中各选一个牧区（即从 $\\{A,B,C,D,E\\}$ 中选择一个牧区，从 $\\\
    {F,G,H\\}$ 中选择一个牧区），然后用一条路径将它们连起来，使得连通后这个新的更大的牧场的直径尽可能小。\n\n注意，如果两条路径中途相交，我们不认为它们是连通的。只有两条路径在同一个牧区相交，我们才认为它们是连通的。\n\
    \n输入文件包括牧区、它们各自的坐标，还有一个如下的对称邻接矩阵：\n\n```plain\n　 A  B  C  D  E  F  G  H \nA  0\
    \  1  0  0  0  0  0  0\nB  1  0  1  1  1  0  0  0\nC  0  1  0  0  1  0  0  0\n\
    D  0  1  0  0  1  0  0  0\nE  0  1  1  1  0  0  0  0\nF  0  0  0  0  0  0  1 \
    \ 0\nG  0  0  0  0  0  1  0  1\nH  0  0  0  0  0  0  1  0\n```\n\n其他邻接表中可能直接使用行列而不使用字母来表示每一个牧区。输入数据中不包括牧区的名字。\n\
    \n输入文件 **至少** 包括两个不连通的牧区。\n\n请编程找出一条连接属于两个 **不同牧场** 的牧区的路径，使得连上这条路径后，这个更大的新牧场的直径尽可能小。输出在所有合法的连接方案中，新牧场直径的最小值。\n\
    \n### 输入格式\n第一行一个整数 $N$（$1 \\leq N \\leq 150$），表示牧区数。\n\n接下来 $N$ 行，每行两个整数 $X,Y$（$0\
    \ \\leq X ,Y \\leq 10^5$），表示 $N$ 个牧区的坐标。注意每个牧区的坐标都是不一样的。\n\n接下来 $N$ 行，每行 $N$ 个数字，代表邻接矩阵\
    \ $M$。第 $i$ 行第 $j$ 列的数字为 $1$，表示 $i$ 号牧区和 $j$ 号牧区之间存在一条道路直接相连；第 $i$ 行第 $j$ 列的数字为\
    \ $0$，表示 $i$ 号牧区和 $j$ 号牧区之间不存在直接相连的道路。\n保证 $M_{i,j} = M_{j,i}$。\n\n### 输出格式\n\
    只有一行，包括一个实数，表示所求直径。数字保留六位小数。\n只需要打到小数点后六位即可，不要做任何特别的四舍五入处理。\n\n### 提示与数据范围\n样例对应题目描述中的情况。\n\
    最优解是连接 C 牧区和 G 牧区，连接后图上只有一个牧场。这个牧场的直径为 $A \\to B \\to C \\to G \\to F$，长度约为 $22.071068$。可以证明不存在更优的方案。\n\
    USACO 2.4"
