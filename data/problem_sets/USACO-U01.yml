- slug: usaco-u01-p16-preface-numbering
  seq: 16
  title: 序言页码 Preface Numbering
  knowledge:
  - USACO
  difficulty: easy
  statement: "一类书的序言是以罗马数字标页码的。传统罗马数字用单个字母表示特定的数值，以下是标准数字表:  \n  \n|I|V|X|L|C|D|M|\n\
    |:-:|:-:|:-:|:-:|:-:|:-:|:-:|\n|1|5|10|50|100|500|1000|\n  \n最多3个同样的可以表示为10n的数字(I,X,C,M)可以连续放在一起，表示它们的和:\
    \  \n`III=3 CCC=300`  \n可表示为5x10n的字符(V,L,D)从不连续出现。  \n除了下一个规则，一般来说，字符以递减的顺序接连出现:\
    \  \n`CCLXVIII = 100+100+50+10+5+1+1+1 = 268`  \n有时，一个可表示为10n的数出现在一个比它大1级或2级的数前(I在V或X前面，X在L或C前面，等等)。在这种情况下，数值等于后面的那个数减去前面的那个数:\
    \  \n`IV = 4 IX = 9 XL = 40`  \n一个数 用罗马数字来表示 有且仅有一种 而且不能复合嵌套使用（比如I是1 X是10 有人可能要说\
    \ IXL就能表示50-10-1 但是IXL绝对不能用来表达39 ） （那么39用什么来表示呢 XXXIX是唯一 而且正确的选择- -）  \n像XD, IC,\
    \ 和XM这样的表达是非法的，因为前面的数比后面的数小太多。对于XD(490的错误表达)，可以写成 CDXC; 对于IC(99的错误表达)，可以写成XCIX;\
    \ 对于XM(990的错误表达)，可以写成CMXC。 90 写成 XC 而不是 LXL, 因为 L 后面的 X 意味着后继标记是 X 或者更小 (不管怎样，可能吧)（等同于阿拉伯数字\
    \ 每位 数字分别表示）。 \n \n给定N(1 <= N < 3,500)， 序言的页码数，请统计在第1页到第N页中，有几个I出现，几个V出现，等等 (从小到大的顺序)。不要输出没有出现过的字符。\
    \  \n比如N = 5, 那么页码数为: I, II, III, IV, V. 总共有7个I出现，2个V出现。  \n给定 $n$，求 $1 \\sim\
    \ n$ 的 **罗马数字** 表示中，各个字符出现了多少次。\n比如 $n = 5$，表示为  I, II, III, IV, V。总共有 $7$ 个 I\
    \ 出现，$2$ 个 V 出现。\n\n### 输入格式\n一个整数 $n$。\n\n### 输出格式\n每行一个字符和一个数字 k，表示这个字符出现了 k\
    \ 次。字符必须按罗马数字表中的递增顺序输出。\n\n### 提示与数据范围\n**【数据范围】 ** \n对于 $100\\%$ 的数据，$1\\le n\
    \ \\le 3500$。\nUSACO 2.2"
  samples:
