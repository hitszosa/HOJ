- slug: usaco-u01-p04-arithmetic-progressi
  seq: 4
  title: 等差数列 Arithmetic Progressions
  knowledge:
  - USACO
  difficulty: easy
  statement: '一个等差数列是一个能表示成a, a+b, a+2b,..., a+nb (n=0,1,2,3,...)的数列。

    在这个问题中a是一个非负的整数，b是正整数。写一个程序来找出在双平方数集合


    **{x∣x=p^2^ +q^2^ ∧p,q∈N∩[0,m]}**


    (双平方数集合是所有能表示成p的平方 + q的平方的数的集合,其中p和q为非负整数)S中长度为n的等差数列。


    ### 输入格式

    第一行: N(3<= N<=25),要找的等差数列的长度。

    第二行: M(1<= M<=250),搜索双平方数的上界0 <= p,q <= M。


    ### 输出格式

    如果没有找到数列,输出NONE。

    如果找到了，输出一行或多行, 每行由二个整数组成:a,b。

    这些行应该先按b排序再按a排序。

    所求的等差数列将不会多于10,000个。'
