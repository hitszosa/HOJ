- slug: usaco-u01-p18-runaround-numbers
  seq: 18
  title: 循环数 Runaround Numbers
  knowledge:
  - USACO
  difficulty: easy
  statement: "循环数是那些不包括 $0$ 且没有重复数字的整数（比如 $81362$）并且还应同时具有一个有趣的性质, 就像这个例子:\n\n如果你从最左边的数字开始（在这个例子中\
    \ $8$）向右数最左边这个数（如果数到了最右边就回到最左边），你会停止在另一个新的数字（如果停在一个相同的数字上，这个数就不是循环数）。  \n\n就像：$8\\\
    \ 1\\ 3\\ 6\\ 2$ 从最左边接下去数 $8$ 个数字: $1\\ 3\\ 6\\ 2\\ 8\\ 1\\ 3\\ 6$ 所以下一个数字是 $6$\n\
    \n重复这样做 (这次从 `6` 开始数 $6$ 个数字) 并且你会停止在一个新的数字上: $2\\ 8\\ 1\\ 3\\ 6\\ 2$, 也就是 $2$\n\
    \n再这样做 (这次数两个): $8\\ 1$\n\n再一次 (这次一个): $3$\n\n又一次: $6\\ 2\\ 8$   \n\n这时你回到了起点,在经过每个数字一次后回到起点的就是循环数。如果你经过每一个数字一次以后没有回到起点,\
    \ 你的数字不是一个循环数。\n\n给你一个数字 $m$ ，找出第一个比 $m$ 大的循环数, 输出数据保证结果能用一个无符号长整型数 $ \\in [0,2^{32})$\
    \ 装下。 （追加提醒：循环数每个数位都必须要访问到）\n\n### 输入格式\n仅仅一行, 包括 $m$。\n\n### 输出格式\n仅仅一行，输出第一个比\
    \ $m$ 大的循环数。\n\n### 提示与数据范围\n**【数据范围】 ** \n对于 $100\\%$ 的数据，$1\\le m \\le 10^9$。\n\
    USACO 2.2"
  samples:
  - input: '81361

      '
    output: '81362

      '
  tests:
  - input: '99

      '
    output: '147

      '
  - input: '111110

      '
    output: '134259

      '
  - input: '134259

      '
    output: '134859

      '
  - input: '348761

      '
    output: '359142

      '
  - input: '1000000

      '
    output: '1246895

      '
- slug: usaco-u01-p19-party-lamps
  seq: 19
  title: 派对灯 Party Lamps
  knowledge:
  - USACO
  difficulty: easy
  statement: "在 IOI98 的节日宴会上，我们有 $n$ 盏彩色灯，他们分别从 $1 \\sim n$ 被标上号码。这些灯都连接到四个按钮：\n\n\
    按钮 $1$：当按下此按钮，将改变所有的灯：本来亮着的灯就熄灭，本来是关着的灯被点亮。\n按钮 $2$：当按下此按钮，将改变所有奇数号的灯。\n按钮 $3$：当按下此按钮，将改变所有偶数号的灯。\n\
    按钮 $4$：当按下此按钮，将改变所有序号是 $3k+1 \\ (k \\in [0,+\\infty) \\cap \\mathbb Z)$ 的灯。例如：$1,4,7,10\
    \ \\dots$\n\n一个计数器 $c$ 记录按钮被按下的次数。当宴会开始，所有的灯都亮着，此时计数器 $c$ 为 $0$。\n\n你将得到计数器 $c$\
    \ 上的数值和经过若干操作后某些灯的状态。写一个程序去找出所有灯最后可能的与所给出信息相符的状态，并且没有重复。\n\n### 输入格式\n第一行一个正整数\
    \ $n$；第二行一个整数 $c$，表示最后计数器的数值。  \n第三行若干个整数，表示最后亮着的灯，以 `-1` 结束。  \n第四行若干个整数，表示最后关着的灯，以\
    \ `-1` 结束。\n保证不会有灯会在输入中出现两次。\n\n### 输出格式\n每一行是所有灯可能的最后状态（没有重复）。  \n每一行有 $n$ 个字符，第\
    \ $i$ 个字符表示 $i$ 号灯。$0$ 表示关闭，$1$ 表示亮着。这些行必须从小到大排列（看作是二进制数）。\n如果没有可能的状态，则输出一行 `IMPOSSIBLE`。\n\
    \n### 提示与数据范围\n**【数据范围】 ** \n对于 $100\\%$ 的数据，$10 \\le n \\le 100$，$0 \\le c \\\
    le 10^4$\n**【样例解释】 ** \n在这个样例中，有三种可能的状态：\n- 所有灯都关着\n- $1,4,7,10$ 号灯关着，$2,3,5,6,8,9$\
    \ 亮着。\n- $1,3,5,7,9$ 号灯关着，$2,4,6,8,10$ 亮着。\n\nUSACO 2.2"
  samples:
  - input: '10

      1

      -1

      7 -1

      '
    output: '0000000000

      0101010101

      0110110110

      '
  tests:
