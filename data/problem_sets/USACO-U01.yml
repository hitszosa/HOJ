- slug: usaco-u01-p09-checker-challenge
  seq: 9
  title: 八皇后 Checker Challenge
  knowledge:
  - USACO
  difficulty: easy
  statement: "检查一个如下的6 x 6的跳棋棋盘，有六个棋子被放置在棋盘上，使得每行，每列，每条对角线(包括两条主对角线的所有对角线)上都至多有一个棋子，如下例，就是一种正确的布局。\n\
    ```  \n0   1   2   3   4   5   6  \n  -------------------------  \n1 |   | O |\
    \   |   |   |   |\n  -------------------------  \n2 |   |   |   | O |   |   |\n\
    \  -------------------------  \n3 |   |   |   |   |   | O |\n  -------------------------\
    \  \n4 | O |   |   |   |   |   |\n  -------------------------  \n5 |   |   | O\
    \ |   |   |   |\n  -------------------------  \n6 |   |   |   |   | O |   |\n\
    \  -------------------------  \n```  \n上面的布局可以用序列2 4 6 1 3 5来描述，第i个数字表示在第i行的相应位置有一个棋子，如下：\n\
    行号 1 2 3 4 5 6\n列号 2 4 6 1 3 5\n这只是跳棋放置的一个解。请写一个程序找出所有跳棋放置的解，并把它们以上面的序列方法输出。解按字典顺序排列，请输出前3个解，最后一行是解的总个数。\n\
