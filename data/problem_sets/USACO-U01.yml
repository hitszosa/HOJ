- slug: usaco-u01-p20-longest-prefix
  seq: 20
  title: 最长前缀 Longest Prefix
  knowledge:
  - USACO
  difficulty: easy
  statement: "在生物学中，一些生物的结构是用包含其要素的大写字母序列来表示的。生物学家对于把长的序列分解成较短的序列（即元素）很感兴趣。\n\n如果一个集合\
    \ $P$ 中的元素可以串起来（元素可以重复使用）组成一个序列 $s$ ，那么我们认为序列 $s$ 可以分解为 $P$ 中的元素。元素不一定要全部出现（如下例中\
    \ `BBC` 就没有出现）。举个例子，序列 `ABABACABAAB` 可以分解为下面集合中的元素：`{A,AB,BA,CA,BBC}`\n\n序列 $s$\
    \ 的前面 $k$ 个字符称作 $s$ 中长度为 $k$ 的前缀。设计一个程序，输入一个元素集合以及一个大写字母序列  ，设 $s'$ 是序列 $s$ 的最长前缀，使其可以分解为给出的集合\
    \ $P$ 中的元素，求 $s'$ 的长度 $k$。\n\n### 输入格式\n输入数据的开头包括若干个元素组成的集合 $O$，用连续的以空格分开的字符串表示。字母全部是大写，数据可能不止一行。元素集合结束的标志是一个只包含一个\
    \ `.` 的行，集合中的元素没有重复。  \n\n接着是大写字母序列 $s$ ，长度为，用一行或者多行的字符串来表示，每行不超过 $76$ 个字符。换行符并不是序列\
    \ $s$ 的一部分。\n\n### 输出格式\n只有一行，输出一个整数，表示 S 符合条件的前缀的最大长度。\n\n### 提示与数据范围\n**【数据范围】**\n\
    对于 $100\\%$ 的数据，$1\\le \\text{card}(P) \\le 200$，$1\\le |S| \\le 2\\times 10^5$，$P$\
    \ 中的元素长度均不超过 $10$。\nUSACO 2.3"
  samples:
  - input: 'A AB BA CA BBC

      .

      ABABACABAABC

      '
    output: '11

      '
