  difficulty: easy
  statement: '回文数是指从左向右念和从右向左念都一样的数。如12321就是一个典型的回文数。

    给定一个进制B(2<=B<=20,由十进制表示)，输出所有的大于等于1小于等于300（十进制下）且它的平方用B进制表示时是回文数的数。用’A’,’B’……表示10，11等等


    ### 输入格式

    共一行，一个单独的整数B(B用十进制表示)。


    ### 输出格式

    每行两个B进制的符合要求的数字，第二个数是第一个数的平方，且第二个数是回文数。'
