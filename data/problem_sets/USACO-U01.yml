- slug: usaco-u01-p39-01-stringsobits
  seq: 39
  title: 01串 Stringsobits
  knowledge:
  - USACO
  difficulty: easy
  statement: '考虑排好序的 $N$（$1 \leq N \leq 31$）位二进制数。


    他们是排列好的，而且包含所有长度为 $N$ 且这个二进制数中 $1$ 的位数的个数小于等于 $L$（$L \leq N$）的数。


    你的任务是输出满足长度为 $N$，且 $1$ 的个数小于等于 $L$ 的第 $i$ 小的那个二进制数（保证这个数存在）。


    例：$100101$ 中，$N=6$，含有 $1$ 的个数为 $3$。


    ### 输入格式

    一行三个整数 $N,L,i$。


    ### 输出格式

    输出满足条件的第 $i$ 小的二进制数。'
  samples:
  - input: '5 3 19

      '
    output: '10011

      '
  tests:
  - input: '4 2 1

      '
    output: '0000

      '
  - input: '1 1 2

      '
    output: '1

      '
  - input: '8 4 30

      '
    output: '00011101

      '
  - input: '10 2 56

      '
    output: '1100000000

      '
  - input: '7 7 64

      '
    output: '0111111

      '
- slug: usaco-u01-p40-spinning-wheels
  seq: 40
  title: 纺车的轮子 Spinning Wheels
  knowledge:
  - USACO
  difficulty: easy
  statement: '一架纺车有五个纺轮（也就是五个同心圆），这五个不透明的轮子边缘上都有一些缺口。这些缺口必须被迅速而准确地排列好。每个轮子都有一个起始标记（在0度），这样所有的轮子都可以在统一的已知位置开始转动。轮子按照角度变大的方向旋转（即0经过旋转到达1的位置），所以从起始位置开始，在一定的时间内，它们依次转过1度，2度等等（虽然这些轮子很可能不会同时转过这些角度）。


    这是一个整数问题。轮子不会转过1.5度或23.51234123度这样的角度。例如，轮子可能在一秒钟内转过20到25度甚至30到40度（如果转得快的话）。


    这个问题中的所有角度都限制在 0 <= 角度 <= 359 这个范围内。轮子转过 359 度后接下来就是 0 度。每个轮子都有一个确定的旋转速度，以秒作为单位。1
    <= 速度 <= 180。


    轮子上的缺口的起始角度和缺口大小（或宽度）各由一个整数表示，都以度为单位。在一个轮子上，两个缺口之间至少有一度的间隔。宽度也包含缺口起始的角度，**即0 179包括0..179共计180个角度**


    在起始位置，设时间为 0，所有的轮子的起始标记排列成一条直线。你的程序必须计算，最早出现每个的轮子上的缺口同其他轮子上的缺口对准（也就是一束光可以通过五个轮子上的五个缺口）情况的时间。这些缺口在任意一个角度对准。


    ### 输入格式

    输入中的五行对应五个轮子。


    第一个数字表示轮子的转动速度。下一个数字是缺口的数目 W。1 <= W <= 5。接下来的 W 对数字表示每个缺口的起始角度和宽度。


    ### 输出格式

    只有一行，包括一个整数，表示光能够通过这五个轮子的最早时间。如果无解，输出''none''（小写，不含引号）。'
  samples:
  - input: '30 1 0 120

      50 1 150 90

      60 1 60 90

      70 1 180 180

      90 1 180 60

      '
    output: '9

      '
  tests:
  - input: '30 1 0 120

      180 1 10 100

      35 1 20 90

      31 1 30 80

      32 1 50 60

      '
    output: '0

      '
  - input: '30 1 350 350

      180 1 10 100

      35 1 67 23

      31 1 30 4

      32 1 50 7

      '
    output: 'none

      '
  - input: '180 1 0 120

      180 1 120 120

      180 1 240 120

      31 1 30 4

      32 1 50 7

      '
    output: 'none

      '
  - input: '1 1 140 359

      1 1 200 359

      1 1 4 1

      2 1 6 1

      1 1 300 300

      '
    output: '357

      '
  - input: '45 5 140 13 300 17 0 15 20 3 40 1

      73 1 200 359

      105 2 4 1 50 50

      179 3 6 1 8 1 359 3

      3 1 300 300

      '
    output: '1

      '
- slug: usaco-u01-p41-feed-ratios
  seq: 41
  title: 饲料调配 Feed Ratios
  knowledge:
  - USACO
  difficulty: easy
  statement: '农夫约翰从来只用调配得最好的饲料来喂他的奶牛。饲料用三种原料调配成：大麦，燕麦和小麦。他知道自己的饲料精确的配比，在市场上是买不到这样的饲料的。他只好购买其他三种混合饲料（同样都由三种麦子组成），然后将它们混合，来调配他的完美饲料。


    给出三组整数，表示 大麦：燕麦：小麦 的比例，找出用这三种饲料调配 x：y：z 的饲料的方法。


    例如，给出目标饲料 3：4：5 和三种饲料的比例：


    1:2:3

    3:7:1

    2:1:2

    你必须编程找出使这三种饲料用量最少的方案，要是不能用这三种饲料调配目标饲料，输出“NONE”。“用量最少”意味着三种饲料的用量（整数）的和必须最小。


    对于上面的例子，你可以用8份饲料1，1份饲料2，和5份饲料3，来得到7份目标饲料：


    8\*(1:2:3) + 1\*(3:7:1) + 5\*(2:1:2) = (21:28:35) = 7\*(3:4:5)


    表示饲料比例的整数以及目标饲料的都是小于100的非负整数。表示各种饲料的份数的整数，都小于100。一种混合物的比例不会由其他混合物的比例直接相加得到。


    ### 输入格式

    Line 1: 三个用空格分开的整数，表示目标饲料


    Line 2..4: 每行包括三个用空格分开的整数，表示农夫约翰买进的饲料的比例


    ### 输出格式

    输出文件要包括一行，这一行要么有四个整数，要么是“NONE”。前三个整数表示三种饲料的份数，用这样的配比可以得到目标饲料。第四个整数表示混合三种饲料后得到的目标饲料的份数。


    ### 提示与数据范围

    题目翻译来自NOCOW。


    USACO Training Section 3.2'
  samples:
  - input: '3 4 5

      1 2 3

      3 7 1

      2 1 2

      '
    output: '8 1 5 7

      '
  tests:
  - input: '5 8 0

      3 5 4

      1 3 0

      6 2 0

      '
    output: '0 38 7 16

      '
  - input: '3 4 5

      1 2 3

      3 7 1

      2 1 2

      '
    output: '8 1 5 7

      '
  - input: '20 22 24

      4 5 5

      9 5 6

