- slug: usaco-u01-p42-magic-squares
  seq: 42
  title: 魔板 Magic Squares
  knowledge:
  - USACO
  difficulty: easy
  statement: '在成功地发明了魔方之后，鲁比克先生发明了它的二维版本，称作魔板。这是一张有8个大小相同的格子的魔板：


    1  2  3  4


    8  7  6  5


    我们知道魔板的每一个方格都有一种颜色。这8种颜色用前8个正整数来表示。可以用颜色的序列来表示一种魔板状态，规定从魔板的左上角开始，沿顺时针方向依次取出整数，构成一个颜色序列。对于上图的魔板状态，我们用序列（1，2，3，4，5，6，7，8）来表示。这是基本状态。


    这里提供三种基本操作，分别用大写字母“A”，“B”，“C”来表示（可以通过这些操作改变魔板的状态）：


    “A”：交换上下两行；


    “B”：将最右边的一列插入最左边；


    “C”：魔板中央四格作顺时针旋转。


    下面是对基本状态进行操作的示范：


    A:  8  7  6  5


    1  2  3  4


    B:  4  1  2  3


    5  8  7  6


    C:  1  7  2  4


    8  6  3  5


    对于每种可能的状态，这三种基本操作都可以使用。


    你要编程计算用最少的基本操作完成基本状态到目标状态的转换，输出基本操作序列。


    ### 输入格式

    只有一行，包括8个整数，用空格分开（这些整数在范围 1——8 之间）不换行，表示目标状态。


    ### 输出格式

    第一行: 包括一个整数，表示最短操作序列的长度。


    第二行: 在字典序中最早出现的操作序列，用字符串表示，除最后一行外，每行输出60个字符。'
  samples:
  - input: '2 6 8 4 5 7 3 1

      '
    output: "7 \nBCABCCB\n"
  tests:
  - input: '2 6 8 4 5 7 3 1

      '
    output: '7

      BCABCCB

      '
  - input: '1 2 3 4 5 6 7 8

      '
    output: '0


      '
  - input: '6 7 4 1 8 5 2 3

      '
    output: '5

      CCBBB

      '
  - input: '5 1 2 4 3 7 8 6

      '
    output: '8

      ABBBCABB

      '
  - input: '6 1 5 4 3 2 7 8

      '
    output: '14

      ABBBCABBBCBBBC

      '
- slug: usaco-u01-p43-sweet-butter
  seq: 43
  title: 香甜的黄油 Sweet Butter
  knowledge:
  - USACO
  difficulty: easy
  statement: "Farmer John 发现了做出全威斯康辛州最甜的黄油的方法：糖。\n\n把糖放在一片牧场上，他知道 $N$ 只奶牛会过来舔它，这样就能做出能卖好价钱的超甜黄油。当然，他将付出额外的费用在奶牛上。\n\
    \nFarmer John 很狡猾。像以前的 Pavlov，他知道他可以训练这些奶牛，让它们在听到铃声时去一个特定的牧场。他打算将糖放在那里然后下午发出铃声，以至他可以在晚上挤奶。\n\
    \nFarmer John 知道每只奶牛都在各自喜欢的牧场（一个牧场不一定只有一头牛）。给出各头牛在的牧场和牧场间的路线，找出使所有牛到达的路程和最短的牧场（他将把糖放在那）。\n\
    \n### 输入格式\n第一行包含三个整数 $N,P,C$，分别表示奶牛数、牧场数和牧场间道路数。\n\n第二行到第 $N+1$ 行，每行一个整数，其中第\
    \ $i$ 行的整数表示第 $i-1$ 头奶牛所在的牧场号。\n\n第 $N+2$ 行到第 $N+C+1$ 行，每行包含三个整数 $A,B,D$，表示牧场号为\
    \ $A$ 和 $B$ 的两个牧场之间有一条长度为 $D$ 的双向道路相连。\n\n### 输出格式\n输出一行一个整数，表示奶牛必须行走的最小的距离和。\n\
    \n### 提示与数据范围\n**【数据范围】**\n\n对于所有数据，$1 \\le N \\le 500$，$2 \\le P \\le 800$，$1\
    \ \\le A,B \\le P$，$1 \\le C \\le 1450$，$1 \\le D \\le 255$。\n\n**【样例解释】**\n\n\
    作图如下：\n\n```cpp\n          P2  \nP1 @--1--@ C1\n         |\n         | \n    \
    \   5  7  3\n         |   \n         |     C3\n       C2 @--5--@\n          P3\
    \    P4\n```\n把糖放在4号牧场最优。"
