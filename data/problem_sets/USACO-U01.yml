- slug: usaco-u01-p05-mother-s-milk
  seq: 5
  title: 母亲的牛奶 Mother's Milk
  knowledge:
  - USACO
  difficulty: easy
  statement: '农民约翰有三个容量分别是A,B,C升的桶，A,B,C分别是三个从1到20的整数， 最初，A和B桶都是空的，而C桶是装满牛奶的。

    有时，农民把牛奶从一个桶倒到另一个桶中，直到被灌桶装满或原桶空了。当然每一次灌注都是完全的。由于节约，牛奶不会有丢失。

    写一个程序去帮助农民找出当A桶是空的时候，C桶中牛奶所剩量的所有可能性。


    ### 输入格式

    单独的一行包括三个整数A,B和C。


    ### 输出格式

    只有一行，升序地列出当A桶是空的时候，C桶牛奶所剩量的所有可能性。


    ### 提示与数据范围

    【数据范围】

    对于 100% 的数据，1≤a,b,c≤20。

    USACO Training Section 1.4'
  samples:
  - input: '2 5 10

      '
    output: '5 6 7 8 9 10

      '
