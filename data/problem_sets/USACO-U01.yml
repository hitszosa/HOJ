- slug: usaco-u01-p15-hamming-codes
  seq: 15
  title: 海明码 Hamming Codes
  knowledge:
  - USACO
  difficulty: easy
  statement: "给出 $n,b,d$，要求找出 $n$ 个由 $0,1$ 组成的编码，每个编码有 $b$ 位），使得两两编码之间至少有 $d$ 个单位的\
    \ “Hamming距离”。“  \n\nHamming距离”是指对于两个编码，他们二进制表示法中的不同二进制位的数目。看下面的两个编码 `0x554` 和\
    \ `0x234`（十六进制数）\n\n```\n0x554 = 0101 0101 0100\n0x234 = 0010 0011 0100\n不同位 \
    \   xxx  xx\n```\n\n因为有五个位不同，所以“Hamming距离”是 $5$。\n\n### 输入格式\n一行，包括 n,b,d。\n\n\
    ### 输出格式\nn 个编码（用十进制表示），要排序，十个一行。\n如果有多解，你的程序要输出这样的解：假如把它化为 2^b^ 进制数，它的值要最小。\n\
    \n### 提示与数据范围\n**【数据范围】 ** \n对于 $100\\%$ 的数据，$1\\le n \\le 64$，$1\\le b \\le 8$，$1\\\
    le d \\le 7$。\n请解释：“必须与其他所有的数相比，Hamming 距离都符合要求，这个数才正确”\n答：如样例输出，$0,7$，$0,25$，比较都符合海明码，同样\
    \ $7,25$，$7,30$，比较也符合要求，以此类推。题中至少有 $d$ 个单位，意思就是大于等于 $d$ 个单位的都可以。\nUSACO 2.1"
