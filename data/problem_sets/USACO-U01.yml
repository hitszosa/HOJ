- slug: usaco-u01-p32-score-inflation
  seq: 32
  title: 总分 Score Inflation
  knowledge:
  - USACO
  difficulty: easy
  statement: '选手在我们 USACO 的竞赛中的得分越多我们越高兴。

    我们试着设计我们的竞赛以便人们能尽可能的多得分,这需要你的帮助。


    我们可以从几个种类中选取竞赛的题目,这里的一个"种类"是指一个竞赛题目的集合,解决集合中的题目需要相同多的时间并且能得到相同的分数。


    你的任务是写一个程序来告诉 USACO 的职员,应该从每一个种类中选取多少题目，使得解决题目的总耗时在竞赛规定的时间里并且总分最大。


    ### 输入格式

    输入的第一行是用空格隔开的两个整数，分别代表竞赛时间 $m$ 和题目类 $n$。

    第 $2$ 到第 $(n + 1)$ 行，每行两个用空格隔开的整数，第 $(i + 1)$ 行的整数 $p_i, t_i$ 分别代表解决第 $i$ 类题得到的分数和需要花费的时间。

    既然是某一类题目，那么这一类题目可以重复选择。


    ### 输出格式

    输出一行一个整数，代表最大的总分。


    ### 提示与数据范围

    **【数据规模】**

    对于 $100\%$ 的数据，保证 $1 \leq n \leq 10^4$，$1 \leq p_i, t_i \leq 10^4$。'
  samples:
  - input: '300 4

      100 60

      250 120

      120 100

      35 20

      '
    output: '605

      '
  tests:
  - input: '300    4

      100 60

      250 120

      120 100

      35 20

      '
    output: '605

      '
  - input: '10000 1

      10000 1

      '
    output: '100000000

