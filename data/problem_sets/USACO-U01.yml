- slug: usaco-u01-p30-fractions-to-decimal
  seq: 30
  title: 分数化小数 Fractions to Decimals
  knowledge:
  - USACO
  difficulty: easy
  statement: '写一个程序，输入一个形如 $\dfrac{N}{D}$ 的分数，输出它的小数形式。如果小数有循环节的话，把循环节放在一对圆括号中。


    例如，$\dfrac{1}{3}=0.33333333\ldots$ 写成 $0.(3)$，$\dfrac{41}{333}= 0.123123123\ldots$
    写成 $0.(123)$，整数 $x$ 写成 $x.0$。


    ### 输入格式

    输入包含两个整数 $N$ 和 $D$（$1 \leq N,D \leq 10^5$）。


    ### 输出格式

    输出按照上面规则计算出的小数表达式。如果结果长度大于 $76$，每行输出 $76$ 个字符。'
  samples:
  - input: '45 56

      '
    output: '0.803(571428)

      '
  tests:
  - input: '22 5

      '
    output: '4.4

      '
  - input: '1 7

      '
    output: '0.(142857)

      '
  - input: '100000 59

      '
    output: '1694.(9152542372881355932203389830508474576271186440677966101694)

      '
  - input: '1 100000

      '
    output: '0.00001

      '
  - input: '3 3

      '
    output: '1.0

      '
- slug: usaco-u01-p31-agri-net
  seq: 31
  title: 最短网络 Agri-Net
  knowledge:
  - USACO
  difficulty: easy
  statement: 'Farmer John 被选为他们镇的镇长！他其中一个竞选承诺就是在镇上建立起互联网，并连接到所有的农场。当然，他需要你的帮助。


    Farmer John 已经给他的农场安排了一条高速的网络线路，他想把这条线路共享给其他农场。为了用最小的消费，他想铺设最短的光纤去连接所有的农场。


    你将得到一份各农场之间连接费用的列表，你必须找出能连接所有农场并所用光纤最短的方案。每两个农场间的距离不会超过 $10^5$。


    ### 输入格式

    第一行农场的个数 $N$（$3 \leq N \leq 100$）。

    接下来是一个 $N \times N$ 的矩阵，表示每个农场之间的距离。理论上，他们是 $N$ 行，每行由 $N$ 个用空格分隔的数组成，实际上，由于每行
    $80$ 个字符的限制，因此，某些行会紧接着另一些行。当然，对角线将会是 $0$，因为不会有线路从第 $i$ 个农场到它本身。


    ### 输出格式

    只有一个输出，其中包含连接到每个农场的光纤的最小长度。'
