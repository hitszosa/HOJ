  - 深搜
  provenance: 东方博宜OJ
  statement: "给出含有 N × N 个格子的正方形表格，要求每个格子都填上一个**个位数**（范围 1 ～ N ），使得每行、每列以及同一斜线上的数字都不同。部分格子已经填好数字。求满足题意的方案数。\n\n###
    输入格式\n第一行输入一个整数 N (1<=N<=9) 。\n下来给出一个部分已经填好数字的正方形。总共 N 行，每行 N 个字符，‘ * ’表示空白格子，还没有填数字。\n\n###
    输出格式\n输出符合要求的方案数。 \n\n### 提示与数据范围\n【样例1数据提示】 \n5 4 3 2 1 \n3 2 1 5 4 \n1 5 4 3
    2 \n4 3 2 1 5 \n2 1 5 4 3 \n【样例2数据提示】 \n(1): \n1 4 3 2 5 \n3 2 5 1 4 \n5 1 4 3
    2 \n4 3 2 5 1 \n2 5 1 4 3 \n(2): \n5 4 3 2 1 \n3 2 1 5 4 \n1 5 4 3 2 \n4 3 2 1
    5 \n2 1 5 4 3"
  samples:
  - input: '5

      54*21

      3*154

      *54*2

      4*215

      *1***

      '
    output: '1

      '
  tests:
  - input: '5

      *4*2*

      3****

      **4*2

      4****

      *****

      '
    output: '2

      '
