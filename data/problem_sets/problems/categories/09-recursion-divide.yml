- slug: 09-recursion-divide-p02
  seq: 2
  title: 全排列
  difficulty: L1-入门
  category: 递归函数与分治初探
  tags:
  - 递归函数与分治初探
  - 一本通在线评测
  knowledge:
  - 一本通在线评测
  provenance: 一本通基础篇
  statement: "给定一个由不同的小写字母组成的字符串，输出这个字符串的所有全排列。  我们假设对于小写字母有‘a’ <‘b’ < ... <‘y’<‘z’，而且给定的字符串中的字母已经按照从小到大的顺序排列。\n\n###
    输入格式\n只有一行，是一个由不同的小写字母组成的字符串，已知字符串的长度在1到6之间。\n\n### 输出格式\n输出这个字符串的所有排列方式，每行一个排列。要求字母序比较小的排列在前面。\n字母序如下定义：
    \n已知$S = s_1s_2...s_k,T = t_1t_2...t_k$，\n则S<T等价于，存在p(1<=p<=k)，使得s~1~=t~1~,s~2~=t~2~,...,s~p−1~=t~p−1~,s~p~<t~p~成立。\n\n###
    提示与数据范围\n本题目禁止使用STL及包含可以使用的相关调用。"
