  statement: '<p style="margin-left: 0in;">有2n个棋子（n≥4）排成一行，开始为位置白子全部在左边，黑子全部在右边，如下图为n=5的情况：


    <p style="margin-left: 0in;">○○○○○●●●●●


    <p style="margin-left: 0in;">移动棋子的规则是：每次必须同时移动相邻的两个棋子，颜色不限，可以左移也可以右移到空位上去，但不能调换两个棋子的左右位置。每次移动必须跳过若干个棋子（不能平移），要求最后能移成黑白相间的一行棋子。如n=5时，成为：


    <p style="margin-left: 0in;">○●○●○●○●○●


    <p style="margin-left: 0in;">任务：编程打印出移动过程。


    ### 输入格式

    输入n。


    ### 输出格式

    移动过程。'
