- slug: 09-recursion-divide-p07-5-6-5
  seq: 7
  title: 「一本通 5.6 练习 5」锯木厂选址
  difficulty: L5-进阶
  category: 递归函数与分治初探
  tags:
  - 递归函数与分治初探
  - DP
  - 斜率优化
  - 分治
  knowledge:
  - DP
  - 斜率优化
  - 分治
  provenance: 一本通提高篇
  statement: "**原题来自：CEOI 2004**\n\n从山顶上到山底下沿着一条直线种植了 $n$ 棵老树。当地的政府决定把他们砍下来。为了不浪费任何一棵木材，树被砍倒后要运送到锯木厂。
    \  \n\n木材只能朝山下运。山脚下有一个锯木厂。另外两个锯木厂将新修建在山路上。你必须决定在哪里修建这两个锯木厂，使得运输的费用总和最小。假定运输每公斤木材每米需要一分钱。
    \ \n\n你的任务是编写一个程序，读入树的个数和他们的重量与位置，计算最小运输费用。\n\n### 输入格式\n输入的第一行为一个正整数 $n$，表示树的个数
    。树从山顶到山脚按照 $1,2,\\cdots ,n$ 标号。  \n\n接下来 $n$ 行，每行有两个整数 $w_i$ 和 $d_i$。分别表示第 $i$
    棵树的重量（公斤为单位）和第 $i$ 棵树和第 $i+1$ 棵树之间的距离。最后一个数 $d_n$，表示第 $n$ 棵树到山脚的锯木厂的距离。\n\n###
    输出格式\n输出仅一个数，表示最小的运输费用。\n\n### 提示与数据范围\n对于 $97$ 分的数据，$2\\le n\\le 2\\times 10^4,1\\le
    w_i\\le 10^4,0\\le d_i\\le 10^4$，保证所有树运到山脚的锯木厂所需要的费用小于 $2\\times 10^9$ 分。（本部分数据为原数据）\n\n对于另外
    $3$ 分的数据，$2\\le n\\le 2\\times 10^5$，保证所有计算均可在 $64$ 位有符号整数下进行。"
  samples:
  - input: '9

      1 2

      2 1

      3 3

      1 1

      3 2

      1 6

      2 1

      1 2

      1 1

      '
    output: '26

      '
  tests:
