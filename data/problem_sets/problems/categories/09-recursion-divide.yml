  statement: "把一块 m*n 米的土地分割成同样大的正方形，如果要求没有土地剩余，分割出的正方形土地最大边长是多少米？（最少不能少于 1 米 *1 米）
    \  \n \n如：一块 6 米  * 4 米的土地，能够分割的最大的正方形的边长为 2 米。（ 5.2.45 ）   \n<img src=\"http://oj.czos.cn/upload/image/20180623/20180623103608_24080.jpg\"
    alt=\"\" />\n\n### 输入格式\n两个整数m和n（m,n <= 1000000000000000000）\n\n### 输出格式\n能够分割的最大正方形的边长"
  samples:
  - input: '6 4

