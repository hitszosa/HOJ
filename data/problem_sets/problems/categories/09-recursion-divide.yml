    lang-html\">....\n.#..\n..#.\n....</pre>\n \n农夫约翰认为一个联通块是谷仓，当且仅当它是一个完整的矩形，否则该联通块是一头奶牛。在第一张照片上面，有三个谷仓（大小分别为2x1,2x5和1x1）和两头奶牛。
    \n计算他的卫星照片中谷仓和奶牛的数量。\n\n### 输入格式\n行1：两个空格分隔的整数：N和M(N,M<=80)。 \n行2..N + 1：行i +
    1表示照片的行i包含M个字符（且不含空格）。\n\n### 输出格式\n行1：照片中的谷仓数量。 \n行2：照片中的奶牛数量。\n\n```input1\n5
