  provenance: 一本通基础篇 · CSP普及组
  statement: '如图，A 点有一个过河卒，需要走到目标 B 点。卒行走规则：可以向下、或者向右。同时在棋盘上的任一点有一个对方的马（如上图的C点），该马所在的点和所有跳跃一步可达的点称为对方马的控制点。例如上图
    C 点上的马可以控制 9 个点（图中的P1，P2 … P8 和 C）。卒不能通过对方马的控制点。


    ![0066.png](/api/public/img/11f317cbefd64d069f81057db02fdc9a.png)

    棋盘用坐标表示，A 点（0，0）、B 点（n,m）(n,m 为不超过 20 的整数，并由键盘输入)，同样马的位置坐标是需要给出的（约定: C<>A，同时C<>B）。现在要求你计算出卒从
    A 点能够到达 B 点的路径的条数。


    ### 输入格式

    <span style="color: rgba(0, 0, 0, 0.75);">一行四个正整数，分别表示</span><span style="color:
    rgba(0, 0, 0, 0.75);">B</span><span style="color: rgba(0, 0, 0, 0.75);">点坐标和马的坐标。</span>


    ### 输出格式

    <span style="color: rgba(0, 0, 0, 0.75);">一个整数，表示所有的路径条数。</span>


    ### 提示与数据范围

    <span style="color: rgba(0, 0, 0, 0.75);">【数据范围】</span>


    <p style="margin-left: 40px;"><span style="color: rgba(0, 0, 0, 0.75);">对于1</span><span
    style="color: rgba(0, 0, 0, 0.75);">00%</span><span style="color: rgba(0, 0, 0,
    0.75);">的数据，</span><span style="color: rgba(0, 0, 0, 0.75);">1≤n,m≤20</span><span
    style="color: rgba(0, 0, 0, 0.75);">，<span style="color: rgb(51, 51, 51);">题解AC程序：</span></span><span
    style="color: rgba(0, 0, 0, 0.75);">0≤</span><span style="color: rgba(0, 0, 0,
    0.75);">马的坐标</span><span style="color: rgba(0, 0, 0, 0.75);">≤20'
