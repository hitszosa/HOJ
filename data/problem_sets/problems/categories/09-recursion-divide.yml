  statement: "某人写了N封信，用去N个信封，结果所有的信都装错了信封。求所有的信都装错信封共有多少种不同情况。可用下面公式（错位排列的递推公式）：\n
    基本形式：D(1)=0; D(2)=1\n递归形式：D(n)=(n-1)*( D(n-1)+D(n-2))\n\n### 输入格式\n一个正整数N，N<13。\n\n###
    输出格式\n所有的信都装错信封的不同情况数。"
