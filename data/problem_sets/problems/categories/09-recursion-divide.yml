- slug: 09-recursion-divide-p32-hanoi
  seq: 32
  title: 算法训练 Hanoi汉诺塔问题
  difficulty: L3-普及
  category: 递归函数与分治初探
  tags:
  - 递归函数与分治初探
  - 蓝桥杯-算法训练
  knowledge:
  - 蓝桥杯-算法训练
  provenance: 蓝桥杯VIP题库 · 蓝桥杯-算法训练
  statement: '如果将课本上的Hanoi塔问题稍做修改：仍然是给定N只盘子，3根柱子，但是允许每次最多移动相邻的M只盘子（当然移动盘子的数目也可以小于M）,最少需要多少次？

    　　例如N=5，M=2时，可以分别将最小的2个盘子、中间的2个盘子以及最大的一个盘子分别看作一个整体，这样可以转变为N=3，M=1的情况，共需要移动7次。


    ### 输入格式

    输入数据仅有一行，包括两个数N和M（0<=M<=N<=8）


    ### 输出格式

    仅输出一个数，表示需要移动的最少次数'
  samples:
  - input: '参考上文

      '
    output: '参考上文

      '
  tests:
  - input: '5 2

      '
    output: '7

      '
  - input: '6 2

      '
    output: '7

      '
  - input: '7 2

      '
    output: '15

      '
  - input: '8 2

      '
    output: '15

      '
  - input: '9 2

      '
    output: '31

