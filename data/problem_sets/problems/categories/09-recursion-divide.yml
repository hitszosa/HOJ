- slug: 09-recursion-divide-p14-usaco
  seq: 14
  title: 奶牛和草丛 USACO
  difficulty: L1-入门
  category: 递归函数与分治初探
  tags:
  - 递归函数与分治初探
  - 深搜
  - 递归
  - USACO
  knowledge:
  - 深搜
  - 递归
  - USACO
  provenance: 东方博宜OJ
  statement: "奶牛Bessie计划好好享受柔软的春季新草。新草分布在R行C列的牧场里。它想计算一下牧场中的草丛数量。 \n在牧场地图中，每个草丛要么是单个“#”，要么是有公共边的相邻多个“#”。给定牧场地图，计算有多少个草丛。
    \n例如，考虑如下5行6列的牧场地图 \n.#.... \n..#... \n..#..# \n....## \n.....# \n这个牧场有3个草丛：一个在第一行，一个在第二列横跨了二、三行，一个在第三行横跨了三、四、五行。\n\n###
    输入格式\n第一行包含两个整数R和C，中间用单个空格隔开。 \n接下来R行，每行C个字符，描述牧场地图。字符只有“#”或“.”两种。(1 <= R, C <=
    100 )\n\n### 输出格式\n输出一个整数，表示草丛数。"
  samples:
  - input: '5 6

      .#....

      ..#...

      ..#..#

      ....##

      .....#

      '
    output: '3

      '
  tests:
  - input: '5 6

      .#...#

      .##...

      ..#..#

      .#..##

      #.....

      '
    output: '5

      '
