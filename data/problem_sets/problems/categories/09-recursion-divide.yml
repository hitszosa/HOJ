  provenance: 洛谷精选题库
  statement: '设 S 是一个具有 n 个元素的集合，S ={ A1，A2，A3，……，An }，现将 S 划分成 k 个满足下列条件的子集合 S1，S2，S3，……，Sn，且满足：

    （1）Si非空

    （2）Si 与 Sj 交集为空（1 <= i < j <= k）

    （3）S1，S2，……，Sk 的并集为全集 S

    则称 S1，S2，……，Sk 为集合 S 的一个划分。给定 n 和 k ，求集合 S 的划分数。


    ### 输入格式

    一行包含两个正整数 n 和 k


    ### 输出格式

    一个数，表示划分数。


    ### 提示与数据范围

    数据范围：1 <= k <= n < 100。'
