  statement: '我们要求找出具有下列性质数的个数(包含输入的自然数n):先输入一个自然数n(n<=1000),然后对此自然数按照如下方法进行处理:


    1.不作任何处理;


    2.在它的左边加上一个自然数,但该自然数不能超过原数的一半;


    3.加上数后,继续按此规则进行处理,直到不能再加自然数为止.


    ### 输入格式

    仅包含一个数n


    ### 输出格式

    一个数，表示满足题目描述性质的数的个数。


    ### 提示与数据范围

    样例说明：满足条件的数为  6  16  26  126  36  136'
