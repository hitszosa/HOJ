- slug: 09-recursion-divide-p30-uasco
  seq: 30
  title: 谷仓的安保 UASCO
  difficulty: L1-入门
  category: 递归函数与分治初探
  tags:
  - 递归函数与分治初探
  - USACO
  - 深搜
  - 递归
  knowledge:
  - USACO
  - 深搜
  - 递归
  provenance: 东方博宜OJ
  statement: "Farmer John 给谷仓安装了一个新的安全系统，并且要给牛群中的每一个奶牛安排一个有效的密码。\n一个有效的密码由L(3 <= L
    <= 15)个小写字母(来自传统的拉丁字母集'a'...'z')组成，至少有一个元音('a', 'e', 'i', 'o', 或者 'u')，至少两个辅音(除去元音以外的音节)，并且有按字母表顺序出现的字母(例如，'abc'是有效的，而'bac'不是)
    。  \n给定一个期望长度L和C个小写字母，写一个程序，打印出所有的长度为L、能由这些字母组成的有效密码。密码必须按字母表顺序打印出来，一行一个。\n\n###
    输入格式\n第一行: 两个由空格分开的整数，L和C。 \n第二行: C个空格分开的小写字母，密码是由这个字母集中的字母来构建的。\n\n### 输出格式\n输出若干行，每一个输出行包括一个长度为L个字符的密码(没有空格)。输出行必须按照字母顺序排列。
    \ \n如果计算出超过25000个有效密码，你的程序只需输出前25000个有效密码，即使后面还存在有效密码。"
