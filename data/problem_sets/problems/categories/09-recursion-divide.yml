- slug: 09-recursion-divide-p04
  seq: 4
  title: 选数
  difficulty: L3-普及
  category: 递归函数与分治初探
  tags:
  - 递归函数与分治初探
  - 深度DFS
  - CSP普及组
  - 递归算法
  knowledge:
  - 深度DFS
  - CSP普及组
  - 递归算法
  provenance: 一本通基础篇 · CSP普及组
  statement: '已知 n 个整数 x1,x2,…,xn，以及一个整数 k（k＜n）。从 n 个整数中任选 k 个整数相加，可分别得到一系列的和。例如当
    n=4，k＝3，4 个整数分别为 3，7，12，19 时，可得全部的组合与它们的和为：

    3＋7＋12=22　　

    3＋7＋19＝29　　

    7＋12＋19＝38　　

    3＋12＋19＝34。

    现在，要求你计算出和为素数共有多少种。

    例如上例，只有一种的和为素数：3＋7＋19＝29。


    ### 输入格式

    键盘输入，格式为：

    n , k （1<=n<=20，k＜n）

    x1,x2，…,xn （1<=xi<=5000000）


    ### 输出格式

    屏幕输出，格式为：

    一个整数（满足条件的种数）。'
  samples:
  - input: '4 3

      3 7 12 19

      '
    output: '1

      '
  tests:
  - input: '4 3

      10 11 12 13

      '
    output: '0

      '
  - input: '8 4

      21 31 19 22 44 76 105 33

      '
    output: '13

      '
  - input: '9 7

      1 1 1 1 1 1 1 1 1

      '
    output: '36

      '
  - input: '3 2

      7 6 5

      '
    output: '2

      '
  - input: '10 2

      14 22 17 38 42 76 75 84 13 21

      '
    output: '12

      '
