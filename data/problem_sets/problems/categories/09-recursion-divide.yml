  statement: '经典的汉诺塔游戏相信很多同学都会玩的，规则就不用赘述，百科一下就OK。有三个柱子A，B，C，A柱子上套有n个大小不等的盘子，任意两个盘子，上面的盘子一定小于下面的盘子。现在请你编写程序计算如何将这n个盘子按照规则移到C柱子上，每次只能移动一个盘子，移动过程中可以借助B柱子，任意状态，各个柱子的盘子必须小盘在放在大盘子上面。现在输入两个正整数n和m，表示有n个盘子，请你输出第m步的移动方法。


    <a href="http://www.hannuota.cn" target="_blank">点击体验汉诺塔小游戏</a>


