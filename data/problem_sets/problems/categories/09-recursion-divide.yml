- slug: 09-recursion-divide-p24
  seq: 24
  title: 炸弹安放
  difficulty: L1-入门
  category: 递归函数与分治初探
  tags:
  - 递归函数与分治初探
  - 递归
  knowledge:
  - 递归
  provenance: 东方博宜OJ
  statement: "小蔡决定在小头家门口安放炸弹！！\n\n小头家门口有n个连续的格子排成一行，对于每个格子，小蔡可以决定放一颗炸弹或者不放。为了防止小头被炸死，小蔡不会在连续3个格子都放上炸弹。小蔡想知道一共有多少安放炸弹的方案(可以一个也不放)。\n\n由于方案数可能很多，所以你只需要方案个数mod
    55555就可以了。\n\n### 输入格式\n一个正整数，即n\n\n### 输出格式\n仅包含一个整数，即答案\n\n### 提示与数据范围\n对于样例1的解释，一共有4个格子，每个格子可以选择放或者不放，因此根据乘法原理共有2*2*2*2=16种方案，其中在（1，2，3）上放炸弹是不合法的，会炸死小头。同样（2，3，4）和（1，2，3，4）也都不合法，所以一共有16-3=13种方案\n\n13
    mod 55555=13，因此答案为13 \n\n【数据规模】\n 70%的数据，n≤20\n 100%的数据，n≤1000"
  samples:
  - input: '4

      '
    output: '13

      '
  tests:
  - input: '5

      '
    output: '24

      '
- slug: 09-recursion-divide-p25
  seq: 25
  title: 数迷
  difficulty: L1-入门
  category: 递归函数与分治初探
  tags:
  - 递归函数与分治初探
  - 递归
  - 深搜
  knowledge:
