  provenance: 洛谷精选题库
  statement: '有一个集合 M是这样生成的：

    (1) 已知 k是集合M的元素

    (2) 如果 y是 M的元素, 那么2y+1和 3y+1都是 M的元素；

    (3) 除了上述二种情况外，没有别的数能够成为M的一 个元素。

    问题：任意给定 k和 x，请判断 x是否是M的元素。这里k是无符号整数，x 不大于100000， 如果是，则输出 YES，否则输出 NO 。


    ### 输入格式

    输入整数k和x，中间用一个空格隔开


    ### 输出格式

    如果是，则输出 YES，否则输出 NO'
