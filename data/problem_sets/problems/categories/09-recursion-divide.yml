- slug: 09-recursion-divide-p01
  seq: 1
  title: 放苹果
  difficulty: L1-入门
  category: 递归函数与分治初探
  tags:
  - 递归函数与分治初探
  - 一本通在线评测
  knowledge:
  - 一本通在线评测
  provenance: 一本通基础篇
  statement: '把M个同样的苹果放在N个同样的盘子里，允许有的盘子空着不放，问共有多少种不同的分法？（用K表示）5，1，1和1，5，1 是同一种分法。


    ### 输入格式

    第一行是测试数据的数目t（0≤t≤20）。

    以下每行均包含二个整数M和N，以空格分开。1≤M，N≤10。


    ### 输出格式

    对输入的每组数据M和N，用一行输出相应的K。'
  samples:
  - input: '1

      7 3

      '
    output: '8

      '
  tests:
