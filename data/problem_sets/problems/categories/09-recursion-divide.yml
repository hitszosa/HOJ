- slug: 09-recursion-divide-p35-f704
  seq: 35
  title: 光荣的梦想F704
  difficulty: L1-入门
  category: 递归函数与分治初探
  tags:
  - 递归函数与分治初探
  - 分治
  knowledge:
  - 分治
  provenance: 洛谷精选题库
  statement: 'Prince对他在这片大陆上维护的秩序感到满意，于是决定启程离开艾泽拉斯。在他动身之前，Prince决定赋予King_Bette最强大的能量以守护世界、保卫这里的平衡与和谐。在那个时代，平衡是个梦想。因为有很多奇异的物种拥有各种不稳定的能量，平衡瞬间即被打破。KB决定求助于你，帮助他完成这个梦想。


    一串数列即表示一个世界的状态。


    平衡是指这串数列以升序排列。而从一串无序数列到有序数列需要通过交换数列中的元素来实现。KB的能量只能交换相邻两个数字。他想知道他最少需要交换几次就能使数列有序。


    ### 输入格式

    第一行为数列中数的个数n,第二行为n ≤ 10000个数。表示当前数列的状态。


    ### 输出格式

    输出一个整数，表示最少需要交换几次能达到平衡状态。


    ### 提示与数据范围

    加强数据：<span style="color: rgb(51, 51, 51);">$n \leq 5 \times 10^5$</span>'
  samples:
  - input: '4

      2 1 4 3

      '
    output: '2

      '
