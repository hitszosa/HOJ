problems:
- slug: 08-functions-p01-minval
  seq: 1
  title: 最小函数值 (minval)
  difficulty: L1-入门
  category: 函数设计与模块化编程
  tags:
  - 函数设计与模块化编程
  - 一本通在线评测
  knowledge:
  - 一本通在线评测
  provenance: 一本通基础篇
  statement: "有$n$个函数，分别为$F_1,F_2,...,F_n$。定义$F_i(x)=A_ix^2+B_ix+C_i(x∈N*)$。\n给定这些$A_i、B_i$和$C\\_i$，\n请求出所有函数的所有函数值中最小的$m$个（如有重复的要输出多个）。\n\n###
    输入格式\n第一行输入两个正整数$n$和$m$。  \n以下$n$行每行三个正整数，其中第$i$行的三个数分别位$A_i$、$B_i$和$C_i$。输入数据保证$A_i≤10，B_i≤100，C_i≤10000$。\n\n###
    输出格式\n将这$n$个函数所有可以生成的函数值排序后的前$m$个元素。这$m$个数应该输出到一行，用空格隔开。 \n\n### 提示与数据范围\n【数据规模】\n$n,m≤10000$。"
