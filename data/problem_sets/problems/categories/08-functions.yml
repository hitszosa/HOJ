  provenance: 一本通基础篇
  statement: '16 世纪法国外交家 Blaise de Vigenère 设计了一种多表密码加密算法 Vigenère 密码。Vigenère 密码的加密解密算法简单易用，且破译难度比较高，曾在美国南北战争中为南军所广泛使用。


    在密码学中，我们称需要加密的信息为明文，用M表示；称加密后的信息为密文，用C表示；而密钥是一种参数，是将明文转换为密文或将密文转换为明文的算法中输入的数据，记为k。
    在 Vigenère 密码中，密钥k是一个字母串，k=k_1,k_2,…,k_n​。当明文M=m_1,m_2,…,m_n​时，得到的密文C=c_1,c_2,…,c_n​，其中c_i​=m_i​®k_i​，运算®的规则如下表所示：


    ![0052A.png](/api/public/img/440ea78cc01c4276a619e22d0f713149.png)

    Vigenère 加密在操作时需要注意：1. ®运算忽略参与运算的字母的大小写，并保持字母在明文 M 中的大小写形式；2. 当明文 M 的长度大于密钥 k
    的长度时，将密钥 k 重复使用。例如，明文 M=Helloworld，密钥 k=abc 时，密文 C=Hfnlpyosnd。


    ![0052B.png](/api/public/img/45cb7110f4b849dca751d9f97f1ce481.png)


    ### 输入格式

    <span style="color: rgba(0, 0, 0, 0.87);">输入共2行。</span>


    <span style="color: rgba(0, 0, 0, 0.87);">第一行为一个字符串，表示密钥k，长度不超过100，其中仅包含大小写字母。第二行为一个字符串，表示经加密后的密文，长度不超过1000，其中仅包含大小写字母。</span>


    ### 输出格式

    <span style="color: rgba(0, 0, 0, 0.87);">输出共1行，一个字符串，表示输入密钥和密文所对应的明文。</span>


    ### 提示与数据范围

    【数据说明】


    <span style="color: rgba(0, 0, 0, 0.87);">对于100%的数据，输入的密钥的长度不超过100，输入的密文的长度不超过1000，且都仅包含英文字母。</span>


    <span style="color: rgba(0, 0, 0, 0.87);">'
  samples:
  - input: 'CompleteVictory

      Yvqgpxaimmklongnzfwpvxmniytm

      '
    output: 'Wherethereisawillthereisaway

      '
