  provenance: 东方博宜OJ
  statement: "输入三个整数，表示3条线段的长度，判断这三条线段能否构成三角形。能构成就输出'Yes'，否则输出'No'。\n \n三角形的判断标准是：任意两边之和要大于第三边，比如有一个三角形的三条边分别为：3
    5 7，这个三角形的三条边就满足3 + 5 > 7且3 + 7 > 5，且5 + 7 > 3，因此这三条边能够构成三角形；\n \n再比如，一个三角形的三条边为3
    8 5，那么因为3+5不满足大于8，就不能构成三角形。\n\n### 输入格式\n三个整数\n\n### 输出格式\nYes or No"
  samples:
  - input: '3 8 5

      '
    output: 'No

      '
  tests:
  - input: '4 3 5

      '
    output: 'Yes

      '
