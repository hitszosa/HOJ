  statement: '某军事单位由于作战需要，需将一个六位数按规则重新转换后传递，转换规则是：先将六位数分为前三位和后三位，然后比较，将较大的三位数放在前面，较小的三位数放在后面，重新组成一个六位数；请编程帮助该单位计算出转换后的六位数。


    比如：输入687523，那么前三位数687，后三位数523，由于前三位 > 后三位，因此不需要换位置，计算结果任然是687523；


    再比如：输入123468，那么前三位是123，后三位是468，由于前三位 < 后三位，因此需要换位置，得到新的6位数是468123。


    ### 输入格式

    一个六位整数。


    ### 输出格式

    输出按照规则计算的结果。'
  samples:
