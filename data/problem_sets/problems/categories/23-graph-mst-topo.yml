  seq: 2
  title: 联络员
  difficulty: L1-入门
  category: 图论算法·最小生成树与拓扑排序
  tags:
  - 图论算法·最小生成树与拓扑排序
  - 一本通在线评测
  knowledge:
  - 一本通在线评测
  provenance: 一本通基础篇
  statement: "Tyvj已经一岁了，网站也由最初的几个用户增加到了上万个用户，随着Tyvj网站的逐步壮大，管理员的数目也越来越多，现在你身为Tyvj管理层的联络员，希望你找到一些通信渠道，使得管理员两两都可以联络（直接或者是间接都可以）。Tyvj是一个公益性的网站，没有过多的利润，所以你要尽可能的使费用少才可以。
    \ 目前你已经知道，Tyvj的通信渠道分为两大类，一类是必选通信渠道，无论价格多少，你都需要把所有的都选择上；还有一类是选择性的通信渠道，你可以从中挑选一些作为最终管理员联络的通信渠道。数据保证给出的通行渠道可以让所有的管理员联通。\n\n###
    输入格式\n第一行n，m表示Tyvj一共有n个管理员，有m个通信渠道;  第二行到m+1行，每行四个非负整数，p,u,v,w 当p=1时，表示这个通信渠道为必选通信渠道；当p=2时，表示这个通信渠道为选择性通信渠道；u,v,w表示本条信息描述的是u，v管理员之间的通信渠道，u可以收到v的信息，v也可以收到u的信息，w表示费用。\n\n###
    输出格式\n最小的通信费用。 \n\n### 提示与数据范围\n【样例解释】\n1-2-3-4-1存在四个必选渠道，形成一个环，互相可以到达。需要让所有管理员联通，需要联通2号和5号管理员，选择费用为5的渠道，所以总的费用为9。\n【注意】\nU,v之间可能存在多条通信渠道，你的程序应该累加所有u,v之间的必选通行渠道\n【数据范围】\n对于30%的数据，n≤10,m≤100;\n对于50%的数据,
    n≤200,m≤1000\n对于100%的数据，n≤2000,m≤10000"
