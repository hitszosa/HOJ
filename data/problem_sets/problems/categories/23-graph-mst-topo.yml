- slug: 23-graph-mst-topo-p04-prime-cryptarithm
  seq: 4
  title: 牛式 Prime Cryptarithm
  difficulty: L1-入门
  category: 图论算法·最小生成树与拓扑排序
  tags:
  - 图论算法·最小生成树与拓扑排序
  - USACO
  knowledge:
  - USACO
  provenance: USACO官方题库
  statement: "下面是一个乘法竖式，如果用我们给定的那n个数字来取代*，可以使式子成立的话，我们就叫这个式子牛式。\n\n   &nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;
    \     ***\n    &nbsp;&nbsp;&nbsp;&nbsp;X&nbsp;&nbsp;     **  \n &nbsp;----------
    \ \n         &nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;***  \n        &nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;***
    \ \n &nbsp;----------  \n   &nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;     ****
    \ \n数字只能取代* ，当然第一位不能为0,况且给定的数字里不包括0。\n注意一下在美国的学校中教的“部分乘积”，第一部分乘积是第二个数的个位和第一个数的积，第二部分乘积是第二个数的十位和第一个数的乘积.\n写一个程序找出所有的牛式。\n\n###
    输入格式\n第一行：数字的个数n。\n第二行:N个用空格分开的数字（每个数字都属于{1,2,3,4,5,6,7,8,9}）。\n\n### 输出格式\n共一行，一个数字。表示牛式的总数。"
  samples:
  - input: "5  \n2 3 4 6 8\n"
    output: '1

      '
  tests:
  - input: '5

      2 3 4 6 8

      '
    output: '1

      '
  - input: '4

      2 3 5 7

      '
    output: '0

      '
  - input: '1

      1

      '
    output: '0

      '
  - input: '7

      4 1 2 5 6 7 3

      '
    output: '384

      '
  - input: '8

      9 1 7 3 5 4 6 8

      '
    output: '652

      '
- slug: 23-graph-mst-topo-p05-net
  seq: 5
  title: 局域网(net)
  difficulty: L4-提高
  category: 图论算法·最小生成树与拓扑排序
  tags:
  - 图论算法·最小生成树与拓扑排序
  - 最小生成树
  knowledge:
  - 最小生成树
  provenance: 洛谷精选题库
  statement: '某个局域网内有n(n≤100)台计算机，由于搭建局域网时工作人员的疏忽，现在局域网内的连接形成了回路，我们知道如果局域网形成回路那么数据将不停的在回路内传输，造成网络卡的现象。因为连接计算机的网线本身不同，所以有一些连线不是很畅通，我们用f(i,j)表示i,j之间连接的畅通程度(f(i,j)≤1000)，f(i,j)值越小表示i,j之间连接越通畅，f(i,j)为0表示i,j之间无网线连接。现在我们需要解决回路问题，我们将除去一些连线，使得网络中没有回路，并且被除去网线的Σf(i,j)最大，请求出这个最大值。


    ### 输入格式

    第一行两个正整数n k


    接下来的k行每行三个正整数i j m表示i,j两台计算机之间有网线联通，通畅程度为m。


    ### 输出格式

    一个正整数，Σf(i,j)的最大值。'
  samples:
  - input: '5 5

      1 2 8

      1 3 1

      1 5 3

      2 4 5

      3 4 2

      '
    output: '8

      '
