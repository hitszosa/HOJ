  provenance: 一本通提高篇
  statement: "**原题来自：ZJOI 2007**\n\n一个有向图 $G = (V,E)$ 称为半连通的 *(Semi-Connected)*，如果满足：$\\forall
    u,v\\in V$，满足 $u\\to v$ 或 $v\\to u$，即对于图中任意两点 $u,v$，存在一条 $u$ 到 $v$ 的有向路径或者从 $v$
    到 $u$ 的有向路径。\n\n若 $G'=(V',E')$ 满足，$E’$ 是 $E$ 中所有和 $V’$ 有关的边，则称 $G’$ 是 $G$ 的一个导出子图。若
    $G’$ 是 $G$ 的导出子图，且 $G’$ 半连通，则称 $G’$ 为 $G$ 的半连通子图。若 $G’$ 是 $G$ 所有半连通子图中包含节点数最多的，则称
    $G’$ 是 $G$ 的最大半连通子图。\n\n给定一个有向图 $G$，请求出 $G$ 的最大半连通子图拥有的节点数 $K$，以及不同的最大半连通子图的数目
