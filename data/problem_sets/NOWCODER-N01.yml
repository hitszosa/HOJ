- slug: nowcoder-n01-p13
  seq: 13
  title: 构造题
  knowledge:
  - 牛客大学专业机试全集
  difficulty: easy
  statement: '白浅妹妹需要构造一个 1 ~ n  的排列 a1, a2, . . . , an 。

    其中要求：

    - 排列中顺序对和逆序对的数量相等。

    - 输出符合上述要求的排列中字典序最小的方案。


    下面定义顺序对和逆序对：

    对于一组位置 (i, j)，  其中 i < j，若  ai  < aj，  则构成顺序对；  若ai  > aj，  则构成逆序对。


    ### 输入格式

    一行一个正整数 n ，表示排列的长度。其中保证 n是 4  的整数倍。


    ### 输出格式

    一行用空格分割的数字，表示答案的序列。


    ### 提示与数据范围

    ![image.png](/api/public/img/111a5771767e4a88840633a3fa1d1942.png)'
  samples:
  - input: '4

      '
    output: '1 4 3 2

      '
  tests:
  - input: '8

      '
    output: '1 2 7 8 6 5 4 3

      '
  - input: '12

      '
    output: '1 2 3 9 12 11 10 8 7 6 5 4

      '
  - input: '16

      '
    output: '1 2 3 4 10 16 15 14 13 12 11 9 8 7 6 5

      '
  - input: '20

      '
    output: '1 2 3 4 5 10 20 19 18 17 16 15 14 13 12 11 9 8 7 6

      '
  - input: '24

      '
    output: '1 2 3 4 5 6 9 24 23 22 21 20 19 18 17 16 15 14 13 12 11 10 8 7

      '
- slug: nowcoder-n01-p14
  seq: 14
  title: 武器选择
  knowledge:
  - 牛客大学专业机试全集
  difficulty: easy
  statement: '白浅妹妹在玩打怪游戏，  游戏共有 n  个关卡，  每通过一个关卡就会遇到一把武器，  它的代 号为 ai，  表示当你第 ai   次遇到代号为
    ai    的武器时，  才能够获得这把武器(代号相同的武 器可以认为是相同的武器)。


    现在有 m  次询问，  每次指定一个关卡区间  [L, R]，  在通过这些关卡之后(白浅妹妹是一个 高手，  所以这些关卡都能通过)，  白浅妹妹需要从获得的武器中选出
    ki   个(保证  ki  ≤ 4  )  来与怪物对决，你需要输出你有多少种组合方案。


    ### 输入格式

    第一行输入一个整数 n  表示关卡的数量。

    第二行输入 n  个整数 ai    $( 1 ≤ ai  ≤ 10^9 )$  表示第 i  个关卡遇到的武器的代号(保证任意两 个武器的代号互不相同)。

    第三行输入一个整数 m  表示挑战次数。

    接下来的 m  行， 每行三个正整数 Li , Ri , ki    (1  ≤  Li  ≤   Ri    ≤  n, 1 ≤ ki    ≤  4)  ，表示需要通
    过的关卡区间。


    ### 输出格式

    输出 m  行，每行一个整数，表示该次挑战武器组合方案数量。


    ### 提示与数据范围

    对于第一个询问，获得的武器为 1 ，选出一把武器的方案为 (1)

    对于第二个询问，没有获得的武器。

    对于第三个询问，获得的武器为 2，选出一把武器的方案为 (2)

    对于第四个询问，获得的武器为 1,2，选出一把武器的方案为 (1),(2) 两种。


