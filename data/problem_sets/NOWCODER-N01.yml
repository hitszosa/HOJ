- slug: nowcoder-n01-p18
  seq: 18
  title: 饮料难题
  knowledge:
  - 牛客大学专业机试全集
  difficulty: easy
  statement: '牛牛因为数学太差被老师赶出教室了，  虽然老师侵犯了牛牛的公平教育权，  但是牛牛在教室 外的小卖部大彻大悟，提升了自己的数学水平。


    故事是这样的：学校里的小卖部里有一个活动：只要有三个饮料瓶就可以换一瓶新的饮料。 现在牛牛从路边捡到了 10  个饮料瓶，  于是牛牛开始兑换饮料。他的兑换操作如下：  先用
    9  个饮料瓶换 3  瓶饮料，  喝完。然后手里有 4  个饮料瓶，  再拿出 3  个换 1  瓶饮料，  这时手 里有 2  个饮料瓶。牛牛再问老板借
    1  瓶饮料，  喝完之后又多了 1  个饮料瓶，  然后拿 3  个 饮料瓶换一瓶饮料还给老板。


    有借有还，再借不难。在这个过程中，牛牛总共喝了 5  瓶饮料。

    牛牛现在有 n  个饮料瓶，  小卖部的活动是每 k  个饮料瓶能换一瓶饮料，  牛牛最多能喝几 瓶饮料？


    牛牛已经大彻大悟，现在他拿这道题来考你，他希望你和他一样大彻大悟。


    ### 输入格式

    输入包含两个正整数 $n, k(1 < k ≤ min(n, 10^9))$


    ### 输出格式

    输出一行一个整数表示答案。


    ### 提示与数据范围

    ![image.png](/api/public/img/c2fe0d2a856c4dcda2d1c4d8f5a6c5f1.png)'
