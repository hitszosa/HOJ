  title: 学习乘法
  knowledge:
  - 牛客大学专业机试全集
  difficulty: easy
  statement: "牛牛上小学二年级了，  现在他开始学习乘法。经过老师的悉心教导，  牛牛已经能够算出 a, b    两个数字的乘积了。结果老师发现，\
    \  牛牛是偷偷拿到了老师的练习题答案，  背下答案之后才 说对了乘积！\n\n老师非常愤怒，  决定给牛牛出更多的乘法题目，  现在老师打算对 a, b\
    \                          这两个数字的数位进 行交换，这样就可以构造出新的数字来考牛牛乘法了。\n\n例如原来的两个数字 a,\
    \ b                         是 1234  和 5678 ，那么他可以交换两个数字的千位，使得两个 数字变成 5234  和 1678\
    \ ，然后再计算它们的乘积。\n\n老师只会交换相同位置的数位，  例如交换两个数字的千位，  或者交换两个数字的百位，  但是   不能交换一个数字的千位和另一个数字的百位(例如交换出\
    \  6234  和 5178  是不被允许的)。 老师可以进行无限次交换操作最终得到新的数字 a1, b1                       \
    \       ，请问新的两个数字的乘积最大是   多少。\n\n### 输入格式\n输入仅包含两个正整数a, b      ，保证两个数字的位数相同。\n\
    \n### 输出格式\n输出一行一个整数表示答案。\n\n### 提示与数据范围\n样例一说明\n交换百位，得到 372  和 183 ；或者交换十位和个位，得到\
    \  183  和 372，乘积是  68076\n\n样例二说明\n交换个位，或者交换百位和十位。\n\n|测试点编号 | a, b ≤ | 特殊性质|\n\
    |-|-|-|\n1 − 2|\t9\t\n3 − 4|\t99\t\n5 − 6|\t999\t\n7|\t999999|\t数位中不包含 0\n8 −\
    \ 10|\t999999"
