- slug: nowcoder-n01-p16
  seq: 16
  title: 神秘金币
  knowledge:
  - 牛客大学专业机试全集
  difficulty: easy
  statement: '在一个古老的文明中， 有一种神秘的金币。你是一名考古学家， 偶然发现了这个文明的遗址， 现在是时刻 0，有 n6T                         枚金币同时被发现。第
    i2T                         枚金币会在 ti    时刻后消失， 它的价值是 vi 。 然而，由于地形和其他条件的限制，你每个时刻只能收集一枚金币。此外，你的背包有限，
    你最多只能收集 k                         枚金币。现在，  你面前有 n                         枚金币，你的任务是确定如何选择金币，
    以便在收集的金币数量不超过 k                            的前提下，最大化你可以获取的金币价值总和。

    注意：金币被收集到背包之后就不会消失了。

    大样例：  sample.zip


    ### 输入格式

    第一行包含两个整数 n  和 k ，表示金币的数量和你最多可以收集的金币数量。

    第二行包含 n  个整数 ti    ，  表示每枚金币的存在时间。  ( 1 ≤  ti  ≤ n  且所有   ti 不重复)  第三行包含 n  个整数
    vi    ，  表示每枚金币的价值。


    ### 输出格式

    输出一个整数，表示你最多可以获取的金币价值总和。


    ### 提示与数据范围

    样例一说明

    你可以在第一个单位时间收集价值为 3 的金币，然后在第二个单位时间收集价值为 2 的金 币，所以最大的金币价值总和是 5。


    ![image.png](/api/public/img/055e8727c85c4108a14999f6c4c4875a.png)'
