- slug: nowcoder-n01-p12
  seq: 12
  title: 提取数字
  knowledge:
  - 牛客大学专业机试全集
  difficulty: easy
  statement: "给定一个字符串，请你提取出字符串中的所有数字，并且将每个数字加上  5  之后再求和。 请注意：数字可能包含前导零，详见样例 2。保证所有数字之和在\
    \  long long  的范围内\n\n### 输入格式\n首先输入一个数字表示测试点编号(如果是  −1  则表示是样例)，  然后输入一个长度不超过\
    \ $10^5$    的字符串。\n\n### 输出格式\n输出一行一个整数表示答案。\n\n### 提示与数据范围\n|测试点编号|\t特殊性质|\n\
    |-|-|\n1 − 2|\t仅包含数字\n3 − 6\t|不包含数字 0\n7 − 8|\t仅包含一个字母\n9 − 10|\t无特殊性质"
  samples:
  - input: '-1 a5b3c2

      '
    output: '25

      '
  - input: '-1 a00321b

      '
    output: '326

      '
  tests:
  - input: '1 5349

      '
    output: '5354

      '
  - input: '2 5

      '
    output: '10

      '
  - input: '3 

      '
    output: '109309760

      '
  - input: '4 

      '
    output: '115305577

      '
  - input: '5 

      '
    output: '84950982

