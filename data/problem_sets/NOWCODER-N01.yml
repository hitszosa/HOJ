  title: 学习加法
  knowledge:
  - 牛客大学专业机试全集
  difficulty: easy
  statement: '牛牛正在学习加法，  但是由于刚开始学习不太熟练，  所以他有可能犯错。具体来说，  在加法 的时候某两位相加会产生进位，但是牛牛有可能忘了进位。


    给定两个正整数 a, b  让牛牛做加法，  请问有多少种可能的答案，由于答案可能很大，请输 出答案对 109  + 7  取模后的结果。


    ### 输入格式

    输入包含两个正整数 a, b ，表示牛牛正在计算  a + b  的加法算式。


    ### 输出格式

    输出一行一个整数表示答案。


    ### 提示与数据范围

    样例一说明

    答案只有一种可能，就是 86


    样例二说明

    如果忘了个位向十位的进位，  那么会算出 90；  如果记得个位向十位的进位，  但是忘了十位 向百位的进位，则会算出 0 ；如果正确计算加法，会算出  100
    ，共三种可能。


    数据范围

    对于 10%  的数据，  1 ≤ a, b ≤ 92T。

    对于 20%  的数据，  1 ≤ a, b ≤ 992T

    对于 40%  的数据，  1 ≤ a, b ≤ 10182T

    对于另外 10%  的数据，  1 ≤ a, b ≤ 10^100 ，不产生进位。

    对于另外 10%  的数据，  1 ≤ a, b ≤ 10^100 ，只产生一次进位。

    对于 100%  的数据，  1 ≤ a, b ≤ 10^100000'
