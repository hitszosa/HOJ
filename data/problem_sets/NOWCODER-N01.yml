- slug: nowcoder-n01-p08
  seq: 8
  title: 除法来喽
  knowledge:
  - 牛客大学专业机试全集
  difficulty: easy
  statement: '给你一个长度为 n  的 a 数组，你需要构造一个长度相同的 b 数组，然后 a  数组的每个位置和 b 数组的对应位置做整除运算，得到一个长度为
    n  的 c  数组，也就是 ci   = $\left \lfloor \frac{a_i}{b_i} \right \rfloor \quad$。


    问 $c$ 数组中最多能有多少个相同元素。

    $a, b$ 都是正整数数组，且数组 $b$  中的每个元素必须在 $10^6$  范围内(可以等于 $10^6$ )。


    ### 输入格式

    输入包含两行。

    第一行输入一个正整数 n。

    第二行输入 n 个正整数，  第 i 个数表示 ai 。


    ### 输出格式

    输出一个数，表示 𝑐 数组中最多能有多少个相同元素。


    ### 提示与数据范围

    不能选择四个 2000000 使得所有除法的结果都是 1，因为 b 数组的元素最大是  1000000 可以选择  [666667, 999999,1000000,1000000]
    这四个数字， 使得对应位置做除法的结果都 为 3。


    【备注】

    对于测试点1 ~ 2：  $1 ≤ n ≤ 10^3 , 1 ≤ ai  ≤ 5 × 10^6$ 。

    对于测试点3 ~ 4：  $1 ≤ n ≤ 10^5 , 1 ≤ ai   < 10^6$：

    对于测试点5 ~ 10： $1 ≤ n ≤ 10^5 , 1 ≤ ai  ≤ 5 × 10^6$ 。'
