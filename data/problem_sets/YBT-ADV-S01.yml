  title: 「一本通 3.2 例 3」架设电话线
  knowledge:
  - 最短路
  - 二分
  - 早于 2010
  difficulty: hard
  statement: "**原题来自：USACO 2008 Jan. Silver**\n\n在郊区有 $N$ 座通信基站，$P$ 条双向电缆，第 $i$ 条电缆连接基站\
    \ $A_i$ 和 $B_i$。特别地，$1$ 号基站是通信公司的总站，$N$ 号基站位于一座农场中。现在，农场主希望对通信线路进行升级，其中升级第 $i$\
    \ 条电缆需要花费 $L_i$。\n\n电话公司正在举行优惠活动。农场主可以指定一条从 $1$ 号基站到 $N$ 号基站的路径，并指定路径上不超过 $K$\
    \ 条电缆，由电话公司免费提供升级服务。农场主只需要支付在该路径上剩余的电缆中，升级价格最贵的那条电缆的花费即可。求至少用多少钱能完成升级。 \n\n**一句话题意**\
    \ $\\ \\ $ 在加权无向图上求出一条从 $1$ 号结点到 $N$ 号结点的路径，使路径上第 $K + 1$ 大的边权尽量小。\n\n### 输入格式\n\
    第一行三个整数 $N,P,K$.\n\n接下来 $P$ 行，每行三个整数 $A_i,B_i,L_i$.\n\n### 输出格式\n若不存在从 $1$ 到 $N$\
    \ 的路径，输出 `-1`。否则输出所需最小费用。\n\n### 提示与数据范围\n$0 \\le K < N \\le 1000, 1 \\le P\\\
    le 2000$"
