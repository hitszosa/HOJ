- slug: ybt-adv-s01-p10-1-1-4
  seq: 10
  title: 「一本通 1.1 例 4」加工生产调度
  knowledge:
  - Special Judge
  - 贪心
  difficulty: hard
  statement: '某工厂收到了 $n$ 个产品的订单，这 $n$ 个产品分别在 A、B 两个车间加工，并且必须先在 A 车间加工后才可以到 B 车间加工。


    某个产品 $i$ 在 A，B 两车间加工的时间分别为 $A_i, B_i$。怎样安排这 $n$ 个产品的加工顺序，才能使总的加工时间最短。


    这里所说的加工时间是指：从开始加工第一个产品到最后所有的产品都已在 A，B 两车间加工完毕的时间。


    ### 输入格式

    第一行仅—个数据 $n$ ，表示产品的数量；


    接下来 $n$ 个数据是表示这 $n$ 个产品在 A 车间加工各自所要的时间；


    最后的 $n$ 个数据是表示这 $n$ 个产品在 B 车间加工各自所要的时间。


    ### 输出格式

    第一行一个数据，表示最少的加工时间；


    第二行是一种最小加工时间的加工顺序。


    ### 提示与数据范围

    对于 $100\%$的数据， $0<n<1000,1\le A_i,B_i\le 350$。


    本题的 SPJ 对行尾多余空格敏感，各位输出答案时不要留行尾多余空格~'
  samples:
  - input: '5

      3 5 8 7 10

      6 2 1 4 9

      '
    output: '34

      1 5 4 2 3

      '
