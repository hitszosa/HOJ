    output: "141\r\n8 1 10 9 15 13 7 6 12 5 11 14 4 2 3\r\n"
  - input: "16\r\n3 5 8 7 10 20 12 2 6 4 9 17 11 13 8 8\r\n6 3 2 5 8 15 14 13 12 11\
      \ 8 9 19 5 9 8\r\n"
    output: "149\r\n8 1 10 9 15 16 13 7 6 12 5 11 14 4 2 3\r\n"
