- slug: ybt-adv-s01-p09-1-1-3
  seq: 9
  title: 「一本通 1.1 例 3」喷水装置
  knowledge:
  - 贪心
  difficulty: hard
  statement: '**Source: [UVa 10382](http://private.vjudge.net/problem#OJId=All&probNum=&title=Watering&source=&category=all)**


    长 $L$ 米，宽 $W$ 米的草坪里装有 $n$ 个浇灌喷头。每个喷头都装在草坪中心线上（离两边各 $\frac{W}{2}$ 米）。我们知道每个喷头的位置（离草坪中心线左端的距离），以及它能覆盖到的浇灌范围。


    请问：如果要同时浇灌整块草坪，最少需要打开多少个喷头？


    ![Picture1](http://miao.su/images/2018/07/03/aaaf2f5d.png)


    ### 输入格式

    输入包含若干组测试数据。


    第一行一个整数 $T$ 表示数据组数；


    每组数据的第一行是整数 $n$、$L$ 和 $W$；


    接下来的 $n$ 行，每行包含两个整数，给出一个喷头的位置和浇灌半径（上面的示意图是样例输入第一组数据所描述的情况）。


    ### 输出格式

    对每组测试数据输出一个数字，表示要浇灌整块草坪所需喷头数目的最小值。如果所有喷头都打开也不能浇灌整块草坪，则输出 $-1$ 。


    ### 提示与数据范围

    对于 $100\%$ 的数据，$n \le 15000$'
