  seq: 12
  title: 「一本通 1.1 练习 1」数列极差
  knowledge:
  - 贪心
  - 堆
  difficulty: hard
  statement: "佳佳的老师在黑板上写了一个由 $n$ 个正整数组成的数列，要求佳佳进行如下操作：每次擦去其中的两个数 $a$ 和 $b$，然后在数列中加入一个数\
    \ $a\\times b+1$，如此下去直至黑板上剩下一个数为止，在所有按这种操作方式最后得到的数中，最大的为 $\\max$，最小的为 $\\min$，\
    \ 则该数列的极差定义为 $M=\\max -\\min$。\n\n由于佳佳忙于准备期末考试，现请你帮助他，对于给定的数列，计算出相应的极差 $M$。\n\n\
    ### 输入格式\n第一行为一个正整数 $n$ 表示正整数序列的长度；  \n\n在接下来的 $n$ 行中，每行输入一个正整数。  \n\n接下来的一行有一个\
    \ $0$，表示数据结束。\n\n### 输出格式\n输出只有一行，为相应的极差 $d$。\n\n### 提示与数据范围\n对于全部数据，$0\\le n\\\
    le 50000$，保证所有数据计算均在 $32$ 位有符号整数范围内。"
  samples:
  - input: '3

      1

      2

      3

      0

      '
    output: '2

      '
  tests:
  - input: "10\n3\n12\n5 \n4\n8\n19\n16\n5\n13\n2\n0\n"
    output: "63571141\r\n\r\n"
  - input: '6

      2

      3

      6

      5

      4

      1

      0


      '
    output: "528\r\n"
- slug: ybt-adv-s01-p13-1-1-2
  seq: 13
  title: 「一本通 1.1 练习 2」数列分段
  knowledge:
  - 贪心
  difficulty: hard
  statement: '对于给定的一个长度为 $N$ 的**正整数**数列 $A_i$，现要将其分成**连续的**若干段，并且**每段和**不超过 $M$（可以等于
    $M$），问最少能将其分成多少段使得满足要求。


    ### 输入格式

    第一行包含两个正整数 $N,M$，表示了数列 $A_i$ 的长度与每段和的最大值；


    第二行包含 $N$ 个空格隔开的非负整数 $A_i$。


    ### 输出格式

    输出文件仅包含一个正整数，输出最少划分的段数。


    ### 提示与数据范围

    对于 $20\%$ 的数据，有$N\le 10$；


    对于 $40\%$ 的数据，有$N\le 1000$；


    对于 $100\%$ 的数据，有 $N\le 10^5, M\le 10^9$，$M$ 大于所有数的最大值。'
  samples:
  - input: '5 6

      4 2 4 5 1

      '
    output: '3

      '
