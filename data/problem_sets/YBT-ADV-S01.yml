- slug: ybt-adv-s01-p05-1-2-2-best-cow-fence
  seq: 5
  title: 「一本通 1.2 例 2」Best Cow Fences
  knowledge:
  - 二分
  - 早于 2010
  - USACO Contest
  difficulty: hard
  statement: '**原题来自：USACO 2003 Mar. Green**


    给定一个长度为 $n$ 的非负整数序列 $A$ ，求一个平均数最大的，长度不小于 $L$ 的子段。


    ### 输入格式

    第一行用空格分隔的两个整数 $n$ 和 $L$；


    第二行为 $n$ 个用空格隔开的非负整数，表示 $A_i$。


    ### 输出格式

    输出一个整数，表示这个平均数的 $1000$ 倍。不用四舍五入，直接输出。


    ### 提示与数据范围

    $1 \leq n \leq 10^5,0 \leq A_i \leq 2000$。'
