problems:
- slug: ybt-adv-s01-p01-1-1-1
  seq: 1
  title: 「一本通 1.1 例 1」活动安排
  knowledge:
  - 贪心
  difficulty: hard
  statement: '设有 $n$ 个活动的集合 $E=\{1,2,..,n\}$，其中每个活动都要求使用同一资源，如演讲会场等，而在同一时间内只有一个活动能使用这一资源。每个活动
    $i$ 都有一个要求使用该资源的起始时间 $s_i$ 和一个结束时间 $f_i$，且 $s_i<f_i$。如果选择了活动 $i$ ，则它在时间区间 $[s_i,f_i)$
    内占用资源。若区间 $[s_i,f_i)$ 与区间 $[s_j,f_j)$ 不相交，则称活动 $i$ 与活动 $j$ 是相容的。也就是说，当 $f_i \leq
    s_j$ 或 $f_j \leq s_i$ 时，活动 $i$ 与活动 $j$ 相容。选择出由互相兼容的活动组成的最大集合。


    ### 输入格式

    第一行一个整数 $n$；


    接下来的 $n$ 行，每行两个整数 $s_i$ 和 $f_i$。


    ### 输出格式

    输出互相兼容的最大活动个数。


    ### 提示与数据范围

    $1 \leq n \leq 1000$'
