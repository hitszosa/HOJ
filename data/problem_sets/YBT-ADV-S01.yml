- slug: ybt-adv-s01-p19-3-3-1-word-rings
  seq: 19
  title: 「一本通 3.3 例 1」Word Rings
  knowledge:
  - 二分
  - 早于 2010
  - ICPC
  difficulty: hard
  statement: "**原题来自：Centrual Europe 2005**\n\n我们有 $n$ 个字符串，每个字符串都是由 `a` 至 `z` 的小写英文字母组成的。如果字符串\
    \ $A$ 的结尾两个字符刚好与字符串 $B$ 的开头两个字符匹配，那么我们称 $A$ 与 $B$ 能够相连（注意：$A$ 能与 $B$ 相连不代表 $B$\
    \ 能与 $A$ 相连）。我们希望从给定的字符串中找出一些，使得它们首尾相连形成一个环串（一个串首尾相连也算），我们想要使这个环串的平均长度最大。如下例：\n\
    \n>ababc  \n\nbckjaca  \n\ncaahoynaab\n\n第一个串能与第二个串相连，第二个串能与第三个串相连，第三个串能与第一个串相连，我们按照此顺序相连，便形成了一个环串，长度为\
    \ $5+7+10=22$（重复部分算两次），总共使用了 $3$ 个串，所以平均长度是 $\\frac{22}{3}\\approx 7.33$。\n\n\
    ### 输入格式\n本题有多组数据。\n\n每组数据的第一行，一个整数 $n$，表示字符串数量；  \n\n接下来 $n$ 行，每行一个长度小于等于 $1000$\
    \ 的字符串。\n\n读入以 $0$ 结束。\n\n### 输出格式\n若不存在环串，输出 `No solution`，否则输出最长的环串的平均长度。\n\n\
    只要答案与标准答案的差不超过 $0.01$，就视为答案正确。\n\n### 提示与数据范围\n对于全部数据，$1\\le n\\le 10^5$。"
