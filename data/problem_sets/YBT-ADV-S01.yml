- slug: ybt-adv-s01-p07-1-2-2
  seq: 7
  title: 「一本通 1.2 练习 2」扩散
  knowledge:
  - 二分
  - 搜索
  difficulty: hard
  statement: '一个点每过一个单位时间就会向 $4$ 个方向扩散一个距离，如图所示：两个点 $a$ 、$b$ 连通，记作 $e(a,b)$，当且仅当 $a$
    、$b$ 的扩散区域有公共部分。连通块的定义是块内的任意两个点 $u$、$v$ 都必定存在路径 $e(u,a_0),e(a_0,a_1),…e(a_k,v)$。


    给定平面上的 $n$ 个点，问最早什么时候它们形成一个连通块。


    <img src="https://i.loli.net/2018/07/03/5b3ac26b7a6a4.jpg" width="70%"/>


    ### 输入格式

    第一行一个数 $n$ ，以下 $n$ 行，每行一个点坐标。


    ### 输出格式

    输出仅一个数，表示最早的时刻所有点形成连通块。


    ### 提示与数据范围

    对于 $20\%$ 的数据，满足 $1 \leq n \leq 5,1 \leq X_i,Y_i \leq 50$；


    对于 $100\%$ 的数据，满足 $1 \leq n \leq 50,1 \leq X_i,Y_i \leq 10^9$。'
