- slug: dfby-p01-p04
  seq: 4
  title: 猜拳
  knowledge:
  - 分支问题
  difficulty: easy
  statement: '小T和小K在同一个小组，平时两人非常友爱，可每当轮到他们小组值日时，两人经常会为了扫地擦黑板之类的小事起争执，一旦争执起来，他们就通过古老的猜拳游戏石头、剪刀、布来决定胜负，胜的一方获得优先选择权，如小T胜了他总是选择擦黑板，因为他长得人高手长，擦起黑板来挥洒自如，相对而言扫地就费劲多了，由于扫帚很短，他要把腰弯得很低才能扫到地面。令小T烦恼的是他总是输多胜少，原因是小K常常在最后时刻变换手势，明明开始时是石头，可到了小T面前又变成了剪刀。小T想了很久也没能想出什么好办法，直到有一天小T去莱蒙看了电影《非诚勿扰》，影片中介绍了科学家秦奋发明“分歧终端机”的事迹，小T看完后深受启发，一回家就立刻着手制作起自己的“分歧终端机”来。小T的“分歧终端机”形状是一个全封闭的长方体盒子，盒子的上表面装有一个电子显示屏，用来显示结果，左右两侧各有一个开口，以供两位选手把手伸进去出招，盒子内部被一块木板隔成了左右两部分，两部分都装了一个键盘，键盘上有3个键，上面标有数字1、2、3，分别代表石头、剪刀、布，如果选手要出石头则按1号键，要出剪刀则按2号键，要出布则按3号键。猜拳开始前小T和小K分别在“分歧终端机”左右两侧入座，然后各伸一只手进去，此时小T会大喊一声“开始”，两位选手随即根据自己的意愿去按相应的键，如果第一次两人按的键相同，则不分胜负，继续第二次按键，直到决出胜负为止。小T因忙于硬件的采购和制作，顾不上给“分歧终端机”写判断胜负的程序，他希望你来帮他完成这个任务，<b>这个任务非常简单</b>，你可不能让小T失望哦～。


    ### 输入格式

    仅有一行包含两个用空格隔开的不超过3的自然数，表示小T和小K所按键上的数字，1表示石头，2表示剪刀，3表示布。<b>游戏规则是石头胜剪刀，剪刀胜布，布胜石头</b>。


    ### 输出格式

    仅有一行输出本次猜拳的结果，如果小T胜则输出“win”，如果小T输则输出“lose”，如果两人不分胜负则输出“tie”。注意输出时都用小写字母，<b>引号不要输出</b>。'
  samples:
  - input: '1 2

      '
    output: 'win

      '
  tests:
  - input: '3 2

      '
    output: 'lose

      '
