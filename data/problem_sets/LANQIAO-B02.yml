- slug: lanqiao-b02-p07
  seq: 7
  title: 算法训练 统计单词个数
  knowledge:
  - 蓝桥杯-算法训练
  difficulty: medium
  statement: '给出一个长度不超过200的由小写英文字母组成的字母串(约定;该字串以每行20个字母的方式输入，且保证每行一定为20个)。要求将此字母串分成k份
    (1<k<=40)，且每份中包含的单词个数加起来总数最大(每份中包含的单词可以部分重叠。当选用一个单词之后，其第一个字母不能再用。例 如字符串this中可包含this和is，选用this之后就不能包含th)。

    　　单词在给出的一个不超过6个单词的字典中。

    　　要求输出最大的个数。


    ### 输入格式

    第一行有二个正整数(p，k)

    p表示字串的行数;

    k表示分为k个部分。

    接下来的p行，每行均有20个字符。

    再接下来有一个正整数s，表示字典中单词个数。(1<=s<=6)

    接下来的s行，每行均有一个单词。


    ### 输出格式

    每行一个整数，分别对应每组测试数据的相应结果。


    ### 提示与数据范围

    长度不超过200，1<k<=40，字典中的单词数不超过6。'
