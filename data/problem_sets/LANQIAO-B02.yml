- slug: lanqiao-b02-p11-fbi
  seq: 11
  title: 算法训练 FBI树
  knowledge:
  - 蓝桥杯-算法训练
  difficulty: medium
  statement: '我们可以把由“0”和“1”组成的字符串分为三类：全“0”串称为B串，全“1”串称为I串，既含“0”又含“1”的串则称为F串。

    　　FBI树是一种二叉树，它的结点类型也包括F结点，B结点和I结点三种。由一个长度为2N的“01”串S可以构造出一棵FBI树T，递归的构造方法如下：

    　　1)T的根结点为R，其类型与串S的类型相同；

    　　2)若串S的长度大于1，将串S从中间分开，分为等长的左右子串S1和S2；由左子串S1构造R的左子树T1，由右子串S2构造R的右子树T2。

    　　现在给定一个长度为2N的“01”串，请用上述构造方法构造出一棵FBI树，并输出它的后序遍历序列。


    ### 输入格式

    第一行是一个整数N（0 <= N <= 10），第二行是一个长度为2N的“01”串。


    ### 输出格式

    包括一行，这一行只包含一个字符串，即FBI树的后序遍历序列。


    ### 提示与数据范围

    对于40%的数据，N <= 2；

    　　对于全部的数据，N <= 10。

    　　注：

    　　[1] 二叉树：二叉树是结点的有限集合，这个集合或为空集，或由一个根结点和两棵不相交的二叉树组成。这两棵不相交的二叉树分别称为这个根结点的左子树和右子树。

    　　[2] 后序遍历：后序遍历是深度优先遍历二叉树的一种方法，它的递归定义是：先后序遍历左子树，再后序遍历右子树，最后访问根。'
  samples:
  - input: '3

      10001011

      '
    output: 'IBFBBBFIBFIIIFF

      '
  tests:
  - input: '3

      10001011

      '
    output: 'IBFBBBFIBFIIIFF

      '
  - input: '0

      0

      '
    output: 'B

      '
  - input: '1

      10

      '
    output: 'IBF

      '
  - input: '2

      1011

      '
    output: 'IBFIIIF

      '
  - input: '2

      0101

      '
    output: 'BIFBIFF

      '
- slug: lanqiao-b02-p12
  seq: 12
  title: 算法训练 星际交流
  knowledge:
  - 蓝桥杯-算法训练
  difficulty: medium
  statement: '人类终于登上了火星的土地并且见到了神秘的火星人。人类和火星人都无法理解对方的语言，但是我们的科学家发明了一种用数字交流的方法。这种交流方法是这样
    的，首先，火星人把一个非常大的数字告诉人类科学家，科学家破解这个数字的含义后，再把一个很小的数字加到这个大数上面，把结果告诉火星人，作为人类的回 答。

    　　火星人用一种非常简单的方式来表示数字——掰手指。火星人只有一只手，但这只手上有成千上万的手指，这些手指排成一列，分别编号为1，2，3……。火星人的任意两根手指都能随意交换位置，他们就是通过这方法计数的。

    　　一个火星人用一个人类的手演示了如何用手指计数。如果把五根手指——拇指、食指、中指、无名指和小指分别编号为1，2，3，4和5，当它们按正常顺序排列 时，形成了5位数12345，当你交换无名指和小指的位置时，会形成5位数12354，当你把五个手指的顺序完全颠倒时，会形成54321，在所有能够形
    成的120个5位数中，12345最小，它表示1；12354第二小，它表示2；54321最大，它表示120。下表展示了只有3根手指时能够形成的6个 3位数和它们代表的数字：

    　　三进制数

    　　123

    　　132

    　　213

    　　231

    　　312

    　　321

    　　代表的数字

    　　1

    　　2

    　　3

    　　4

    　　5

    　　6

    　　现在你有幸成为了第一个和火星人交流的地球人。一个火星人会让你看他的手指，科学家会告诉你要加上去的很小的数。你的任务是，把火星人用手指表示的数与科 学家告诉你的数相加，并根据相加的结果改变火星人手指的排列顺序。输入数据保证这个结果不会超出火星人手指能表示的范围。


    ### 输入格式

    包括三行，第一行有一个正整数N，表示火星人手指的数目（1 <= N <= 10000）。

    第二行是一个正整数M，表示要加上去的小整数（1 <= M <= 100）。

    下一行是1到N这N个整数的一个排列，用空格隔开，表示火星人手指的排列顺序。


    ### 输出格式

    只有一行，这一行含有N个整数，表示改变后的火星人手指的排列顺序。每两个相邻的数中间用一个空格分开，不能有多余的空格。


    ### 提示与数据范围

    对于30%的数据，N<=15；

    　　对于60%的数据，N<=50；

    　　对于全部的数据，N<=10000；'
