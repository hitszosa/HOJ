- slug: lanqiao-b02-p39
  seq: 39
  title: 算法训练 摆动序列
  knowledge:
  - 蓝桥杯-算法训练
  difficulty: medium
  statement: '如果一个序列满足下面的性质，我们就将它称为摆动序列：

    　　1. 序列中的所有数都是不大于k的正整数；

    　　2. 序列中至少有两个数。

    　　3. 序列中的数两两不相等；

    　　4. 如果第i – 1个数比第i – 2个数大，则第i个数比第i – 2个数小；如果第i – 1个数比第i – 2个数小，则第i个数比第i – 2个数大。

    　　比如，当k = 3时，有下面几个这样的序列：

    　　1 2

    　　1 3

    　　2 1

    　　2 1 3

    　　2 3

    　　2 3 1

    　　3 1

    　　3 2

    　　一共有8种，给定k，请求出满足上面要求的序列的个数。


    ### 输入格式

    输入包含了一个整数k。（k<=20）


    ### 输出格式

    输出一个整数，表示满足要求的序列个数。'
  samples:
  - input: '3

      '
    output: '8

      '
  tests:
  - input: '1

      '
    output: '0

      '
  - input: '2

      '
    output: '2

      '
  - input: '5

      '
    output: '52

      '
  - input: '8

      '
    output: '494

      '
  - input: '10

      '
    output: '2026

      '
