- slug: lanqiao-b02-p34-hanoi
  seq: 34
  title: 算法训练 Hanoi汉诺塔问题
  knowledge:
  - 蓝桥杯-算法训练
  difficulty: medium
  statement: '如果将课本上的Hanoi塔问题稍做修改：仍然是给定N只盘子，3根柱子，但是允许每次最多移动相邻的M只盘子（当然移动盘子的数目也可以小于M）,最少需要多少次？

    　　例如N=5，M=2时，可以分别将最小的2个盘子、中间的2个盘子以及最大的一个盘子分别看作一个整体，这样可以转变为N=3，M=1的情况，共需要移动7次。


    ### 输入格式

    输入数据仅有一行，包括两个数N和M（0<=M<=N<=8）


    ### 输出格式

    仅输出一个数，表示需要移动的最少次数'
  samples:
  - input: '参考上文

      '
    output: '参考上文

      '
  tests:
  - input: '5 2

      '
    output: '7

      '
  - input: '6 2

      '
    output: '7

      '
  - input: '7 2

      '
    output: '15

      '
  - input: '8 2

      '
    output: '15

      '
  - input: '9 2

      '
    output: '31

      '
- slug: lanqiao-b02-p35
  seq: 35
  title: 算法训练 蜜蜂飞舞
  knowledge:
  - 蓝桥杯-算法训练
  difficulty: medium
  statement: '“两只小蜜蜂呀，飞在花丛中呀……”

    　　话说这天天上飞舞着两只蜜蜂，它们在跳一种奇怪的舞蹈。用一个空间直角坐标系来描述这个世界，那么这两只蜜蜂初始坐标分别为(x1,y1,z1)，(x2,y2,z2)　　。在接下来它们将进行n次飞行，第i次飞行两只蜜蜂分别按照各自的速度向量飞行ti个单位时间。对于这一现象，玮玮已经观察了很久。他很想知道在蜜蜂飞舞结束时，两只蜜蜂的距离是多少。现在他就求教于你，请你写一个程序来帮他计算这个结果。


    ### 输入格式

    第一行有且仅有一个整数n，表示两只蜜蜂将进行n次飞行。

    接下来有n行。

    　　第i行有7个用空格分隔开的整数ai,bi,ci,di,ei,fi,ti　　，表示第一只蜜蜂单位时间的速度向量为(ai,bi,ci) ，第二只蜜蜂单位时间的速度向量为(di,ei,fi)
    ，它们飞行的时间为ti 。

    　　最后一行有6个用空格分隔开的整数x1,y1,z1,x2,y2,z2，如题所示表示两只蜜蜂的初始坐标。


    ### 输出格式

    输出仅包含一行，表示最后两只蜜蜂之间的距离。保留4位小数位。'
