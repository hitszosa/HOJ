problems:
- slug: lanqiao-b02-p01
  seq: 1
  title: 算法训练 会议中心
  knowledge:
  - 蓝桥杯-算法训练
  difficulty: medium
  statement: "会议中心　　Siruseri政府建造了一座新的会议中心。许多公司对租借会议中心的会堂很感兴趣，他们希望能够在里面举行会议。\n 　　对于一个客户而言，仅当在开会时能够独自占用整个会堂，他才会租借会堂。会议中心的销售主管认为：最好的策略应该是将会堂租借给尽可能多的客户。显然，有可能存在不止一种满足要求的策略。\n\
    \ 　　例如下面的例子。总共有4个公司。他们对租借会堂发出了请求，并提出了他们所需占用会堂的起止日期（如下表所示）。 <table cellspacing=\"\
    0\" cellpadding=\"2px\" style=\"border-collapse:collapse;\" class=\"table table-striped\
    \ table-horver\"><tbody><tr style=\"border:solid 1.0pt\"><td style=\"border:solid\
    \ 1.0pt\">\n </td><td style=\"border:solid 1.0pt\">开始日期\n </td><td style=\"border:solid\
    \ 1.0pt\">结束日期\n </td></tr><tr style=\"border:solid 1.0pt\"><td style=\"border:solid\
    \ 1.0pt\">公司1\n </td><td style=\"border:solid 1.0pt\">4\n </td><td style=\"border:solid\
    \ 1.0pt\">9\n </td></tr><tr style=\"border:solid 1.0pt\"><td style=\"border:solid\
    \ 1.0pt\">公司2\n </td><td style=\"border:solid 1.0pt\">9\n </td><td style=\"border:solid\
    \ 1.0pt\">11\n </td></tr><tr style=\"border:solid 1.0pt\"><td style=\"border:solid\
    \ 1.0pt\">公司3\n </td><td style=\"border:solid 1.0pt\">13\n </td><td style=\"border:solid\
    \ 1.0pt\">19\n </td></tr><tr style=\"border:solid 1.0pt\"><td style=\"border:solid\
    \ 1.0pt\">公司4\n </td><td style=\"border:solid 1.0pt\">10\n </td><td style=\"border:solid\
    \ 1.0pt\">17\n </td></tr></tbody></table>\n \n 　　上例中，最多将会堂租借给两家公司。租借策略分别是租给公司1和公司3，或是公司2和公司3，也可以是公司1和公司4。注意会议中心一天最多租借给一个公司，所以公司1和公司2不能同时租借会议中心，因为他们在第九天重合了。\n\
    \ 　　销售主管为了公平起见，决定按照如下的程序来确定选择何种租借策略：首先，将租借给客户数量最多的策略作为候选，将所有的公司按照他们发出请求的顺序编号。对于候选策略，将策略中的每家公司的编号按升序排列。最后，选出其中字典序最小[1]的候选策略作为最终的策略。\n\
    \ 　　例中，会堂最终将被租借给公司1和公司3：3个候选策略是{(1,3),(2,3),(1,4)}。而在字典序中(1,3)<(1,4)<(2,3)。\n\
    \ 　　你的任务是帮助销售主管确定应该将会堂租借给哪些公司。<b></b>\n\n### 输入格式\n输入的第一行有一个整数N，表示发出租借会堂申请的公司的个数。第2到第N+1行每行有2个整数。第i+1行的整数表示第i家公司申请租借的起始和终止日期。对于每个公司的申请，起始日期为不小于1的整数，终止日期为不大于109的整数。\n\
    \n### 输出格式\n输出的第一行应有一个整数M，表示最多可以租借给多少家公司。第二行应列出M个数，表示最终将会堂租借给哪些公司。\n\n[1] 字典序指在字典中排列的顺序，如果序列l<sub>1</sub>是序列l<sub>2</sub>的前缀，或者对于l<sub>1</sub>和l<sub>2</sub>的第一个不同位置j，l<sub>1</sub>[j]<l<sub>2</sub>[j]，则l<sub>1</sub>比l<sub>2</sub>小。\n\
    \n### 提示与数据范围\n对于50%的输入，N≤3000。\n在所有输入中，N≤200000。"
