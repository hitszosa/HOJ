- slug: lanqiao-b02-p41
  seq: 41
  title: 算法训练 瓷砖铺放
  knowledge:
  - 蓝桥杯-算法训练
  difficulty: medium
  statement: '有一长度为N(1<=Ｎ<=10)的地板，给定两种不同瓷砖：一种长度为1，另一种长度为2，数目不限。要将这个长度为N的地板铺满，一共有多少种不同的铺法？

    　　例如，长度为4的地面一共有如下5种铺法：

    　　4=1+1+1+1

    　　4=2+1+1

    　　4=1+2+1

    　　4=1+1+2

    　　4=2+2

    　　编程用递归的方法求解上述问题。


    ### 输入格式

    只有一个数N，代表地板的长度


    ### 输出格式

    输出一个数，代表所有不同的瓷砖铺放方法的总数'
  samples:
  - input: '4

      '
    output: '5

      '
  tests:
  - input: '10

      '
    output: '89

      '
  - input: '1

      '
    output: '1

      '
- slug: lanqiao-b02-p42
  seq: 42
  title: 算法训练 幂方分解
  knowledge:
  - 蓝桥杯-算法训练
  difficulty: medium
  statement: '任何一个正整数都可以用2的幂次方表示。例如：

    　　137=27+23+20

    　　同时约定方次用括号来表示，即ab 可表示为a（b）。

    　　由此可知，137可表示为：

    　　2（7）+2（3）+2（0）

    　　进一步：7= 22+2+20 （21用2表示）

    　　3=2+20

    　　所以最后137可表示为：

    　　2（2（2）+2+2（0））+2（2+2（0））+2（0）

    　　又如：

    　　1315=210 +28 +25 +2+1

    　　所以1315最后可表示为：

    　　2（2（2+2（0））+2）+2（2（2+2（0）））+2（2（2）+2（0））+2+2（0）


    ### 输入格式

    输入包含一个正整数N（N<=20000），为要求分解的整数。


    ### 输出格式

    程序输出包含一行字符串，为符合约定的n的0，2表示（在表示中不能有空格）'
  samples:
  - input: '无

      '
    output: '无

      '
  tests:
  - input: '73

      '
    output: '2(2(2)+2)+2(2+2(0))+2(0)

      '
  - input: '136

      '
    output: '2(2(2)+2+2(0))+2(2+2(0))

      '
  - input: '255

      '
    output: '2(2(2)+2+2(0))+2(2(2)+2)+2(2(2)+2(0))+2(2(2))+2(2+2(0))+2(2)+2+2(0)

      '
  - input: '1384

      '
    output: '2(2(2+2(0))+2)+2(2(2+2(0)))+2(2(2)+2)+2(2(2)+2(0))+2(2+2(0))

      '
