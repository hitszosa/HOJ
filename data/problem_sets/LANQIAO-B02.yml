    output: "43 50 \n69 6\n"
- slug: lanqiao-b02-p04
  seq: 4
  title: 算法训练 纪念品分组
  knowledge:
  - 蓝桥杯-算法训练
  difficulty: medium
  statement: '元旦快到了，校学生会让乐乐负责新年晚会的纪念品发放工作。为使得参加晚会的同学所获得的纪念品价值 相对均衡，他要把购来的纪念品根据价格进行分组，但每组最多只能包括两件纪念品，并且每组纪念品的价格之和不能超过一个给定的整数。为了保证在尽量短的时
    间内发完所有纪念品，乐乐希望分组的数目最少。


    你的任务是写一个程序，找出所有分组方案中分组数最少的一种，输出最少的分组数目。


    ### 输入格式

    输入包含n+2行：

    第1行包括一个整数w，为每组纪念品价格之和的上限。

    第2行为一个整数n，表示购来的纪念品的总件数。

    第3~n+2行每行包含一个正整数pi (5 <= pi <= w)，表示所对应纪念品的价格。


    ### 输出格式

    输出仅一行，包含一个整数，即最少的分组数目。


    ### 提示与数据范围

    50%的数据满足：1 <= n <= 15

    100%的数据满足：1 <= n <= 30000, 80 <= w <= 200'
