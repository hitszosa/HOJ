    第一行为一个整数n，表示集合A中的元素个数。

    第二行有n个互不相同的用空格隔开的整数，表示集合A中的元素。

    第三行为一个整数m，表示集合B中的元素个数。

    第四行有m个互不相同的用空格隔开的整数，表示集合B中的元素。

    集合中的所有元素均为int范围内的整数，n、m<=1000。


