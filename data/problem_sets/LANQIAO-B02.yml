- slug: lanqiao-b02-p02
  seq: 2
  title: 算法训练 删除多余括号
  knowledge:
  - 蓝桥杯-算法训练
  difficulty: medium
  statement: '从键盘输入一个含有括号的四则运算表达式，要求去掉可能含有的多余的括号，结果要保持原表达式中变量和运算符的相对位置不变，且与原表达式等价,不要求化简。另外不考虑&#039;+&#039;　　&#039;-&#039;用作正负号的情况，即输入表达式不会出现(+a)或(-a)的情形。


    ### 输入格式

    表达式字符串，长度不超过255,并且不含空格字符。表达式中的所有变量都是单个小写的英文字母, 运算符只有加+减-乘*除/等运算符号。


    ### 输出格式

    去掉多余括号后的表达式'
  samples:
  - input: '参考上文

      '
    output: '参考上文

      '
  tests:
  - input: 'a+(b+c)

      '
    output: 'a+b+c

      '
  - input: '(a*b)+c/d

      '
    output: 'a*b+c/d

      '
  - input: 'a+b/(c+d)

      '
    output: 'a+b/(c+d)

      '
  - input: 'a-(b+c)

      '
    output: 'a-(b+c)

      '
  - input: 'a+(b+c)/d

      '
    output: 'a+(b+c)/d

      '
- slug: lanqiao-b02-p03
  seq: 3
  title: 算法训练 矩阵乘方
  knowledge:
  - 蓝桥杯-算法训练
  difficulty: medium
  statement: '给定一个矩阵A,一个非负整数b和一个正整数m，求A的b次方除m的余数。

    　　其中一个nxn的矩阵除m的余数得到的仍是一个nxn的矩阵，这个矩阵的每一个元素是原矩阵对应位置上的数除m的余数。

    　　要计算这个问题，可以将A连乘b次，每次都对m求余，但这种方法特别慢，当b较大时无法使用。下面给出一种较快的算法(用A^b表示A的b次方)：

    　　若b=0，则A^b%m=I%m。其中I表示单位矩阵。

    　　若b为偶数，则Ab%m=(A(b/2)%m)^2%m，即先把A乘b/2次方对m求余，然后再平方后对m求余。

    　　若b为奇数，则Ab%m=(A(b-1)%m)*a%m，即先求A乘b-1次方对m求余，然后再乘A后对m求余。

    　　这种方法速度较快，请使用这种方法计算A^b%m，其中A是一个2x2的矩阵，m不大于10000。


    ### 输入格式

    输入第一行包含两个整数b, m，第二行和第三行每行两个整数，为矩阵A。


    ### 输出格式

    输出两行，每行两个整数，表示A^b^ % m 的值。'
  samples:
  - input: '2 2

      1 1

      0 1

      '
    output: '1 0

      0 1

      '
  tests:
  - input: "0 1\n41 18467 \n6334 26500\n"
    output: "0 0 \n0 0\n"
  - input: "1 2134\n19169 15724 \n11478 29358\n"
    output: "2097 786 \n808 1616\n"
  - input: "1234114 1234\n26962 24464 \n5705 28145\n"
    output: "1166 150 \n1197 533\n"
  - input: "324091 9391\n23281 16827 \n9961 491\n"
    output: "3805 9077 \n2037 7374\n"
