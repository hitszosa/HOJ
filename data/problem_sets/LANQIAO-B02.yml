- slug: lanqiao-b02-p09
  seq: 9
  title: 算法训练 麦森数
  knowledge:
  - 蓝桥杯-算法训练
  difficulty: medium
  statement: '形如2P-1的素数称为麦森数，这时P一定也是个素数。但反过来不一定，即如果P是个素数，2P-1不一定也是素数。到1998年底，人们已找到了37个麦森数。最大的一个是P=3021377，它有909526位。麦森数有许多重要应用，它与完全数密切相关。

    　　任务：从文件中输入P（1000<P<3100000），计算2P-1的位数和最后500位数字（用十进制高精度数表示）


    ### 输入格式

    文件中只包含一个整数P（1000<P<3100000）


    ### 输出格式

    第一行：十进制高精度数2P-1的位数。

    第2-11行：十进制高精度数2P-1的最后500位数字。（每行输出50位，共输出10行，不足500位时高位补0）

    不必验证2P-1与P是否为素数。'
