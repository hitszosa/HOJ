  difficulty: medium
  statement: '一个旅行家想驾驶汽车以最少的费用从一个城市到另一个城市（假设出发时油箱是空的）。给定两个城市之间的距离D1、汽车油箱的容量C（以升为单位）、每升汽油能行驶的距离D2、出发点每升汽油价格P和沿途油站数N（N可以为零），油站i离出发点的距离Di、每升汽油价格Pi（i=1，2，……N）。计算结果四舍五入至小数点后两位。如果无法到达目的地，则输出“No
    Solution”。


    ### 输入格式

    第一行为4个实数D1、C、D2、P与一个非负整数N；

    接下来N行，每行两个实数Di、Pi。


