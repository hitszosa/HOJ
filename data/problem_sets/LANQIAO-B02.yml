- slug: lanqiao-b02-p36
  seq: 36
  title: 算法训练 数组查找及替换
  knowledge:
  - 蓝桥杯-算法训练
  difficulty: medium
  statement: "给定某整数数组和某一整数b。要求删除数组中可以被b整除的所有元素，同时将该数组各元素按从小到大排序。如果数组元素数值在A到Z的ASCII之间，替换为对应字母。元素个数不超过100，b在1至100之间。\n\
    \n### 输入格式\n第一行为数组元素个数和整数b\n 第二行为数组各个元素 。\n\n### 输出格式\n按照要求输出"
  samples:
