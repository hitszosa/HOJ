- slug: lanqiao-b02-p15
  seq: 15
  title: 算法训练 开心的金明
  knowledge:
  - 蓝桥杯-算法训练
  difficulty: medium
  statement: "金明今天很开心，家里购置的新房就要领钥匙了，新房里有一间他自己专用的很宽敞的房间。更让他高兴的是，妈妈昨天对他说：“你的房间需要购买哪些物品，怎\
    \ 么布置，你说了算，只要不超过N元钱就行”。今天一早金明就开始做预算，但是他想买的东西太多了，肯定会超过妈妈限定的N元。于是，他把每件物品规定了一 个重要度，分为5等：用整数1~5表示，第5等最重要。他还从因特网上查到了每件物品的价格（都是整数元）。他希望在不超过N元（可以等于N元）的前提\
    \ 下，使每件物品的价格与重要度的乘积的总和最大。\n 　　设第j件物品的价格为v[j]，重要度为w[j]，共选中了k件物品，编号依次为 j1，j2，……，jk，则所求的总和为：\n\
    \ 　　v[j1]*w[j1]+v[j2]*w[j2]+ …+v[jk]*w[jk]。（其中*为乘号）\n 　　请 你帮助金明设计一个满足要求的购物单。\n\
    \n### 输入格式\n输入文件 的第1行，为两个正整数，用一个空格隔开：\n　　N m\n　　（其中N（<30000）表示总钱 数，m（<25）为希望购买物品的个数。）\n\
    　　从第2行到第m+1行，第j行给出了编号为j-1的物品的基本数据，每行有2个非负整数\n　　v p\n　　（其中v表示该物品的价格(v<=10000)，p表示该物品的重要度(1~5)）\n\
    \n### 输出格式\n输出文件只有一个正整数，为不超过总钱数的物品的价格与重要度乘积的总和的最大值（<100000000）。"
