- slug: lanqiao-b02-p08-car
  seq: 8
  title: 算法训练 Car的旅行路线
  knowledge:
  - 蓝桥杯-算法训练
  difficulty: medium
  statement: '到暑假了，住在城市A的Car想和朋友一起去城市B旅游。她知道每个城市都有四个飞机场，分别位于一个矩形的四个顶点上，同一个城市中两个机场之间有一
    条笔直的高速铁路，第I个城市中高速铁路了的单位里程价格为Ti，任意两个不同城市的机场之间均有航线，所有航线单位里程的价格均为t。

    那么Car应如何安排到城市B的路线才能尽可能的节省花费呢?她发现这并不是一个简单的问题，于是她来向你请教。

    找出一条从城市A到B的旅游路线，出发和到达城市中的机场可以任意选取，要求总的花费最少。


    ### 输入格式

    第一行有四个正整数s，t，A，B。

    　　S表示城市的个数，t表示飞机单位里程的价格，A，B分别为城市A，B的序号，(1<=A，B<=S)。

    　　接下来有S行，其中第I行均有7个正整数xi1，yi1，xi2，yi2，xi3，yi3，Ti，这当中的(xi1，yi1)，(xi2，yi2)，(xi3，yi3)分别是第I个城市中任意三个机场的坐标，T
    I为第I个城市高速铁路单位里程的价格。3


    ### 输出格式

    共有n行，每行一个数据对应测试数据，保留一位小数。0<S<=100'
